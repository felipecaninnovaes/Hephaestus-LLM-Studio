defaults:
  headroom_gb: 2
  measure_margin: 1.25
  default_train_gb: 16
entries:
  # ── Difusão train (ADR-0018) ──
  - { engine: diffusion, model: flux-2-klein-4b, mode: train, vram_min_gb: 8 }
  - { engine: diffusion, model: flux2-klein-4b, mode: train, vram_min_gb: 8 }
  - { engine: diffusion, model: flux, mode: train, vram_min_gb: 8 }
  - { engine: diffusion, model: sdxl, mode: train, vram_min_gb: 8 }
  - { engine: diffusion, model: sd15, mode: train, vram_min_gb: 5 }
  - { engine: diffusion, model: flux-2-klein-9b, mode: train, vram_min_gb: 10, quantization: 4bit, note: "FLUX.2 Klein base 9B. vram_min_gb exclui headroom (manager soma +2 => required 12, cabe na RTX 3060 12GB). Pico real medido 11,9 GiB. Spike RTX 3060 12GB (2026-10-06): 4-bit, batch 1, 768/1024 px, rank 16/32 OK SOMENTE com text encoder unload; pico 11,86-11,90 GiB (precompute de embeds), loop 7,4-9,0 GiB; 2,0x o tempo/step do 4B. Flags default => OOM." }
  - { engine: diffusion, model: sdxl-1.0, mode: train, vram_min_gb: 20 }
  - { engine: diffusion, model: qwen-image-2.1, mode: train, vram_min_gb: 8, quantization: 4bit, note: "Qwen3-VL-8B text encoder 4-bit (~5,1 GiB) descarregado de verdade apos o precompute de embeds; prompt de amostra pre-computado no cache. vram_min_gb exclui headroom (manager soma +2 => required 10, cabe na RTX 3060 12GB). Medido RTX 3060 12GB (2026-10-07): 4-bit, batch 1, 3 epocas com amostra baseline + por epoca, 8 imagens sinteticas; 768/rank 16 e 1024/rank 32 exit 0. Pico global 9925 MiB (~9,7 GiB, carga/precompute com encoder residente); loop de treino pos-unload ~7,3 GiB (1024/r32) e ~6,8 GiB (768/r16). Margem real com dataset de producao pode ser menor." }
  # ── Difusão generate (ADR-0023 D8) — valores espelhados do handler ──
  - { engine: diffusion, model: flux-2-klein-4b, mode: generate, vram_min_gb: 8 }
  - { engine: diffusion, model: flux2-klein-4b, mode: generate, vram_min_gb: 8 }
  - { engine: diffusion, model: flux-2-klein-9b, mode: generate, vram_min_gb: 10, quantization: 4bit, note: "vram_min_gb exclui headroom (manager soma +2 => required 12). Pico real medido 10,4 GiB. Spike RTX 3060 12GB (2026-10-06): geracao 4-bit real 1024px/28 steps, 7,3 s/it." }
  - { engine: diffusion, model: sdxl, mode: generate, vram_min_gb: 8 }
  - { engine: diffusion, model: sd15, mode: generate, vram_min_gb: 6 }
  - { engine: diffusion, model: qwen-image-2.1, mode: generate, vram_min_gb: 8, note: "OBSOLETO/enganoso: daemon de geracao quente esta desabilitado nesta versao (generation/runner.py retorna _die() explicito, commit 19b6e78; ver tasks/backlog.md 'Daemon de geracao Qwen-Image-2.1 nativo'). Linha mantida como registro para quando a fatia futura implementar geracao." }
  # ── YOLO train & predict ──
  - { engine: yolo, model: yolo11n, mode: train, vram_min_gb: 6 }
  - { engine: yolo, model: yolo11m, mode: train, vram_min_gb: 10 }
  - { engine: yolo, model: predict, mode: predict, vram_min_gb: 4 }
  # ── Modos auxiliares ──
  - { engine: autotracker, model: mock, mode: autotrack, vram_min_gb: 4 }
  - { engine: autolabel, model: mock, mode: autolabel, vram_min_gb: 4 }
  - { engine: autolabel, model: florence-2-base, mode: autolabel, vram_min_gb: 6 }
  # ── CLIP ──
  - { engine: clip, model: ViT-B-32, mode: train, vram_min_gb: 10 }

# ── Feature flags de performance (adr-difusao-vram) ──
features:
  - { engine: diffusion, feature: text_encoder_unload, default: false }
