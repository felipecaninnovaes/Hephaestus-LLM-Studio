name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: felipecaninnovaes
  NAMESPACE: hephaestus

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: principal
            context: .
            dockerfile: services/api-principal/Dockerfile
          - name: manager
            context: .
            dockerfile: services/manager/Dockerfile
          - name: orchestrator
            context: .
            dockerfile: services/orchestrator/Dockerfile
          - name: web
            context: .
            dockerfile: apps/web/Dockerfile
          - name: embedder
            context: engines/trainer-clip
            dockerfile: engines/trainer-clip/Dockerfile
          - name: trainer-yolo
            context: engines/trainer-yolo
            dockerfile: engines/trainer-yolo/Dockerfile
          - name: trainer-difusao
            context: engines/trainer-difusao
            dockerfile: engines/trainer-difusao/Dockerfile
          - name: trainer-yolo-gpu
            context: engines/trainer-yolo
            dockerfile: engines/trainer-yolo/Dockerfile.gpu
            gpu: true
            target-name: trainer-yolo
          - name: trainer-difusao-gpu
            context: engines/trainer-difusao
            dockerfile: engines/trainer-difusao/Dockerfile.gpu
            gpu: true
            target-name: trainer-difusao
          - name: web
            context: .
            dockerfile: apps/web/Dockerfile
          - name: s3-init
            context: infra
            dockerfile: infra/Dockerfile.s3-init
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Aceita o secret REGISTRY_TOKEN (mesmo nome do Gitea) ou o GITHUB_TOKEN nativo com packages:write
          password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Resolve Image Name and Tags
        id: meta
        run: |
          RAW_NAME="${{ matrix.target-name || matrix.name }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.NAMESPACE }}-${RAW_NAME}"
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          SHA_SHORT=$(git rev-parse --short "$GITHUB_SHA")

          if [ "${{ matrix.gpu }}" = "true" ]; then
            TAGS="${IMAGE}:gpu,${IMAGE}:gpu-${SHA_SHORT}"
          else
            TAGS="${IMAGE}:latest,${IMAGE}:${SHA_SHORT}"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
