<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniVision Studio — AI Training & Annotation Suite</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
            }
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'IBM Plex Mono', 'ui-monospace', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- React 18, ReactDOM & Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>

  <style>
    :root {
      --bg: oklch(13.5% 0.012 260);
      --surface: oklch(17.5% 0.016 260);
      --surface-elevated: oklch(21.5% 0.02 260);
      --fg: oklch(96% 0.005 260);
      --muted: oklch(65% 0.015 260);
      --border: oklch(26% 0.018 260);
      --accent: oklch(68% 0.20 150);
      --accent-glow: oklch(68% 0.20 150 / 22%);
    }

    * {
      box-sizing: border-box;
    }

    body {
      background-color: #090c12;
      color: #f1f3f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Tipografia de Alta Precisão & Anti-Slop */
    .tracking-caps {
      letter-spacing: 0.08em;
    }
    
    .tracking-display {
      letter-spacing: -0.02em;
    }

    /* Estilo de Vidro Óptico (Frosted Glassmorphism de Alta Fidelidade) */
    .glass-menu {
      background: rgba(13, 17, 26, 0.82);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-top: 1px solid rgba(255, 255, 255, 0.24);
      box-shadow: 0 24px 60px -8px rgba(0, 0, 0, 0.85), 
                  0 0 0 1px rgba(255, 255, 255, 0.04),
                  inset 0 1px 0 rgba(255, 255, 255, 0.18);
    }

    .glass-card {
      background: rgba(18, 23, 35, 0.62);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-top: 1px solid rgba(255, 255, 255, 0.13);
      box-shadow: 0 12px 30px -6px rgba(0, 0, 0, 0.45),
                  inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    .glass-card:hover {
      border-color: rgba(255, 255, 255, 0.16);
      background: rgba(22, 28, 42, 0.72);
    }

    .glass-modal {
      background: rgba(11, 15, 24, 0.88);
      backdrop-filter: blur(32px) saturate(200%);
      -webkit-backdrop-filter: blur(32px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-top: 1px solid rgba(255, 255, 255, 0.28);
      box-shadow: 0 30px 80px -12px rgba(0, 0, 0, 0.9),
                  0 0 0 1px rgba(255, 255, 255, 0.06),
                  inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    /* Scrollbars discretos e ergonômicos */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.25);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.14);
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.28);
    }

    /* Animação de pulso para treinamento ativo */
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 15px rgba(16, 185, 129, 0.2); }
      50% { box-shadow: 0 0 28px rgba(16, 185, 129, 0.45); }
    }

    @keyframes scanline {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(1000%); }
    }

    .training-pulse {
      animation: pulse-glow 2.4s infinite ease-in-out;
    }

    .scan-laser {
      animation: scanline 2.8s linear infinite;
    }

    /* Entrada suave do toast (respeitado por prefers-reduced-motion abaixo) */
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }
    .animate-fade-in {
      animation: fade-in 0.18s ease-out;
    }

    /* Foco acessível WCAG 2.2 AA */
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [role="tab"]:focus-visible {
      outline: 2px solid #10b981;
      outline-offset: 2px;
    }

    /* Estado desabilitado — único estado permitido para contraste reduzido */
    button:disabled, select:disabled, input:disabled, textarea:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

      const [imgSize, setImgSize] = useState(640);
      const [learningRate, setLearningRate] = useState(0.001);
      const [optimizer, setOptimizer] = useState('AdamW');

      // Estado do AutoLabel (descrições/captions → Difusão e OpenCLIP)

      const [labelPrompt, setLabelPrompt] = useState('Describe this training image in one dense caption, listing subject, material, lighting and any visible defect.');
      const [isLabeling, setIsLabeling] = useState(false);

      // Estado do AutoTracker (bounding boxes → YOLO · vídeo e imagem)
      const [trackEngine, setTrackEngine] = useState('local'); // 'local' | 'upload' (GPU remota)
      const [trackModel, setTrackModel] = useState('florence-2-large');
      const [trackSource, setTrackSource] = useState('image'); // 'image' | 'video'
      const [trackPrompt, setTrackPrompt] = useState('Detect and generate tight bounding boxes with category tags for industrial manufacturing defects.');
      const [confidenceThreshold, setConfidenceThreshold] = useState(0.65);
      const [reclassifyExisting, setReclassifyExisting] = useState(false);
      const [isAutoAnalyzing, setIsAutoAnalyzing] = useState(false);
      const [sandboxSample, setSandboxSample] = useState('pcb');

      // Editor de BBoxes dentro da Galeria do Dataset (Canvas Interativo)
      const [activeTool, setActiveTool] = useState('bbox'); // 'bbox' | 'pan' | 'select'
      const [selectedClassId, setSelectedClassId] = useState(0);
      const [canvasZoom, setCanvasZoom] = useState(100);
      const [boxes, setBoxes] = useState([

                  <button 
                    onClick={() => { 
                      setSelectedDatasetId(contextMenu.item.id); 
                      setActiveTab(trainTabFor(contextMenu.item)); 
                      setContextMenu(prev => ({ ...prev, visible: false }));
                      showToast(`Iniciando configuração de treino para ${contextMenu.item.title}`);
                    }}
                    className="w-full text-left px-3 py-2 rounded-xl hover:bg-white/10 text-zinc-300 flex items-center space-x-2 transition-colors"
                  >
                    <Icons.Play />
                    <span>Treinar neste Dataset ({contextMenu.item.category === 'difusao' ? 'Difusão' : contextMenu.item.category === 'openclip' ? 'OpenCLIP' : 'YOLO'})</span>
                  </button>
                  {contextMenu.item.category === 'yolo' ? (
                    <button 
                      onClick={() => { 
                        setSelectedDatasetId(contextMenu.item.id);
                        setActiveTab('autotracker'); 
                        setContextMenu(prev => ({ ...prev, visible: false })); 
                      }}
                      className="w-full text-left px-3 py-2 rounded-xl hover:bg-white/10 text-zinc-300 flex items-center space-x-2 transition-colors"
                    >
                      <Icons.Crosshair />
                      <span>Executar AutoTracker (BBoxes)</span>
                    </button>
                  ) : (
                    <button 
                      onClick={() => { 
                        setSelectedDatasetId(contextMenu.item.id);
                        setActiveTab('autolabel'); 
                        setContextMenu(prev => ({ ...prev, visible: false })); 
                      }}
                      className="w-full text-left px-3 py-2 rounded-xl hover:bg-white/10 text-zinc-300 flex items-center space-x-2 transition-colors"
                    >
                      <Icons.Wand />
                      <span>Executar AutoLabel (Descriptions)</span>
                    </button>
                  )}
                  <button 
                    onClick={() => { 
                      showToast(`Exportando ${contextMenu.item.title} (.zip / YOLO txt)...`, 'success');
                      setContextMenu(prev => ({ ...prev, visible: false })); 
                    }}
                    className="w-full text-left px-3 py-2 rounded-xl hover:bg-white/10 text-zinc-300 flex items-center space-x-2 transition-colors"
                  >
                    <Icons.Download />
                    <span>Exportar Dataset</span>
                  </button>
                  <div className="h-px bg-white/10 my-1"></div>
                  <button 
                    onClick={() => { 
                      setDatasets(datasets.filter(d => d.id !== contextMenu.item.id));
                      setContextMenu(prev => ({ ...prev, visible: false }));
                      showToast('Dataset excluído com sucesso.');
                    }}
                    className="w-full text-left px-3 py-2 rounded-xl hover:bg-rose-500/20 text-rose-400 flex items-center space-x-2 transition-colors"
                  >
                    <Icons.Trash />
                    <span>Excluir Dataset</span>
                  </button>
                </>
              )}

              {contextMenu.type === 'sample_image' && (
                <>
                  <button 
                    onClick={() => { 
                      setActiveTab('datasets');
                      setOpenDatasetId(selectedDatasetId);
                      setEditingGalleryImage(0);
                      setContextMenu(prev => ({ ...prev, visible: false })); 
                    }}
                    className="w-full text-left px-3 py-2 rounded-xl hover:bg-white/10 text-zinc-200 flex items-center space-x-2 transition-colors"
                  >
                    <Icons.BoxSelect />
                    <span>Corrigir Bounding Box Manual</span>
                  </button>
                  <button 
                    onClick={() => { 
                      showToast('Re-executando AutoTracker na amostra selecionada...', 'success');
                      setContextMenu(prev => ({ ...prev, visible: false })); 
                    }}
                    className="w-full text-left px-3 py-2 rounded-xl hover:bg-white/10 text-zinc-300 flex items-center space-x-2 transition-colors"
                  >
                    <Icons.Wand />
                    <span>Re-executar AutoTracker</span>
                  </button>
                </>
              )}

              {(contextMenu.type === 'settings' || contextMenu.type === 'import_dataset') && (
                <>
                  <button 
                    onClick={() => { 
                      showToast('Importando backup estruturado: imagens + anotações + JSON/YAML de config...', 'info');
                      setContextMenu(prev => ({ ...prev, visible: false })); 
                    }}
                    className="w-full text-left px-3 py-2 rounded-xl hover:bg-white/10 text-zinc-200 flex items-center space-x-2 transition-colors"
                  >
                    <Icons.Download />
                    <span>Selecionar arquivo de backup (.zip / .json)</span>
                  </button>
                  <button 
                    onClick={() => { 
                      showToast('Reiniciando API Rust (core) → orquestrador → motor Python...', 'info');
                      setContextMenu(prev => ({ ...prev, visible: false })); 
                    }}
                    className="w-full text-left px-3 py-2 rounded-xl hover:bg-white/10 text-zinc-300 flex items-center space-x-2 transition-colors"
                  >
                    <Icons.Refresh />
                    <span>Reiniciar Runtime Rust/Python</span>
                  </button>
                </>
              )}
            </div>
          )}

          {/* =========================================================
              TOAST NOTIFICATION FLUTUANTE (FEEDBACK ERGONÔMICO)
             ========================================================= */}
          {toast && (
            <div 
              data-od-id="studio-toast"
              role="status"
              aria-live="polite"
              className="fixed bottom-5 right-5 z-50 rounded-xl glass-menu px-4 py-3 text-xs text-white flex items-center space-x-2.5 shadow-2xl border border-white/10 animate-fade-in max-w-[calc(100vw-2.5rem)]"
            >
              <span className={`w-2 h-2 rounded-full shrink-0 ${toast.type === 'success' ? 'bg-emerald-400' : toast.type === 'error' ? 'bg-rose-400' : 'bg-cyan-400'}`}></span>
              <span>{toast.message}</span>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
