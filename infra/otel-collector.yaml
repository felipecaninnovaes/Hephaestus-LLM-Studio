# infra/otel-collector.yaml — Fatia 2a instrumentou os 3 serviços Rust via
# OTLP (gRPC 4317 / HTTP 4318). A fatia 2c troca o exporter de traces pelo
# Tempo e adiciona um pipeline de logs para o Loki.
#
# Logs: os 3 serviços (2b) só exportam TRAÇOS via OTLP — exportar logs via
# OTLP exigiria o @backend adicionar uma camada `tracing-opentelemetry` de
# logs nesta fatia (fora de escopo @infra). Em vez disso o collector lê os
# arquivos json-file do Docker (`filelog`, opção §4 2c "(b)" — menos peças
# que promtail/Alloy: reusa o coletor já mergeado, nenhum processo novo).
# Cada container já tem o label `com.docker.compose.service` (Compose
# aplica automaticamente); `x-logging.options.labels` no compose.yaml manda
# o daemon Docker embutir esse label no campo `attrs` de cada linha
# json-file (comportamento documentado do driver `json-file`, opções
# `labels`/`env` → bloco `attrs`). O pipeline abaixo:
#   1. desembrulha o wrapper do Docker (`{"log","stream","time","attrs"}`);
#   2. troca o `body` pelo conteúdo de `log` (a linha JSON emitida pelo
#      tracing_subscriber `fmt().json()` dos 3 serviços — ver
#      `crates/heph-contracts/src/otel.rs`);
#   3. faz o parse dessa linha (json_parser `parse_to: body`, mantendo-a
#      estruturada) e achata `body.span` (`request_id`/`trace_id`/`job_id`
#      ficam na raiz) — assim `{service="…"} | json | request_id="…"` no
#      Loki funciona direto, sem acoplar o schema do Loki ao formato
#      aninhado do tracing;
#   4. promove `attrs["com.docker.compose.service"]` para o resource
#      attribute `service` (vira label de índice no Loki — ver
#      `infra/loki-config.yaml`).
# Containers sem log JSON válido (loki/tempo/grafana/otel-collector etc.)
# só perdem o parse da linha 3 (`on_error: send`): aparecem em
# `{service="<nome>"}` com o texto cru, sem quebrar o pipeline.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  filelog:
    include:
      - /var/lib/docker/containers/*/*-json.log
    start_at: beginning
    operators:
      - type: json_parser
        id: docker_wrapper
        parse_from: body
        parse_to: attributes
        timestamp:
          parse_from: attributes.time
          layout: '%Y-%m-%dT%H:%M:%S.%LZ'
      - type: move
        from: attributes.log
        to: body
      - type: json_parser
        id: app_json
        parse_from: body
        parse_to: body
        on_error: send
      - type: flatten
        field: body.span
        if: '"span" in body'
      - type: move
        from: attributes.attrs["com.docker.compose.service"]
        to: resource["service"]

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 150
    spike_limit_mib: 30
  batch:
    timeout: 5s
    send_batch_size: 1024

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
    logs:
      receivers: [otlp, filelog]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]
