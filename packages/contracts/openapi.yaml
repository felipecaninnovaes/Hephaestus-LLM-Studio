  /api/jobs/queue:
    get:
      operationId: listJobQueue
      tags: [jobs]
      summary: Fila ordenada de jobs
      description: |
        Fila de jobs ordenada por posição (ADR-0007 D7). Manager indisponível ⇒ 503 `queue_unavailable`.
      responses:
        "200":
          description: Fila de jobs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobQueue" }
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "Manager indisponível (`code: queue_unavailable`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/jobs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: >
          PK do job. Valor que não parseia como UUID responde 404 `not_found`
          (não 400, padrão D8).
    get:
      operationId: getJob
      tags: [jobs]
      summary: Detalhe de um job
      description: |
        Detalhe do job via manager (ADR-0007 D3). Manager indisponível ⇒ 503 `queue_unavailable`.
      responses:
        "200":
          description: Job encontrado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "Job inexistente ou id não-UUID (`code: not_found`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "Manager indisponível (`code: queue_unavailable`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/jobs/{id}/abort:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: "PK do job. UUID inválido ⇒ 404 `not_found` (D8)."
    post:
      operationId: abortJob
      tags: [jobs]
      summary: Aborta um job
      description: |
        Aborta um job via manager (ADR-0007 D7 :372-373).
        Job em estado terminal (done/failed/cancelled) ⇒ 409 `job_not_abortable`.
      responses:
        "200":
          description: Abort requisitado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AbortResponse" }
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "Job inexistente ou id não-UUID (`code: not_found`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "Job em estado terminal — abort não possível (`code: job_not_abortable`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "Manager indisponível (`code: queue_unavailable`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/jobs/{id}/metrics:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: "PK do job. UUID inválido ⇒ 404 `not_found` (D8)."
    get:
      operationId: getJobMetrics
      tags: [jobs]
      summary: Métricas de treinamento por epoch
      description: |
        Séries por epoch com re-mapeamento camelCase (ADR-0007 D7): `mAP50-95` → `map5095`.
        Job existe mas sem métricas ⇒ 200 com `items: []`.
      responses:
        "200":
          description: Métricas do job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobMetrics" }
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "Job inexistente ou id não-UUID (`code: not_found`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "Manager indisponível (`code: queue_unavailable`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/jobs/{id}/events:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: "PK do job. UUID inválido ⇒ 404 `not_found`."
    get:
      operationId: streamJobEvents
      tags: [jobs]
      summary: Stream de eventos de telemetria em tempo real (SSE)
      description: |
        Canal Server-Sent Events (ADR-0021 D3) transmitindo eventos de telemetria em tempo real
        conforme são emitidos pelo motor de execução.
      responses:
        "200":
          description: Stream SSE com eventos de telemetria.
          content:
            text/event-stream:
              schema:
                type: string
                description: "Linhas formatadas em SSE contendo data: {...JobTelemetryEvent...}"
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "Job inexistente ou id não-UUID (`code: not_found`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "Manager indisponível (`code: queue_unavailable`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/jobs/{id}/artifacts:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: "PK do job. UUID inválido ⇒ 404 `not_found` (D8)."
    get:
      operationId: listJobArtifacts
      tags: [jobs]
      summary: Artefatos de um job
      description: |
        Lista artefatos do job via manager (ADR-0007 D8). Manager indisponível ⇒ 503 `queue_unavailable`.
      responses:
        "200":
          description: Lista de artefatos.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactList" }
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "Job inexistente ou id não-UUID (`code: not_found`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "Manager indisponível (`code: queue_unavailable`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/jobs/{id}/artifacts/{artifactId}/data:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: "PK do job. UUID inválido ⇒ 404 `not_found` (D8)."
      - name: artifactId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: "PK do artefato. UUID inválido ⇒ 404 `not_found` (D8)."
    get:
      operationId: getJobArtifactData
      tags: [jobs]
      summary: Bytes do artefato (proxy)
      description: |
        Proxy do objeto do artefato (ADR-0007 D8): metadata via manager +
        objeto via StoragePort (admin), key = `artifacts/<job_id>/<path>`.
        Confere `md5` se barato. Manager indisponível ⇒ 503; storage fora ⇒ 503.
      responses:
        "200":
          description: Bytes do artefato.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "Job/artefato inexistente ou id não-UUID (`code: not_found`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "Manager ou storage indisponível (`code: queue_unavailable` ou `storage_unavailable`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/telemetry:
    get:
      operationId: getTelemetry
      tags: [jobs]
      summary: Telemetria do sistema (CPU/RAM/VRAM)
      description: |
        Proxy puro do cache de telemetria do manager (ADR-0007 D9).
        Sem GPU (mock) ⇒ `measured: false`, `vramUsed/vramTotal: null`.
        Manager indisponível ⇒ 503 `queue_unavailable` (delta consciente da D7
        original :355 — o docs-sync cobre depois).
      responses:
        "200":
          description: Telemetria do sistema.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Telemetry" }
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "Manager indisponível (`code: queue_unavailable`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/orchestrators:
    get:
      operationId: listOrchestrators
      tags: [jobs]
      summary: Lista orquestradores registrados
      description: |
        Lista orquestradores via manager (ADR-0009 D1). Leitura da tabela
        `orchestrators` do manager. Manager indisponível ⇒ 503 `queue_unavailable`.
      responses:
        "200":
          description: Lista de orquestradores.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrchestratorList" }
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "Manager indisponível (`code: queue_unavailable`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/models:
    get:
      operationId: listModels
      tags: [jobs]
      summary: Lista modelos/checkpoints da tabela `models`
      description: |
        Modelos da tabela canônica `models` (D2/D6 ADR-0012).
        Fonte: tabela `models` (substituiu derived SQL de `job_artifacts`).
        `url`: presigned GET do `s3_key` (null sem `S3_PUBLIC_ENDPOINT_URL`).
        Manager indisponível ⇒ 503 `queue_unavailable`.
      responses:
        "200":
          description: Lista de modelos/checkpoints.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelWeightList" }
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "Manager indisponível (`code: queue_unavailable`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/models/{id}:
    delete:
      operationId: deleteModel
      tags: [jobs]
      summary: Remove modelo do catálogo e storage
      description: |
        Remove o modelo da tabela `models` (ADR-0012 R5).
        Se a origem for upload ou download, remove também o arquivo binário do S3/SeaweedFS.
        Se a origem for train, remove apenas a referência no catálogo de modelos,
        preservando o artefato de histórico de jobs.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Modelo removido com sucesso.
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "Modelo não encontrado (`code: not_found`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "Manager indisponível (`code: queue_unavailable`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    patch:
      operationId: updateModel
      tags: [jobs]
      summary: Atualiza o nome ou metadados de um modelo no catálogo (ADR-0022 D2)
      description: |
        Atualiza o nome exibido de um modelo existente na tabela `models`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: "Novo nome do modelo (ex: meu-adaptador-v1.safetensors)."
      responses:
        "200":
          description: Modelo atualizado com sucesso.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Model" }
        "400":
          description: "Nome inválido (`code: invalid_request`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "Modelo não encontrado (`code: not_found`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "Manager indisponível (`code: queue_unavailable`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/models/upload:
    post:
      operationId: uploadModel
      tags: [jobs]
      summary: Upload de pesos de modelo (multipart)
      description: |
        Upload de arquivo de pesos via multipart (D3 ADR-0012, ADR-0014 D1).
        Campo `file` (obrigatório) + form fields `engine` (v1: "yolo" ou "world") + `name?`.
        DefaultBodyLimit 2 GiB+8 MiB envelope; magic bytes `PK\x03\x04` obrigatório;
        md5 hex computado; PUT S3 `models/<engine>/<id>/<name>`; compensação delete
        se INSERT no manager falhar. Erros: 400 `invalid_request` (engine/ext/magic/name),
        413 `invalid_request` (envelope), 503 `queue_unavailable` (manager), 503 `storage_unavailable` (S3).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, engine]
              properties:
                file:
                  type: string
                  format: binary
                  description: "Arquivo de pesos (.pt, magic PK\\x03\\x04)."
                engine:
                  type: string
                  enum: [yolo, world]
                  description: "Engine do modelo (v1: yolo ou world; world = pesos para autotracker real)."
                name:
                  type: string
                  maxLength: 255
                  description: "Nome opcional do modelo (deve terminar em .pt; ausente = nome do arquivo)."
      responses:
        "201":
          description: Modelo criado com sucesso.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Model" }
        "400":
          description: "Requisição inválida (`code: invalid_request`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: "Corpo acima do limite 2 GiB+8 MiB (`code: invalid_request`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "Manager ou storage indisponível (`code: queue_unavailable` ou `storage_unavailable`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/models/download:
    post:
      operationId: downloadModel
      tags: [jobs]
      summary: Download de modelo por URL (server-side)
      description: |
        Download server-side de pesos por URL (D4 ADR-0012).
        Body camelCase `{url, engine, name?}`. Allow-list via env
        `MODEL_DOWNLOAD_ALLOWED_HOSTS` (E1): ausente/vazia ⇒ 403
        `model_download_disabled`. Redirects máx. 5, re-validados contra
        allow-list + deny de privados a cada hop. Stream p/ tempdir com cap
        2 GiB e timeouts (30s connect / 120s total). PUT S3 + POST
        /internal/models + compensação delete se INSERT falhar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, engine]
              properties:
                url:
                  type: string
                  format: uri
                  description: "URL do arquivo de pesos (http/https)."
                engine:
                  type: string
                  enum: [yolo, world]
                  description: "Engine do modelo (v1: yolo ou world; world = pesos para autotracker real)."
                name:
                  type: string
                  maxLength: 255
                  description: "Nome opcional do modelo (deve terminar em .pt; ausente = basename da URL)."
      responses:
        "201":
          description: Modelo baixado e criado com sucesso.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Model" }
        "400":
          description: "Requisição inválida (`code: invalid_request`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: "Download desabilitado (`code: model_download_disabled`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: "Falha no download externo (`code: model_download_failed`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "Manager ou storage indisponível (`code: queue_unavailable` ou `storage_unavailable`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/storage/usage:
    get:
      operationId: getStorageUsage
      tags: [jobs]
      summary: Uso de storage (datasets + artifacts)
      description: |
        Soma atômica de `datasets.size_bytes` (SQL no principal) +
        `job_artifacts.bytes` (via manager) (ADR-0009 D3). 200 é atômico:
        qualquer fonte fora ⇒ 503 `queue_unavailable`, sem resposta parcial.
      responses:
        "200":
          description: Uso de storage.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageUsage" }
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "Manager ou database indisponível (`code: queue_unavailable`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: heph_session
      description: >
        JWT HS256 (jsonwebtoken 9; claims iss/sub/iat/exp/jti, TTL 7d, ADR-0001 D2).
        Somente o api-principal emite e valida; front nunca lê o valor (HttpOnly).
        Todas as rotas fora do domínio auth exigem este cookie via middleware de auth
        (backend.md §2), com `/health` e `/api/auth/*` isentos do gate.

  schemas:
    LoginRequest:
      type: object
      required: [password]
      additionalProperties: false
      properties:
        password:
          type: string
          format: password
          description: Senha em texto puro transportada apenas em loopback local; nunca logada pelo servidor.

    MeResponse:
      type: object
      required: [userId, loggedAt]
      properties:
        userId:
          type: string
          format: uuid
          description: PK da linha única de `users` (ADR-0001 D2; gen_random_uuid(), nativo PG13+).
        loggedAt:
          type: string
          format: date-time
          description: Momento de emissão da sessão (claim `iat` do JWT), RFC 3339.

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [invalid_request, invalid_credentials, unauthorized, setup_required, not_found, slug_conflict, storage_unavailable, classes_in_use, index_not_ready, embedding_unavailable, import_invalid, engine_unsupported, queue_unavailable, dataset_not_ready, job_not_abortable, job_not_done, pairing_invalid, model_download_failed, model_download_disabled, internal]
          description: "Código estável para máquina — a UI decide a mensagem por `code`, nunca por `message`; o cliente DEVE ter ramo default: o enum cresce por fatia (aditivo na 0.2.0: `not_found`, `slug_conflict`; na 0.3.0: `storage_unavailable`, ADR-0003 D10; na 0.3.0, fatia 3g.1: `classes_in_use`; na 0.5.0, fatia 3f.5: `index_not_ready`, `embedding_unavailable`, ADR-0004 D5; na 0.6.0, fatia 3e: `import_invalid`; na 0.7.0, fatia 4: `engine_unsupported`, `queue_unavailable`, `dataset_not_ready`, `job_not_abortable`; na 0.8.0, fatia 5: `job_not_done`; na 0.10.0, fatia H: `pairing_invalid`, ADR-0011 D5; na 0.11.0, fatia I: `model_download_failed`, `model_download_disabled`, ADR-0012 D4/E1)."
        message:
          type: string
          description: Humano-curto, ESTÁTICO por code; nunca contém hash, token, segredo ou existência de usuário.

    HealthResponse:
      type: object
      required: [status, service, auth, version]
      properties:
        status:
          type: string
          enum: [ok]
          description: Liveness do processo.
        service:
          type: string
          description: 'Nome do serviço (ex.: api-principal).'
        auth:
          type: string
          enum: [ready, setup_required]
          description: "Estado do bootstrap single-user (ADR-0001 D3): ready = usuário existe; setup_required = aguardando STUDIO_PASSWORD no primeiro boot."
        version:
          type: string
          description: "Versão de produto (`env!(CARGO_PKG_VERSION)` do crate api-principal)."

    CreateDatasetRequest:
      type: object
      required: [title, type]
      additionalProperties: false
      description: >
        Espelha o modal `create-dataset-modal` (frontend.md §4.3): nome, tipo de
        modelo/tarefa e classes CSV. O front faz o split do CSV; o wire é array de
        nomes. A dropzone do modal NÃO pertence a esta rota (upload é a 3b).
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 96
          description: >
            Nome humano. O servidor deriva `slug` (minúsculas, sem acentos via
            mapa Latin-1 explícito, runs de não-`[a-z0-9]` viram `-`, sem `-` nas
            pontas, 96 máx); resultado vazio ⇒ 400.
        type:
          type: string
          enum: [yolo_bbox, yolo_seg, difusao_lora, clip_image_text]
          description: >
            As 4 options do modal (frontend.md §4.3). Código de máquina estável;
            o rótulo pt-BR é exclusividade da UI. `category`, `task` e `format`
            são derivados daqui pelo servidor — nunca enviados pelo cliente.
        classes:
          type: array
          maxItems: 200
          default: []
          items: { type: string, pattern: '^[A-Za-z0-9_][A-Za-z0-9_]{0,63}$' }
          description: >
            Nomes de classe na ordem escolhida → `classes.idx` 0-based (convenção
            YOLO). O servidor faz trim e deduplica preservando a primeira
            ocorrência; `color` vem da paleta do design system por `idx % 6`.
            Restrição idêntica ao CHECK do banco: os nomes precisam sobreviver a
            `data.yaml` e a `labels/*.txt`.

    Dataset:
      type: object
      required:
        - id
        - slug
        - title
        - category
        - type
        - task
        - format
        - status
        - sizeBytes
        - imagesCount
        - labeledCount
        - trashCount
        - classes
        - autoTracked
        - createdAt
        - lastModified
      properties:
        id: { type: string, format: uuid }
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          maxLength: 96
          description: Identificador kebab-case gerado pelo servidor; UNIQUE no banco.
        title:
          type: string
          description: Nome humano como enviado no create (frontend.md §8 usa `title`; o card exibe `slug`).
        category:
          type: string
          enum: [difusao, openclip, yolo]
          description: Derivada de `type` (backend.md §10).
        type:
          type: string
          enum: [yolo_bbox, yolo_seg, difusao_lora, clip_image_text]
        task:
          type: string
          enum: [detect_track, segment, caption, embedding]
          description: Derivada de `type` (tabela server-side em `datasets::models::derive`).
        format:
          type: string
          enum: [yolo_txt, captions, pairs]
          description: Formato canônico em disco por engine (backend.md §3); derivado de `category`.
        status:
          type: string
          enum: [ready, in_progress, needs_labeling]
          description: "`needs_labeling` no create (frontend.md §4.3); transições por trigger de contadores nas fatias 3b/3c."
        source:
          type: [string, "null"]
          description: >
            Valor derivado `s3://<bucket>/datasets/<id>/` quando há imagens,
            `null` em dataset vazio (referência ADR-0003 D5).
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
          description: Bytes agregados de `images`; 0 na 3a. A UI formata ("1.4 GB") em `lib/format.ts`.
        imagesCount: { type: integer, minimum: 0 }
        labeledCount: { type: integer, minimum: 0 }
        trashCount:
          type: integer
          minimum: 0
          description: "Imagens na lixeira do dataset (derivado 3g.3, ADR-0005 D11; aditivo na 0.4.0)."
        classes:
          type: array
          items: { $ref: "#/components/schemas/Class" }
          description: "nomes no create request; objeto completo na resposta (3b.7 — classId exposto p/ PUT boxes)."
        autoTracked:
          type: boolean
          default: false
          description: >
            Derivado do banco desde a 3d (dívida T7 do ADR-0002 quitada):
            `EXISTS` sobre `boxes.origin = 'autotracker'` das imagens do
            dataset; era constante `false` na 3a/3b.
        createdAt: { type: string, format: date-time }
        lastModified:
          type: string
          format: date-time
          description: "`datasets.updated_at` (RFC 3339), não string relativa; a UI formata 'há 12 minutos'."

    YoloJobRequest:
      type: object
      required: [datasetId]
      additionalProperties: false
      description: >
        Body de `POST /api/jobs/yolo` (ADR-0007 D6/D7/D5 ADR-0012). `datasetId` é
        obrigatório; os demais campos são OPCIONAIS com defaults.
        Wire camelCase; `deny_unknown_fields` garante 400 para chaves desconhecidas.
      properties:
        datasetId:
          type: string
          format: uuid
          description: "PK do dataset. Não-UUID ou inexistente ⇒ 404 `not_found`."
        model:
          type: string
          enum: [yolo11n, yolo11m, yolo11x, yolov9-c, yolo11-seg]
          default: yolo11m
        epochs:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
        batch:
          type: integer
          enum: [8, 16, 32, 64]
          default: 16
        imgsz:
          type: integer
          enum: [416, 640, 1024]
          default: 640
        lr0:
          type: number
          minimum: 0.00001
          maximum: 0.1
          default: 0.01
        optimizer:
          type: string
          enum: [AdamW, SGD, Muon]
          default: AdamW
        augment:
          $ref: "#/components/schemas/YoloAugment"
        seed:
          type: [integer, "null"]
          format: uint64
          description: "Seed opcional (null = 42 no config.yaml)."
        weights:
          type: [string, "null"]
          format: uuid
          description: "UUID de pesos existentes na tabela `models` para fine-tune (D5). Não-UUID ⇒ 400 `invalid_request`."
        orchestratorId:
          type: [string, "null"]
          format: uuid
          description: "ID do orquestrador preferencial para execução (ADR-0015 D2). Opcional; ausente ou null = Automático. Não-UUID ⇒ 400 `invalid_request`."
        outputName:
          type: [string, "null"]
          maxLength: 100
          description: "Nome personalizado para o modelo/pesos finais (sem extensão). Se omitido, derivado semanticamente (ADR-0022 D1)."

    YoloAugment:
      type: object
      additionalProperties: false
      description: "Configuração de augmentação do treino YOLO (ADR-0007 D6)."
      properties:
        mosaic:
          type: boolean
          default: true
        mixupFlip:
          type: boolean
          default: false

    AutotrackerJobRequest:
      type: object
      additionalProperties: false
      required: [datasetId]
      description: |
        Body de `POST /api/jobs/autotracker` (ADR-0008 D3, ADR-0014 D2/D6). `datasetId` é
        obrigatório; os demais campos são OPCIONAIS com defaults.
        `modelId` (UUID opcional): presente → job REAL com pesos world; ausente → mock.
        Wire camelCase; `deny_unknown_fields` garante 400 para chaves desconhecidas.
      properties:
        datasetId:
          type: string
          format: uuid
          description: "PK do dataset. Não-UUID ou inexistente ⇒ 404 `not_found`."
        model:
          type: string
          enum: [mock]
          default: mock
          description: "Modelo a usar (apenas mock na v1). O real é selecionado por modelId."
        conf:
          type: number
          minimum: 0.0
          maximum: 1.0
          default: 0.65
          description: "Limiar de confiança (0..1)."
        modelId:
          type: [string, "null"]
          format: uuid
          description: "UUID do modelo world na tabela `models`. Presente → job real; ausente → mock. Não-UUID ⇒ 400 `invalid_request`; inexistente ⇒ 404 `not_found` (via manager)."
        orchestratorId:
          type: [string, "null"]
          format: uuid
          description: "ID do orquestrador preferencial para execução (ADR-0015 D2). Opcional; ausente ou null = Automático. Não-UUID ⇒ 400 `invalid_request`."

    AutolabelJobRequest:
      type: object
      additionalProperties: false
      required: [datasetId]
      description: |
        Body de `POST /api/jobs/autolabel` (ADR-0016 D0, ADR-0019 AutoLabel v2). `datasetId` é
        obrigatório; os demais campos são OPCIONAIS com defaults.
        Wire camelCase; `deny_unknown_fields` garante 400 para chaves desconhecidas.
      properties:
        datasetId:
          type: string
          format: uuid
          description: "PK do dataset. Não-UUID ou inexistente ⇒ 404 `not_found`."
        model:
          type: string
          enum: [mock, florence-2, qwen2-vl, openai]
          default: mock
          description: "Modelo VLM local ou provedor de API para legendagem (ADR-0019)."
        prompt:
          type: string
          maxLength: 8000
          description: "Instrução opcional para estilo/contexto da legenda."
        apiKey:
          type: string
          maxLength: 512
          description: "Chave de autenticação para chamadas ao provedor OpenAI (opcional se configurada via env no nó)."
        apiBase:
          type: string
          maxLength: 512
          default: "https://api.openai.com/v1"
          description: "URL base para API compatível com OpenAI (ex: https://api.openai.com/v1 ou http://localhost:11434/v1)."
        openaiModel:
          type: string
          maxLength: 128
          default: "gpt-4o-mini"
          description: "Nome do modelo VLM remoto no provedor OpenAI (ex: gpt-4o-mini, gpt-4o)."
        orchestratorId:
          type: [string, "null"]
          format: uuid
          description: "ID do orquestrador preferencial para execução (ADR-0015 D2). Opcional; ausente ou null = Automático. Não-UUID ⇒ 400 `invalid_request`."
        reasoningEffort:
          type: [string, "null"]
          enum: [none, low, medium, high, "null"]
          description: "Esforço de raciocínio para modelos com CoT/reasoning (ex: none para desativar raciocínio e acelerar)."
        filterClassId:
          type: [string, "null"]
          format: uuid
          description: "ID de classe opcional para filtrar apenas imagens com anotações desta classe."
        imageIds:
          type: [array, "null"]
          items:
            type: string
            format: uuid
          description: "Lista explícita opcional de IDs de imagens para legendagem seletiva."

    DiffusionJobRequest:
      type: object
      additionalProperties: false
      required: [datasetId, baseModel]
      description: |
        Body de `POST /api/jobs/diffusion` (ADR-0018 D1). `datasetId` e `baseModel` são
        obrigatórios; os demais campos são opcionais com defaults.
        Wire camelCase; `deny_unknown_fields` garante 400 para chaves desconhecidas.
      properties:
        datasetId:
          type: string
          format: uuid
          description: "PK do dataset com imagens e legendas. Não-UUID ou inexistente ⇒ 404 `not_found`."
        baseModel:
          type: string
          enum: [sdxl, flux, sd15]
          default: sdxl
          description: "Modelo de difusão base para treino do adaptador LoRA."
        triggerWord:
          type: [string, "null"]
          maxLength: 100
          description: "Palavra ou token de ativação (ex: 'ohwx subject')."
        epochs:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
          description: "Número de épocas de treino."
        batchSize:
          type: integer
          enum: [1, 2, 4, 8]
          default: 1
          description: "Tamanho do lote por passo de gradiente."
        learningRate:
          type: number
          minimum: 0.000001
          maximum: 0.01
          default: 0.0001
          description: "Taxa de aprendizado para o LoRA."
        rank:
          type: integer
          minimum: 4
          maximum: 128
          default: 16
          description: "Dimensão da matriz de baixa ordem (LoRA rank)."
        alpha:
          type: integer
          minimum: 4
          maximum: 128
          default: 16
          description: "Fator de escalonamento alpha do LoRA."
        weights:
          type: [string, "null"]
          format: uuid
          description: "UUID de modelo diffusion na tabela `models` para continuidade de treino."
        orchestratorId:
          type: [string, "null"]
          format: uuid
          description: "ID do orquestrador preferencial para execução (ADR-0015 D2). Opcional."
        samplePrompt:
          type: [string, "null"]
          maxLength: 500
          description: "Prompt de teste para geração de amostras de validação durante o treino. Opcional."
        sampleInterval:
          type: integer
          minimum: 0
          maximum: 100
          default: 1
          description: "Intervalo de épocas para geração de amostras (0 = desativado). Padrão 1."
        sampleSeed:
          type: [integer, "null"]
          description: "Semente determinística fixa para a geração das amostras de validação. Opcional (padrão 42)."
        resolution:
          type: integer
          enum: [512, 768, 1024]
          description: "Resolução quadrada de treino das imagens (ex: 512 para SD 1.5, 1024 para SDXL/Flux). Opcional."
        gradientAccumulationSteps:
          type: integer
          enum: [1, 2, 4, 8]
          default: 1
          description: "Passos de acumulação de gradientes para simular lote maior sem consumir mais VRAM. Padrão 1."
        optimizer:
          type: string
          enum: [adamw8bit, adamw, prodigy]
          default: adamw8bit
          description: "Algoritmo otimizador (adamw8bit = 8-bit AdamW bitsandbytes, adamw = standard AdamW, prodigy = D-Adaptation). Padrão adamw8bit."
        lrScheduler:
          type: string
          enum: [cosine, linear, constant, constant_with_warmup]
          default: cosine
          description: "Decaimento da taxa de aprendizado. Padrão cosine."
        lrWarmupSteps:
          type: integer
          minimum: 0
          maximum: 1000
          default: 0
          description: "Passos iniciais de aquecimento da taxa de aprendizado. Padrão 0."
        mixedPrecision:
          type: string
          enum: [fp16, bf16, "no"]
          default: fp16
          description: "Precisão numérica de ponto flutuante durante o treino (fp16, bf16 ou no). Padrão fp16."
        quantization:
          type: string
          enum: ["none", "4bit", "8bit"]
          default: "4bit"
          description: "Nível de quantização do modelo base (4bit = NF4 QLoRA, 8bit = BitsAndBytes int8, none = sem quantização FP16/BF16 pleno)."
        outputName:
          type: [string, "null"]
          maxLength: 100
          description: "Nome personalizado para o adaptador LoRA final (sem extensão). Se omitido, derivado semanticamente (ADR-0022 D1)."

    DiffusionGenerateJobRequest:
      type: object
      additionalProperties: false
      required: [baseModel, prompt]
      description: |
        Body de `POST /api/jobs/diffusion/generate` (ADR-0020).
        `baseModel` e `prompt` são obrigatórios; os demais campos são opcionais.
      properties:
        baseModel:
          type: string
          enum: [sdxl, flux, sd15, flux-2-klein-4b]
          default: flux-2-klein-4b
          description: "Modelo base para geração Text-to-Image."
        prompt:
          type: string
          minLength: 1
          maxLength: 4000
          description: "Prompt textual descritivo para geração da imagem."
        negativePrompt:
          type: [string, "null"]
          maxLength: 4000
          description: "Prompt negativo para exclusão de características (aplicável a SDXL e SD 1.5)."
        width:
          type: integer
          minimum: 256
          maximum: 2048
          default: 1024
          description: "Largura da imagem gerada em pixels."
        height:
          type: integer
          minimum: 256
          maximum: 2048
          default: 1024
          description: "Altura da imagem gerada em pixels."
        steps:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
          description: "Número de passos de inferência/difusão."
        guidanceScale:
          type: number
          minimum: 1.0
          maximum: 30.0
          default: 3.5
          description: "Escala de orientação CFG (Classifier-Free Guidance)."
        seed:
          type: [integer, "null"]
          minimum: 0
          description: "Semente determinística para geração de ruído inicial. Opcional."
        quantization:
          type: string
          enum: ["none", "4bit", "8bit"]
          default: "4bit"
          description: "Quantização do modelo base (4bit NF4, 8bit BNB ou none FP16 pleno)."
        distilled:
          type: boolean
          default: false
          description: "Variante destilada em passos (ex: FLUX.2 Klein 4B Schnell / 4-8 passos com CFG 1.0)."
        weights:
          type: [string, "null"]
          format: uuid
          description: "UUID de modelo LoRA diffusion na tabela `models` para estilização."
        loraScale:
          type: number
          minimum: 0.0
          maximum: 2.0
          default: 1.0
          description: "Fator de escala de aplicação dos pesos LoRA."
        orchestratorId:
          type: [string, "null"]
          format: uuid
          description: "ID do orquestrador preferencial para execução (ADR-0015 D2)."

    PredictJobRequest:
      type: object
      required: [modelId, datasetId]
      additionalProperties: false
      description: |
        Body de `POST /api/jobs/predict` (ADR-0013 D0/D1/D8). `modelId` (UUID do
        modelo na tabela `models`) e `datasetId` são obrigatórios; `conf` é OPCIONAL
        com default 0.65.
        Wire camelCase; `deny_unknown_fields` garante 400 para chaves desconhecidas.
      properties:
        modelId:
          type: string
          format: uuid
          description: "UUID do modelo (tabela `models`). Não-UUID ⇒ 400 `invalid_request`; inexistente ⇒ 404 `not_found` (via manager)."
        datasetId:
          type: string
          format: uuid
          description: "PK do dataset. Não-UUID ou inexistente ⇒ 404 `not_found`."
        conf:
          type: number
          minimum: 0.0
          maximum: 1.0
          default: 0.65
          description: "Limiar de confiança (0..1)."
        orchestratorId:
          type: [string, "null"]
          format: uuid
          description: "ID do orquestrador preferencial para execução (ADR-0015 D2). Opcional; ausente ou null = Automático. Não-UUID ⇒ 400 `invalid_request`."

    SubmitJobResponse:
      type: object
      required: [jobId, status]
      additionalProperties: false
      description: "Resposta 202 do POST /api/jobs/yolo (ADR-0007 D7)."
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued]
        queuePosition:
          type: [integer, "null"]
          description: "Posição na fila (null se o manager não devolve)."

    AbortResponse:
      type: object
      required: [status]
      additionalProperties: false
      description: "Resposta do POST /api/jobs/:id/abort (ADR-0007 D7)."
      properties:
        status:
          type: string
          enum: [cancelling, cancelled]

    AutotrackerApplyRequest:
      type: object
      additionalProperties: false
      description: |
        Body de `POST /api/jobs/:id/autotracker/apply` (ADR-0008 D1).
        `overwrite` (default false), `imageId` (UUID opcional) e `createMissingClasses` (array opcional).
        Wire camelCase; `deny_unknown_fields` garante 400 para chaves desconhecidas.
      properties:
        overwrite:
          type: boolean
          default: false
          description: "true = DELETE total da imagem; false = DELETE só de boxes com origin=autotracker."
        imageId:
          type: [string, "null"]
          format: uuid
          description: "UUID opcional — aplica SÓ a esta imagem (ausente = todas do resultado)."
        createMissingClasses:
          type: [array, "null"]
          items:
            type: string
          description: "Lista de nomes de classes ausentes a serem criadas automaticamente no dataset antes de aplicar as boxes."

    AutotrackerClassCount:
      type: object
      required: [name, boxesCount]
      additionalProperties: false
      description: "Contagem de bounding boxes por classe no artefato do autotracker."
      properties:
        name:
          type: string
          description: "Nome da classe."
        boxesCount:
          type: integer
          minimum: 0
          description: "Número total de bounding boxes desta classe."

    AutotrackerPreviewResponse:
      type: object
      required: [totalImages, totalBoxes, existingClasses, missingClasses]
      additionalProperties: false
      description: "Resposta 200 de prévia do autotracker com análise de classes existentes e ausentes."
      properties:
        totalImages:
          type: integer
          minimum: 0
          description: "Total de imagens com detecções no artefato."
        totalBoxes:
          type: integer
          minimum: 0
          description: "Total de bounding boxes no artefato."
        existingClasses:
          type: array
          items:
            $ref: "#/components/schemas/AutotrackerClassCount"
          description: "Classes detectadas que já existem no dataset."
        missingClasses:
          type: array
          items:
            $ref: "#/components/schemas/AutotrackerClassCount"
          description: "Classes detectadas que não existem no dataset."

    AutotrackerApplyResponse:
      type: object
      required: [applied, skipped, images]
      additionalProperties: false
      description: "Resposta 200 do apply (ADR-0008 D1)."
      properties:
        applied:
          type: integer
          minimum: 0
          description: "Número de boxes gravadas."
        skipped:
          type: integer
          minimum: 0
          description: "Número de boxes ignoradas (classe/imagem inexistente ou cap)."
        images:
          type: integer
          minimum: 0
          description: "Número de imagens que receberam ao menos uma box."

    AutolabelApplyRequest:
      type: object
      additionalProperties: false
      description: |
        Body de `POST /api/jobs/:id/autolabel/apply` (ADR-0016 D1).
        `overwrite` (default false): false = preserva legendas manuais e importadas;
        true = sobrescreve inclusive anotações de origem manual e import.
        Wire camelCase; `deny_unknown_fields` garante 400 para chaves desconhecidas.
      properties:
        datasetId:
          type: [string, "null"]
          format: uuid
          description: "ID do dataset para conferência de consistência (opcional)."
        overwrite:
          type: boolean
          default: false
          description: "true = sobrescreve todas as legendas; false = só atualiza imagens sem legenda ou com origin=autolabel."
        items:
          type: array
          description: "Lista seletiva/curada de legendas para aplicar (opcional). Se omitido, aplica todas as legendas do artefato."
          items:
            $ref: "#/components/schemas/AutolabelApplyItem"

    AutolabelApplyItem:
      type: object
      required: [filename, caption]
      additionalProperties: false
      description: "Item curado/revisado para aplicação de legenda."
      properties:
        filename:
          type: string
          description: "Nome do arquivo da imagem no dataset."
        caption:
          type: string
          description: "Texto da legenda curada/editada (1 a 8000 caracteres)."

    AutolabelPreviewItem:
      type: object
      required: [imageId, filename, imageUrl, generatedCaption]
      additionalProperties: false
      description: "Item de prévia de legenda para revisão humana."
      properties:
        imageId:
          type: string
          format: uuid
          description: "ID da imagem no dataset."
        filename:
          type: string
          description: "Nome original do arquivo."
        imageUrl:
          type: string
          format: uri
          description: "Presigned URL para visualização da imagem."
        generatedCaption:
          type: string
          description: "Legenda gerada pelo modelo VLM."
        currentCaption:
          type: [string, "null"]
          description: "Legenda atualmente persistida no dataset (se houver)."
        currentOrigin:
          type: [string, "null"]
          description: "Origem da legenda atual ('manual', 'autolabel', 'import', etc.)."

    AutolabelPreviewResponse:
      type: object
      required: [jobId, datasetId, totalGenerated, items]
      additionalProperties: false
      description: "Resposta com as prévias de legendas geradas pelo autolabel."
      properties:
        jobId:
          type: string
          format: uuid
          description: "ID do job de autolabel."
        datasetId:
          type: string
          format: uuid
          description: "ID do dataset associado."
        model:
          type: [string, "null"]
          description: "Modelo VLM utilizado."
        totalGenerated:
          type: integer
          minimum: 0
          description: "Total de legendas geradas no artefato."
        items:
          type: array
          items:
            $ref: "#/components/schemas/AutolabelPreviewItem"

    AutolabelApplyResponse:
      type: object
      required: [applied, skipped, images]
      additionalProperties: false
      description: "Resposta 200 do apply de autolabel (ADR-0016 D1)."
      properties:
        applied:
          type: integer
          minimum: 0
          description: "Número de legendas gravadas/atualizadas."
        skipped:
          type: integer
          minimum: 0
          description: "Número de legendas ignoradas."
        images:
          type: integer
          minimum: 0
          description: "Número de imagens que receberam legendas."

    Class:
      type: object
      required: [id, name, idx, color]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        idx: { type: integer, minimum: 0 }
        color:
          type: string
          pattern: '^#[0-9a-f]{6}$'
          description: Cor da paleta do design system por `idx % 6`.

    UploadItem:
      type: object
      required: [filename, status]
      description: "Status por arquivo do lote (ADR-0003 D2)."
      properties:
        imageId:
          type: [string, "null"]
          format: uuid
          description: PK da linha em `images`; null em `rejected`.
        filename:
          type: string
          description: Nome canônico (stem sanitizado + extensão do sniff).
        status:
          type: string
          enum: [stored, duplicate, rejected, failed]
          description: Resultado por item (200 mesmo com `rejected`/`failed` individuais).
        reason:
          type: [string, "null"]
          enum: [duplicate_filename, unsupported_media, too_large, storage_error, null]
          description: Motivo do não-`stored` (null quando `stored`).
        bytes:
          type: [integer, "null"]
          description: Tamanho real do spool (só em `stored`).
        width:
          type: [integer, "null"]
          description: Largura decodificada (só em `stored`).
        height:
          type: [integer, "null"]
          description: Altura decodificada (só em `stored`).

    UploadResult:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/UploadItem" }

    Image:
      type: object
      required: [id, filename, objectKey, bytes, width, height, mediaType, split, url, createdAt]
      description: "Imagem indexada (ADR-0003 D2/D5; md5/sha256 ficam no banco, fora do wire)."
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        objectKey:
          type: string
          description: Chave legível `datasets/{dataset_id}/images/{image_id}/{nome}` (D5).
        bytes: { type: integer, format: int64, minimum: 0 }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        mediaType:
          type: string
          enum: [jpeg, png, webp]
          description: Canônico do conteúdo via sniff, não do form (D2/D5).
        split:
          type: string
          enum: [train, val]
        url:
          type: string
          description: Presigned no endpoint público (D3) ou fallback `/data` da 3b.5.
        createdAt: { type: string, format: date-time }
        boxesCount:
          type: integer
          format: int64
          nullable: true
          description: "Contagem de bounding boxes anotadas (opcional, enriquecido na listagem)."
        caption:
          type: string
          nullable: true
          description: "Texto da legenda anotada (opcional, enriquecido na listagem)."

    ImagePage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Image" }
        total:
          type: integer
          minimum: 0
          description: Total com os filtros, sem o LIMIT.
        limit: { type: integer }
        offset: { type: integer }

    Box:
      type: object
      required: [id, classId, x, y, w, h, origin]
      description: "Anotação de detecção (ADR-0003 D6; x/y/w/h centro+dimensões normalizados 0..1)."
      properties:
        id: { type: string, format: uuid }
        classId: { type: string, format: uuid }
        x: { type: number, minimum: 0, maximum: 1 }
        y: { type: number, minimum: 0, maximum: 1 }
        w: { type: number, minimum: 0, maximum: 1 }
        h: { type: number, minimum: 0, maximum: 1 }
        conf:
          type: [number, "null"]
          description: Confiança (null em anotação manual/importada).
        origin:
          type: string
          enum: [manual, autotracker, import]
        trackId:
          type: [integer, "null"]
          description: Id de track (convenção — preenchido só em origem autotracker com tracking; API não impõe).

    Caption:
      type: object
      required: [text, origin, updatedAt]
      description: "Legenda da imagem (no máximo uma por imagem, PK = image_id)."
      properties:
        text: { type: string, minLength: 1, maxLength: 8000 }
        origin:
          type: string
          enum: [manual, autotracker, import]
        model:
          type: [string, "null"]
          description: Modelo gerador (convenção — preenchido em origem autotracker; teto de 255 chars ⇒ 400).
        updatedAt: { type: string, format: date-time }

    PutBoxesRequest:
      type: object
      required: [boxes]
      additionalProperties: false
      description: "Substituição total das boxes (máx 1000, anti-DoS)."
      properties:
        boxes:
          type: array
          maxItems: 1000
          items:
            type: object
            required: [classId, x, y, w, h]
            additionalProperties: false
            properties:
              classId:
                type: string
                format: uuid
                description: PK em `classes` (precisa pertencer ao dataset).
              x: { type: number, minimum: 0, maximum: 1 }
              y: { type: number, minimum: 0, maximum: 1 }
              w: { type: number, minimum: 0, maximum: 1 }
              h: { type: number, minimum: 0, maximum: 1 }
              conf:
                type: [number, "null"]
                minimum: 0
                maximum: 1
                description: Confiança (null em anotação manual/importada).
              origin:
                type: string
                enum: [manual, autotracker, import]
                default: manual
                description: Origem da anotação (ausente vira `manual`).
              trackId:
                type: [integer, "null"]
                description: Id de track (convenção — preenchido só em origem autotracker com tracking; API não impõe).

    PutBoxesResponse:
      type: object
      required: [boxes]
      description: "Boxes após a substituição (ids novos, eco do banco)."
      properties:
        boxes:
          type: array
          items: { $ref: "#/components/schemas/Box" }

    BatchBoxesUpdateRequest:
      type: object
      required: [action, sourceClassId]
      additionalProperties: false
      description: |
        Corpo de `POST /api/datasets/:id/boxes/batch`.
        Permite remapear ou excluir bounding boxes de uma classe em lote.
      properties:
        imageIds:
          type: [array, "null"]
          items:
            type: string
            format: uuid
          description: "Lista de UUIDs das imagens a afetar. Opcional — se ausente ou null, aplica a todo o dataset ativo."
        action:
          type: string
          enum: [remap, delete]
          description: "Ação a executar: 'remap' substitui sourceClassId por targetClassId; 'delete' remove as boxes de sourceClassId."
        sourceClassId:
          type: string
          format: uuid
          description: "PK da classe de origem em `classes` (pertencente ao dataset)."
        targetClassId:
          type: [string, "null"]
          format: uuid
          description: "PK da classe de destino em `classes`. Obrigatório quando action = 'remap'."

    BatchBoxesUpdateResponse:
      type: object
      required: [affectedBoxes, affectedImages]
      additionalProperties: false
      description: "Resposta da atualização em lote de boxes."
      properties:
        affectedBoxes:
          type: integer
          minimum: 0
          description: "Número total de bounding boxes alteradas ou deletadas."
        affectedImages:
          type: integer
          minimum: 0
          description: "Número de imagens distintas afetadas pela operação."

    PutCaptionRequest:
      type: object
      required: [text]
      additionalProperties: false
      description: "Upsert da legenda (PK = image_id)."
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 8000
          description: Texto da legenda (vazio ⇒ 400, a linha não nasce).
        origin:
          type: string
          enum: [manual, autotracker, import]
          default: manual
          description: Origem da legenda (ausente vira `manual`).
        model:
          type: [string, "null"]
          description: Modelo gerador (convenção — preenchido em origem autotracker; teto de 255 chars ⇒ 400).

    PutClassesItem:
      type: object
      required: [name]
      additionalProperties: false
      description: "Item da substituição total: com `id` renomeia preservando o id; sem `id` cria nova."
      properties:
        id:
          type: string
          format: uuid
          description: PK em `classes` (precisa pertencer ao dataset; ausente ⇒ criar).
        name:
          type: string
          pattern: '^[A-Za-z0-9_][A-Za-z0-9_]{0,63}$'
          description: Nome da classe (trim server-side; mesma regra do create).

    PutClassesRequest:
      type: object
      required: [classes]
      additionalProperties: false
      description: "Substituição total das classes (máx 200; nomes e ids únicos, sem dedupe silencioso)."
      properties:
        classes:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/PutClassesItem" }

    PutClassesResponse:
      type: object
      required: [classes]
      description: "Classes após a substituição (ordem do request, `idx` 0..n-1, cores rederivadas)."
      properties:
        classes:
          type: array
          items: { $ref: "#/components/schemas/Class" }

    RestoreImageResponse:
      type: object
      required: [filename]
      additionalProperties: false
      description: "Restore com rename: o filename novo (único entre as ativas)."
      properties:
        filename:
          type: string
          description: Filename novo da linha restaurada (`{stem}_restaurado{ext}`).

    ImageDetail:
      type: object
      required: [id, filename, objectKey, bytes, width, height, mediaType, split, url, createdAt, boxes, caption]
      description: "Image + boxes + caption (ADR-0003 delta; flat, sem aninhamento)."
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        objectKey:
          type: string
          description: Chave legível `datasets/{dataset_id}/images/{image_id}/{nome}` (D5).
        bytes: { type: integer, format: int64, minimum: 0 }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        mediaType:
          type: string
          enum: [jpeg, png, webp]
          description: Canônico do conteúdo via sniff, não do form (D2/D5).
        split:
          type: string
          enum: [train, val]
        url:
          type: string
          description: Presigned no endpoint público (D3) ou fallback `/data` da 3b.5.
        createdAt: { type: string, format: date-time }
        boxes:
          type: array
          items: { $ref: "#/components/schemas/Box" }
          description: Anotações da imagem (ordem determinística por id).
        caption:
          description: Legenda da imagem (null quando ausente).
          anyOf:
            - $ref: "#/components/schemas/Caption"
            - type: "null"

    SearchIndexResponse:
      type: object
      required: [status]
      additionalProperties: false
      description: "Resposta 202 do rebuild (Fatia 3f.4, ADR-0004 D5; aditivo na 0.5.0)."
      properties:
        status:
          type: string
          enum: [indexing, not_indexed]
          description: "`indexing` = rebuild disparado (fire-and-forget); `not_indexed` = dataset sem imagens (não trabalha)."

    SearchStatus:
      type: object
      required: [status, imagesCount, indexedCount, model, dim]
      additionalProperties: false
      description: "Estado derivado da indexação (Fatia 3f.4, ADR-0004 D5; aditivo na 0.5.0)."
      properties:
        status:
          type: string
          enum: [not_indexed, indexing, ready, stale]
          description: "        `not_indexed` = dataset sem imagens (nada a indexar); `indexing` =
        imagens ainda sem embedding completo; `ready` = toda imagem ativa tem
        embedding do modelo ativo. `stale` reservado, nunca emitido na v1."
        imagesCount:
          type: integer
          minimum: 0
          description: Imagens ativas do dataset (`deleted_at IS NULL` — lixeira invisível).
        indexedCount:
          type: integer
          minimum: 0
          description: Embeddings do modelo ativo (`image_embeddings` por dataset + model).
        model:
          type: string
          description: "Modelo de embedding ativo (ex.: `ViT-B-32`)."
        dim:
          type: integer
          description: Dimensão fixa dos vetores (512, ViT-B-32).

    SearchResponse:
      type: object
      required: [items]
      additionalProperties: false
      description: "Resultados da busca semântica (Fatia 3f.5, ADR-0004 D5; aditivo na 0.5.0)."
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SearchItem" }
          description: Ordenados por score desc (a ordem do HNSW é por distância asc).

    SearchItem:
      type: object
      required: [image, score]
      additionalProperties: false
      description: "Imagem (mesmo wire `Image` do list) + similaridade (Fatia 3f.5; aditivo na 0.5.0)."
      properties:
        image: { $ref: "#/components/schemas/Image" }
        score:
          type: number
          description: "Similaridade coseno RAW (faixa -1..1; CLIP normaliza L2 no embedder)."

    ByImageRequest:
      type: object
      required: [imageId]
      additionalProperties: false
      description: "Busca por imagem (Fatia 3f.5, ADR-0004 D5; aditivo na 0.5.0)."
      properties:
        imageId:
          type: string
          format: uuid
          description: "Imagem do dataset (não-UUID ou fora do dataset ⇒ 404 `not_found`, D8 replicado)."
        k:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
          description: Tamanho do top-k (default 20; fora de 1..100 ⇒ 400).
        threshold:
          type: number
          minimum: -1
          maximum: 1
          description: "Pós-filtro opcional (`score >= threshold`; fora de -1..1 ⇒ 400)."

    PackageRequest:
      type: object
      required: [engine]
      additionalProperties: false
      description: "Request do package (Fatia 4, ADR-0007 D7; ADR-0018 D0)."
      properties:
        engine:
          type: string
          enum: [yolo, diffusion]
          description: "Engine alvo (`yolo` ou `diffusion`); outro valor ⇒ 400 `engine_unsupported`."

    PackageResponse:
      type: object
      required: [versionId, key, bytes, md5Zip, files]
      additionalProperties: false
      description: "Package criado — versão congelada do dataset (Fatia 4, ADR-0007 D7)."
      properties:
        versionId:
          type: string
          format: uuid
          description: "PK da row em `dataset_versions` (snapshot congelado)."
        key:
          type: string
          description: "Key do zip no storage: `packages/<versionId>/dataset.zip`."
        bytes:
          type: integer
          format: int64
          minimum: 0
          description: "Tamanho do zip em bytes."
        md5Zip:
          type: string
          pattern: '^[0-9a-f]{32}$'
          description: "MD5 do zip (hex)."
        files:
          type: array
          items: { $ref: "#/components/schemas/TransportFile" }
          description: "Entradas do zip."

    TransportFile:
      type: object
      required: [filename, md5, bytes]
      additionalProperties: false
      description: "Entrada de arquivo no manifest de transporte."
      properties:
        filename:
          type: string
          description: "Nome do arquivo no zip."
        md5:
          type: string
          pattern: '^[0-9a-f]{32}$'
          description: "MD5 do conteúdo (hex)."
        bytes:
          type: integer
          format: int64
          minimum: 0
          description: "Tamanho em bytes."

    Job:
      type: object
      required: [id, kind, engine, model, mode, status, createdAt]
      additionalProperties: false
      description: "Job de treinamento (ADR-0007 D7)."
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          description: "Tipo do job (ex.: yolo_train)."
        engine:
          type: string
          description: "Engine alvo (ex.: yolo)."
        model:
          type: string
          description: "Modelo (ex.: yolo11m)."
        mode:
          type: string
          description: "Modo de execução."
        datasetId:
          type: [string, "null"]
          format: uuid
          description: "Dataset associado (null quando dataset foi deletado)."
        status:
          type: string
          enum: [queued, dispatched, preparing, running, cancelling, done, failed, cancelled]
          description: "Status do ciclo do job."
        queueReason:
          type: [string, "null"]
          description: "Motivo da espera na fila."
        queuePosition:
          type: [integer, "null"]
          description: "Posição na fila (null quando não está queued)."
        progress:
          type: [number, "null"]
          minimum: 0
          maximum: 1
          description: "Progresso 0..1 (null quando não disponível)."
        epoch:
          type: [integer, "null"]
          minimum: 0
          description: "Epoch corrente do treino."
        step:
          type: [integer, "null"]
          minimum: 0
          description: "Step corrente do treino."
        metrics:
          description: "Métricas re-mapeadas camelCase (null quando não disponível)."
          anyOf:
            - type: array
              items: { $ref: "#/components/schemas/MetricsItem" }
            - type: "null"
        vramMinGb:
          type: [integer, "null"]
          minimum: 0
          description: "VRAM mínima exigida em GB."
        orchestratorId:
          type: [string, "null"]
          format: uuid
          description: "Orquestrador que executa o job."
        orchestratorName:
          type: [string, "null"]
          description: "Nome do orquestrador que executa ou executou o job (ADR-0015 D1)."
        orchestratorKind:
          type: [string, "null"]
          enum: [docker, slurm, "null"]
          description: "Kind do orquestrador (ADR-0015 D1)."
        orchestratorFallback:
          type: boolean
          description: "Indica se o job sofreu fallback automático após timeout no nó solicitado (ADR-0015 D3)."
        createdAt: { type: string, format: date-time }
        finishedAt:
          type: [string, "null"]
          format: date-time
          description: "Momento da finalização (null enquanto ativo)."
        phase:
          type: [string, "null"]
          description: "Fase atual da execução (ADR-0021 D0, ex.: downloading, quantizing, training, generating, done, error)."
        phaseMessage:
          type: [string, "null"]
          description: "Mensagem amigável legível da fase atual."
        vramUsedGb:
          type: [number, "null"]
          description: "Uso de VRAM medido em tempo real em GB."
        error:
          type: [string, "null"]
          description: "Mensagem ou stacktrace de erro em caso de falha do job."

    JobTelemetryEvent:
      type: object
      required: [timestamp, phase, progress]
      additionalProperties: false
      description: "Evento estruturado de telemetria emitido durante a execução de um job (ADR-0021 D0)."
      properties:
        timestamp:
          type: string
          format: date-time
          description: "Data/hora RFC3339 UTC da emissão do evento."
        phase:
          type: string
          description: "Identificador da fase atual (ex.: init, downloading, quantizing, generating, training, completed, error)."
        phaseMessage:
          type: [string, "null"]
          description: "Mensagem legível descrevendo o estado da fase atual."
        progress:
          type: number
          minimum: 0.0
          maximum: 1.0
          description: "Progresso contínuo normalizado de 0.0 a 1.0."
        step:
          type: [integer, "null"]
          description: "Passo atual dentro da fase ou época."
        totalSteps:
          type: [integer, "null"]
          description: "Total de passos estimado."
        epoch:
          type: [integer, "null"]
          description: "Época atual (para treinos iterativos)."
        totalEpochs:
          type: [integer, "null"]
          description: "Total de épocas."
        vramUsedGb:
          type: [number, "null"]
          description: "Uso de VRAM medido na GPU em GB."
        metrics:
          type: [object, "null"]
          additionalProperties: { type: [number, string, boolean, "null"] }
          description: "Dicionário flexível com métricas adicionais instantâneas (loss, it_s, lr, etc.)."

    JobList:
      type: object
      required: [items, total]
      additionalProperties: false
      description: "Lista de jobs (ADR-0007 D7)."
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Job" }
        total:
          type: integer
          minimum: 0
          description: "Total de jobs (com filtros aplicados)."

    MetricsItem:
      type: object
      required: [epoch, boxLoss, clsLoss, dflLoss, map50, map5095]
      additionalProperties: false
      description: "Métricas de treinamento por epoch (camelCase wire; mAP50-95 → map5095)."
      properties:
        epoch:
          type: integer
          minimum: 0
        boxLoss:
          type: number
          description: "Box loss (mean average precision component)."
        clsLoss:
          type: number
          description: "Classification loss."
        dflLoss:
          type: number
          description: "DFL (distribution focal) loss."
        map50:
          type: number
          description: "mAP at IoU=0.50."
        map5095:
          type: number
          description: "mAP at IoU=0.50:0.95 (chave `mAP50-95` no JSONB snake_case do manager)."
        loss:
          type: number
          description: "Loss geral contínuo (utilizado por engines de difusão/LLM)."
        lr:
          type: number
          description: "Learning rate corrente."
        step:
          type: integer
          description: "Passo global de otimização."

    JobMetrics:
      type: object
      required: [items]
      additionalProperties: false
      description: "Métricas de treinamento por epoch (ADR-0007 D7)."
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MetricsItem" }
          description: "Série temporal por epoch (vazio se job existe mas sem métricas)."

    QueueItem:
      type: object
      required: [jobId, position]
      additionalProperties: false
      description: "Item da fila de jobs (ADR-0007 D7)."
      properties:
        jobId:
          type: string
          format: uuid
          description: "PK do job na fila."
        position:
          type: integer
          minimum: 1
          description: "Posição na fila (1-based)."
        queueReason:
          type: [string, "null"]
          description: "Motivo da espera na fila."

    JobQueue:
      type: object
      required: [items]
      additionalProperties: false
      description: "Fila ordenada de jobs (ADR-0007 D7)."
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/QueueItem" }

    JobArtifact:
      type: object
      required: [id, kind, path, md5, bytes]
      additionalProperties: false
      description: "Artefato de um job (ADR-0007 D8)."
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          description: "Tipo do artefato (ex.: model, metrics)."
        path:
          type: string
          description: "Caminho relativo ao prefixo `artifacts/<job_id>/`."
        md5:
          type: string
          pattern: '^[0-9a-f]{32}$'
          description: "MD5 do conteúdo (hex, calculado pelo orquestrador)."
        bytes:
          type: integer
          format: int64
          minimum: 0
          description: "Tamanho em bytes."

    ArtifactList:
      type: object
      required: [items]
      additionalProperties: false
      description: "Lista de artefatos de um job (ADR-0007 D8)."
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/JobArtifact" }

    Telemetry:
      type: object
      required: [measured, gpus, jobsActive]
      additionalProperties: false
      description: "Telemetria do sistema (ADR-0007 D9)."
      properties:
        measured:
          type: boolean
          description: "true se VRAM é medível (false no mock sem GPU)."
        vramUsed:
          type: [integer, "null"]
          description: "VRAM usada em MB (null quando não medível)."
        vramTotal:
          type: [integer, "null"]
          description: "VRAM total em MB (null quando não medível)."
        cpu:
          type: [number, "null"]
          description: "Uso de CPU (0..1 ou percentual, dependendo do orquestrador)."
        ram:
          type: [integer, "null"]
          description: "RAM usada em bytes."
        ramTotal:
          type: [integer, "null"]
          description: "RAM total em bytes (lida de MemTotal do /proc/meminfo)."
        gpus:
          type: array
          items: { type: string }
          description: "Lista de GPUs detectadas (vazia no mock)."
        jobsActive:
          type: integer
          minimum: 0
          description: "Número de jobs ativos (preparing/running)."

    Orchestrator:
      type: object
      required: [id, name, kind, endpoint, status]
      additionalProperties: false
      description: "Orquestrador registrado (ADR-0009 D1; enriquecido H.4 — ADR-0011 D2)."
      properties:
        id: { type: string, format: uuid }
        name:
          type: string
          description: "Nome do orquestrador (ex.: orchestrator-local)."
        kind:
          type: string
          enum: [local, remoto]
          description: "Tipo do orquestrador."
        endpoint:
          type: string
          description: "Endpoint HTTP interno do orquestrador."
        status:
          type: string
          enum: [online, degraded, offline, revoked, unknown]
          description: "Status de saúde do orquestrador."
        lastHeartbeat:
          type: [string, "null"]
          format: date-time
          description: "Momento do último heartbeat (null se nunca recebeu)."
        measured:
          type: boolean
          description: "Se heartbeat ≤ 10s (nó com telemetria fresca)."
        cpu:
          type: [number, "null"]
          description: "CPU do nó (%) — null se não medido."
        ram:
          type: [integer, "null"]
          format: int64
          description: "RAM usada do nó (MiB) — null se não medido."
        ramTotal:
          type: [integer, "null"]
          format: int64
          description: "RAM total do nó (MiB) — null se não medido."
        vramUsed:
          type: [integer, "null"]
          format: int64
          description: "VRAM usada do nó (MiB) — null se sem GPU."
        vramTotal:
          type: [integer, "null"]
          format: int64
          description: "VRAM total do nó (MiB) — null se sem GPU."
        vramTotalGb:
          type: [integer, "null"]
          description: "Capacidade VRAM do nó (GB) = maior GPU individual (round(max_gpu_mib/1024)) — 1 job = 1 GPU. null se não declarada."
        gpus:
          type: array
          items: { type: string }
          description: "Lista de GPUs detectadas (vazia no mock)."
        jobsActive:
          type: integer
          minimum: 0
          description: "Número de jobs ativos (preparing/running)."

    OrchestratorList:
      type: object
      required: [items]
      additionalProperties: false
      description: "Lista de orquestradores (ADR-0009 D1)."
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Orchestrator" }

    AdoptRequest:
      type: object
      required: [name, endpoint, kind, pairingCode]
      additionalProperties: false
      description: "Body de adopt de orquestrador (H.4 — ADR-0011 D5)."
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: "Nome do orquestrador."
        endpoint:
          type: string
          description: "Endpoint HTTP(S) do orquestrador (deve iniciar com http:// ou https://)."
        kind:
          type: string
          enum: [local, remoto]
          description: "Tipo do orquestrador."
        pairingCode:
          type: string
          minLength: 1
          maxLength: 128
          description: "Código de pareamento (único uso, via ORCH_PAIRING_CODE no orquestrador)."

    ModelWeight:
      type: object
      required: [id, name, engine, model, jobId, bytes, createdAt]
      additionalProperties: false
      description: "Peso/checkpoint derivado de job_artifacts (ADR-0009 D2)."
      properties:
        id: { type: string, format: uuid }
        name:
          type: string
          description: "Nome do arquivo (basename do path, ex.: best.pt)."
        engine:
          type: string
          description: "Engine do job que produziu o peso."
        model:
          type: string
          description: "Modelo treinado."
        jobId:
          type: string
          format: uuid
          description: "PK do job que produziu o peso."
        bytes:
          type: integer
          format: int64
          minimum: 0
          description: "Tamanho do arquivo em bytes."
        createdAt:
          type: string
          format: date-time
          description: "Momento de criação do job."

    ModelWeightList:
      type: object
      required: [items]
      additionalProperties: false
      description: "Lista de modelos/checkpoints (D6 ADR-0012 — substituiu ModelWeight)."
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Model" }

    Model:
      type: object
      required: [id, name, engine, source, bytes, md5, createdAt]
      additionalProperties: false
      description: "Modelo público (D6 ADR-0012). Campos `model`/`jobId`/`url` são nullable (upload/download não têm jobId nem variante)."
      properties:
        id: { type: string, format: uuid }
        name:
          type: string
          description: "Nome do arquivo de pesos (ex.: best.pt)."
        engine:
          type: string
          description: "Engine do modelo."
        model:
          type: string
          nullable: true
          description: "Variante conhecida (treino); null para upload/download."
        source:
          type: string
          enum: [train, upload, download]
          description: "Origem do modelo."
        bytes:
          type: integer
          format: int64
          minimum: 0
          description: "Tamanho do arquivo em bytes."
        md5:
          type: string
          description: "Hash MD5 hex 32 do arquivo."
        url:
          type: string
          format: uri
          nullable: true
          description: "URL presigned GET (null se sem S3_PUBLIC_ENDPOINT_URL)."
        jobId:
          type: string
          format: uuid
          nullable: true
          description: "PK do job de treino (null para upload/download)."
        createdAt:
          type: string
          format: date-time
          description: "Momento de criação."

    StorageUsage:
      type: object
      required: [datasetsBytes, artifactsBytes, modelsBytes, totalBytes, measured]
      additionalProperties: false
      description: "Uso de storage (ADR-0009 D3 / ADR-0012 D8)."
      properties:
        datasetsBytes:
          type: integer
          format: int64
          minimum: 0
          description: "Bytes de imagens/vídeos ativos (SQL do principal)."
        artifactsBytes:
          type: integer
          format: int64
          minimum: 0
          description: "Bytes de artefatos de jobs, excluindo `kind='model'` (via manager)."
        modelsBytes:
          type: integer
          format: int64
          minimum: 0
          description: "Bytes de modelos/checkpoints na tabela `models` (via manager)."
        totalBytes:
          type: integer
          format: int64
          minimum: 0
          description: "Soma de datasets + artifacts + models."
        measured:
          type: boolean
          description: "true quando 200 — bytes reais dos contadores."
