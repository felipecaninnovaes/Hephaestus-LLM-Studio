x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"
    # Fatia 2c (telemetria-observabilidade): embute os labels
    # `com.docker.compose.service`/`.project` (setados automaticamente pelo
    # Compose em todo container) no campo `attrs` de cada linha json-file —
    # é assim que o otel-collector (`filelog`) sabe de qual serviço/projeto
    # veio o log sem falar com a API do Docker (ver infra/otel-collector.yaml).
    # `.project` é OBRIGATÓRIO (revisão de segurança pós-reprova): sem ele o
    # collector não tem como distinguir este stack de qualquer outro
    # container do host, e vazaria log de projetos/engines alheios no Loki.
    labels: "com.docker.compose.service,com.docker.compose.project"

services:
  db:
    image: pgvector/pgvector:pg16-trixie@sha256:c8483555ce48101872f888c1df8a895ff689d6c7c7a5f7ac266475f9dfe89e0b
    command: >
      postgres
      -c shared_buffers=512MB
      -c work_mem=32MB
      -c maintenance_work_mem=128MB
      -c effective_cache_size=1536MB
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studio}
      POSTGRES_DB: studio
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '${DB_PUBLISH:-127.0.0.1}:5432:5432'
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      # Cold boot com volume novo (pgdata vazio) demora: initdb antes de
      # aceitar conexões/DNS registrar; sem isso o principal dá crash-loop.
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend_net

  principal:
    build:
      context: ..
      dockerfile: services/api-principal/Dockerfile
    ports:
      - '${PRINCIPAL_PUBLISH:-127.0.0.1}:8080:8080'
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATABASE_URL: postgres://studio:${POSTGRES_PASSWORD:-studio}@db/studio
      STUDIO_PASSWORD: ${STUDIO_PASSWORD:-changeme}
      MANAGER_URL: http://manager:8081
      MANAGER_TOKEN: ${MANAGER_TOKEN:-changeme}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://seaweedfs:8333}
      S3_BUCKET: ${S3_BUCKET:-heph-data}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-heph}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-heph-local-dev}
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-}
      S3_URL_TTL_SECS: ${S3_URL_TTL_SECS:-3600}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-mock}
      EMBEDDER_URL: ${EMBEDDER_URL:-http://embedder:8090}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-ViT-B-32}
      MODEL_DOWNLOAD_ALLOWED_HOSTS: ${MODEL_DOWNLOAD_ALLOWED_HOSTS:-}
      # Fatia 2a (telemetria-observabilidade): sem a env o exporter OTel não
      # inicializa e o serviço sobe normal (contrato fixado no context).
      # Default LIGADO em dev: o otel-collector sobe junto no mesmo compose.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_SERVICE_NAME: api-principal
    depends_on:
      db:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080 && echo -e \"GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q 200 <&3'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - frontend_net
      - backend_net

  # SeaweedFS S3 (ADR-0003 D0, 3b.4): identidade em infra/seaweedfs-s3.json
  # (credenciais LOCAL-DEV — rotacione antes de qualquer exposição além do
  # loopback; R1). JSON puro sem comentários: o weed faz parse estrito.
  # Bind loopback local-first: browser dev alcança localhost:8333, LAN nunca toca o bucket.
  seaweedfs:
    image: chrislusf/seaweedfs:4.45_full@sha256:04851d83f42aad1ae898d1b190e2140fd1cef1015bc1a1b783282fefcf65e03b
    command: "server -s3 -ip.bind=0.0.0.0 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -dir=/data -master.volumeSizeLimitMB=1024 -master.garbageThreshold=0.3"
    ports:
      # R1 (ADR-0003): default loopback — a LAN nunca toca o bucket. Para
      # acessar o studio de OUTRO dispositivo da rede (página via IP), o
      # operador publica a porta com SEAWEED_PUBLISH=0.0.0.0 no `.env` e
      # aponta S3_PUBLIC_ENDPOINT_URL para http://<ip-da-máquina>:8333
      # (presigned é assinado nesse host — gotcha SigV4 D3; receita no
      # .env.example). Credenciais são LOCAL-DEV: rotacione se sair da LAN.
      - '${SEAWEED_PUBLISH:-127.0.0.1}:8333:8333'
      - '127.0.0.1:9333:9333'
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - seaweed_data:/data
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      # S3 responde 403 AccessDenied em `/` anônimo (identidade exige SigV4) —
      # qualquer RESPOSTA HTTP = API no ar. Portável GNU/BusyBox wget (a tag
      # 4.45_full é mutável: pull de 2026-09-05 trocou o wget por BusyBox, que
      # sai 1 em 403 — GNU sai 8; o probe antigo travava unhealthy). `wget -S`
      # imprime a linha HTTP/1.1 de qualquer código; falha de rede (recusada/
      # timeout) não gera resposta HTTP = fora.
      test: ["CMD-SHELL", "wget -q -S -O /dev/null http://localhost:8333/ 2>&1 | grep -q HTTP/1.1"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - backend_net
      - engine_net

  # s3-init (run-once): garante o bucket S3 após `down -v` (seaweed_data some
  # e o bucket vai junto; a identidade volta via seaweedfs-s3.json mas o
  # bucket NÃO é auto-criado p/ identidade escopada do orquestrador — sem ele
  # os uploads falham silenciosamente, jobs "done" com zero artefatos).
  # Imagem própria (Dockerfile.s3-init): curl+openssl pré-instalados, sem apk
  # dinâmico no boot; o retry cobre a janela entre healthy e S3 100% pronto.
  # Sem ports: isolamento de engines/serviços intacto. Credenciais = mesmas LOCAL-DEV do compose.
  s3-init:
    build:
      context: .
      dockerfile: Dockerfile.s3-init
    volumes:
      - ./scripts/ensure-bucket.sh:/ensure-bucket.sh:ro
    environment:
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_BUCKET: ${S3_BUCKET:-heph-data}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-heph}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-heph-local-dev}
    command: ["sh", "-c", "n=0; while ! sh /ensure-bucket.sh; do n=$$(($$n+1)); [ $$n -ge 30 ] && exit 1; sleep 2; done"]
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: "no"
    logging: *default-logging
    networks:
      - backend_net

  # Embedder CLIP (ADR-0004 D1, 3f.3): inferência de embeddings para busca
  # semântica. INFRA local (como o SeaweedFS) — não job do orquestrador
  # (unificação runner na fatia 4). Mock hash por default (ENGINE_MOCK=1):
  # determinístico e sem torch; modo real CLIP é @gpu manual fora do compose
  # (peso ~600 MB, cache em volume models). Sem auth: rede interna docker,
  # bind só no loopback do host (R3).
  embedder:
    build:
      context: ..
      dockerfile: engines/trainer-clip/Dockerfile
    environment:
      ENGINE_MOCK: "1"
      MODEL: ${EMBEDDING_MODEL:-ViT-B-32}
      PORT: "8090"
    ports:
      - '127.0.0.1:8090:8090'
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - models:/data/models
    healthcheck:
      # stdlib pura (imagem python:3.12-slim não tem wget/curl): /health responde 200 {"status":"ok"}.
      test: ["CMD-SHELL", "python -c 'import urllib.request as u; u.urlopen(\"http://localhost:8090/health\", timeout=3)'"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - backend_net

  # OTel Collector (fatia 2a — telemetria-observabilidade §4 Onda 2):
  # recebe OTLP gRPC/HTTP dos 3 serviços Rust. A 2c troca o exporter de
  # traces pelo Tempo e adiciona o pipeline de logs (filelog → Loki) —
  # ver infra/otel-collector.yaml. Imagem upstream é "distroless" (sem
  # shell/wget) — Dockerfile.otel-collector reempacota o binário numa base
  # Alpine só para o healthcheck funcionar. Sem publicar fora do loopback:
  # tráfego interno da rede backend_net; debug local via
  # OTEL_COLLECTOR_PUBLISH se precisar.
  otel-collector:
    build:
      context: .
      dockerfile: Dockerfile.otel-collector
    # Fatia 2c + revisão de segurança pós-reprova:
    # - `user: root` é necessário para o receiver `filelog` ler
    #   /var/lib/docker/containers (dono root:root, modo 0640 no host) — a
    #   imagem upstream roda non-root (USER 10001) só para o healthcheck.
    # - `cap_drop: [ALL]` + `cap_add: [DAC_READ_SEARCH]`: root sem a
    #   capability DAC_READ_SEARCH fica sujeito às permissões normais de
    #   arquivo (não lê os logs 0640 de outro dono); com ela, só ganha o
    #   bypass mínimo de leitura/busca — nenhuma outra capability de root
    #   (SETUID, NET_ADMIN, SYS_ADMIN etc.) sobra.
    # - `security_opt: no-new-privileges`: bloqueia escalonamento via
    #   setuid/setgid binaries dentro do container.
    # - `read_only: true` + `tmpfs: [/tmp]`: o binário não precisa escrever
    #   em lugar nenhum além de /tmp (sem storage extension configurada —
    #   checkpoint do filelog fica em memória; reinício relê do
    #   `start_at: beginning`, aceitável neste stack single-node).
    # - Mount de /var/lib/docker/containers é READ-ONLY: o collector nunca
    #   escreve no diretório do Docker.
    user: "0:0"
    cap_drop: ["ALL"]
    cap_add: ["DAC_READ_SEARCH"]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp
    environment:
      # Usado pelo filtro `scope_to_project` do otel-collector.yaml —
      # descarta log de qualquer container fora deste projeto Compose
      # (revisão de segurança pós-reprova: sem isso o filelog lia
      # /var/lib/docker/containers/* de TODO o host, vazando log de
      # outros stacks/engines no Loki deste stack).
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-infra}
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    ports:
      - '${OTEL_COLLECTOR_PUBLISH:-127.0.0.1}:4317:4317'
      - '${OTEL_COLLECTOR_PUBLISH:-127.0.0.1}:4318:4318'
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:13133/"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    networks:
      - backend_net
    depends_on:
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy

  # Tempo (fatia 2c — telemetria-observabilidade §4 2c): armazena traces
  # recebidos do otel-collector. Disco local (homelab, sem backend S3
  # dedicado — fora de escopo §7 "Archive de Loki/Tempo para S3").
  # Sem publicar fora do loopback: só o Grafana/otel-collector consultam,
  # via backend_net; debug local opcional via TEMPO_PUBLISH.
  tempo:
    image: grafana/tempo:2.6.1@sha256:ef4384fce6e8ad22b95b243d8fc165628cda655376fd50e7850536ad89d71d50
    command: ["-config.file=/etc/tempo/tempo.yaml", "-config.expand-env=true"]
    environment:
      TEMPO_RETENTION: ${TEMPO_RETENTION:-720h}
    volumes:
      - ./tempo-config.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - '${TEMPO_PUBLISH:-127.0.0.1}:3200:3200'
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - backend_net

  # Loki (fatia 2c): índice operacional de logs via ingestão OTLP nativa
  # (`/otlp/v1/logs`) do otel-collector. Disco local; retenção por env
  # (default 30d — §2.1 da spec, "interpretação do orchestrator").
  loki:
    image: grafana/loki:3.3.2@sha256:8af2de1abbdd7aa92b27c9bcc96f0f4140c9096b507c77921ffddf1c6ad6c48f
    command: ["-config.file=/etc/loki/loki.yaml", "-config.expand-env=true"]
    environment:
      LOKI_RETENTION: ${LOKI_RETENTION:-720h}
    volumes:
      - ./loki-config.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    ports:
      - '${LOKI_PUBLISH:-127.0.0.1}:3100:3100'
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - backend_net

  # Grafana (fatia 2c): porta 4000 — 3000 é do `web` (decisão do usuário).
  # Login via env (`GRAFANA_ADMIN_PASSWORD`, default de dev `changeme` —
  # mesmo convencionado no resto do compose). Datasources/dashboard
  # provisionados por arquivo (`infra/grafana/provisioning/`); sem UI setup
  # manual. Publicado só em loopback por padrão (`*_PUBLISH`).
  grafana:
    image: grafana/grafana:11.3.1@sha256:fa801ab6e1ae035135309580891e09f7eb94d1abdbd2106bdc288030b028158c
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - '${GRAFANA_PUBLISH:-127.0.0.1}:4000:3000'
    depends_on:
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - backend_net

  manager:
    build:
      context: ..
      dockerfile: services/manager/Dockerfile
    ports:
      - '${MANAGER_PUBLISH:-127.0.0.1}:8081:8081'
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATABASE_URL: postgres://studio:${POSTGRES_PASSWORD:-studio}@db/studio
      MANAGER_TOKEN: ${MANAGER_TOKEN:-changeme}
      TRAINER_IMAGE: ${TRAINER_IMAGE:-hephaestus/trainer-yolo:local}
      DIFFUSION_TRAINER_IMAGE: ${DIFFUSION_TRAINER_IMAGE:-hephaestus/trainer-difusao:local}
      AUTO_ADOPT_LOCAL: ${AUTO_ADOPT_LOCAL:-1}
      VRAM_TABLE_PATH: /etc/hephaestus/vram-table.yaml
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_SERVICE_NAME: manager
    volumes:
      - ../packages/policies/vram-table.yaml:/etc/hephaestus/vram-table.yaml:ro
    depends_on:
      db:
        condition: service_healthy
      principal:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8081 && echo -e \"GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q 200 <&3'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - backend_net

  orchestrator-local:
    build:
      context: ..
      dockerfile: services/orchestrator/Dockerfile
    ports:
      - '${ORCHESTRATOR_PUBLISH:-127.0.0.1}:8082:8082'
    restart: unless-stopped
    logging: *default-logging
    environment:
      MANAGER_URL: ${MANAGER_URL:-http://manager:8081}
      MANAGER_TOKEN: ${MANAGER_TOKEN:-changeme}
      S3_ORCH_ENDPOINT_URL: ${S3_ORCH_ENDPOINT_URL:-http://seaweedfs:8333}
      S3_ORCH_BUCKET: ${S3_ORCH_BUCKET:-heph-data}
      S3_ORCH_ACCESS_KEY: ${S3_ORCH_ACCESS_KEY:-heph-orch}
      S3_ORCH_SECRET_KEY: ${S3_ORCH_SECRET_KEY:-heph-orch-local-dev}
      ORCH_WORKDIR: ${ORCH_WORKDIR:-/data}
      EXEC_MODE: ${EXEC_MODE:-docker}
      ORCH_VOL_DATASETS: ${COMPOSE_PROJECT_NAME:-infra}_datasets
      ORCH_VOL_OUTPUTS: ${COMPOSE_PROJECT_NAME:-infra}_outputs
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
      FLUX_MODEL_ID: ${FLUX_MODEL_ID:-}
      # Imagem do daemon de difusão (launcher usa env próprio, não dispatch.image).
      # No dev host o build do profile `build` é taggeado `:local`.
      DIFFUSION_TRAINER_IMAGE: ${DIFFUSION_TRAINER_IMAGE:-hephaestus/trainer-difusao:local}
      DIFFUSION_DAEMON_ENABLED: ${DIFFUSION_DAEMON_ENABLED:-1}
      DIFFUSION_DAEMON_PORT: ${DIFFUSION_DAEMON_PORT:-8766}
      DIFFUSION_DAEMON_IDLE_TTL_S: ${DIFFUSION_DAEMON_IDLE_TTL_S:-600}
      DIFFUSION_DAEMON_URL: ${DIFFUSION_DAEMON_URL:-}
      DIFFUSION_DAEMON_NETWORK: ${DIFFUSION_DAEMON_NETWORK:-${COMPOSE_PROJECT_NAME:-infra}_engine_net}
      ENGINE_NETWORK: ${ENGINE_NETWORK:-${COMPOSE_PROJECT_NAME:-infra}_engine_net}
      PORT: "8082"
      ENABLE_TEXT_ENCODER_UNLOAD: ${ENABLE_TEXT_ENCODER_UNLOAD:-0}
      TRAINER_TIMEOUT_SECS: ${TRAINER_TIMEOUT_SECS:-7200}
      DATASET_CACHE_MAX_GB: ${DATASET_CACHE_MAX_GB:-15}
      OUTPUT_PURGE_TTL_SECS: ${OUTPUT_PURGE_TTL_SECS:-86400}
      TEXT_EMBEDS_CACHE_MAX_GB: ${TEXT_EMBEDS_CACHE_MAX_GB:-10}
      # orchestrator-local é dual-homed (backend_net/engine_net); o
      # otel-collector está em backend_net, rota garantida.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_SERVICE_NAME: orchestrator
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - datasets:/data/datasets
      - models:/data/models
      - outputs:/data/outputs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      manager:
        condition: service_started
      s3-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8082 && echo -e \"GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q 200 <&3'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - backend_net
      - engine_net

  # Build-only: imagem hephaestus/trainer-yolo:local (ADR-0007 D5).
  # Não inicia com `docker compose up` — só com `--profile build`.
  # Build: docker compose --profile build build trainer-yolo
  trainer-yolo:
    profiles:
      - build
    image: hephaestus/trainer-yolo:local
    build:
      context: ..
      dockerfile: engines/trainer-yolo/Dockerfile

  # Build-only: imagem hephaestus/trainer-difusao:local (ADR-0018 D3).
  # Build: docker compose --profile build build trainer-difusao
  trainer-difusao:
    profiles:
      - build
    image: hephaestus/trainer-difusao:local
    build:
      context: ..
      dockerfile: engines/trainer-difusao/Dockerfile

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    ports:
      - '${WEB_PUBLISH:-127.0.0.1}:3000:3000'
    environment:
      # resíduo 1.5 — runtime usa proxy /api (ADR-0001 T5); consumida só no ARG do build
      NEXT_PUBLIC_API_URL: http://localhost:8080
      API_INTERNAL_URL: http://principal:8080
    depends_on:
      - principal
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "node -e 'require(\"http\").get(\"http://localhost:3000/api/health\", res => process.exit(res.statusCode === 200 ? 0 : 1)).on(\"error\", () => process.exit(1))' || node -e 'require(\"http\").get(\"http://localhost:3000\", res => process.exit(res.statusCode === 200 || res.statusCode === 307 ? 0 : 1)).on(\"error\", () => process.exit(1))'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - frontend_net

volumes:
  pgdata:
  seaweed_data:
  datasets:
  models:
  outputs:
  tempo_data:
  loki_data:
  grafana_data:

networks:
  frontend_net:
    name: ${COMPOSE_PROJECT_NAME:-infra}_frontend_net
  backend_net:
    name: ${COMPOSE_PROJECT_NAME:-infra}_backend_net
  engine_net:
    name: ${COMPOSE_PROJECT_NAME:-infra}_engine_net
