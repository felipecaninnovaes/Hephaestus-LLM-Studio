# infra/tempo-config.yaml — Fatia 2c (telemetria-observabilidade §4 2c)
#
# Tempo de nó único (homelab), recebe OTLP gRPC do otel-collector (que recebe
# dos 3 serviços Rust — fatia 2a). Retenção configurável por env (default
# 30d = 720h) via `-config.expand-env` (comando no compose.yaml).

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: ${TEMPO_RETENTION:-720h}

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write: []

overrides:
  defaults:
    metrics_generator:
      processors: []
