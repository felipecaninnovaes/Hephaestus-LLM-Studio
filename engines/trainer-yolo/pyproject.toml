[project]
name = "hephaestus-trainer-yolo"
version = "0.1.0"
description = "Motor de treino YOLO — mock (ENGINE_MOCK=1) e real (@gpu, extras [train])"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[tool.uv]
package = true

[project.optional-dependencies]
train = ["ultralytics>=8.3,<8.4"]
test = ["pytest>=7.0"]

[project.scripts]
trainer-yolo-train = "trainer_yolo.train:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
