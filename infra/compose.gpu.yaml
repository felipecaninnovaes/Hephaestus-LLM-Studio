# compose.gpu.yaml — Sessão GPU no TrueNAS (ADR-0010 D1)
# Uso: docker compose -p gpu -f infra/compose.gpu.yaml --env-file infra/env.gpu up -d
# Project name "gpu" evita colisão com o projeto "infra" do dev host.
#
# Serviços:
#   orchestrator-gpu  — binário do orquestrador em container no TrueNAS,
#                        heartbeats no manager do dev host (10.15.10.3:8081),
#                        S3 SeaweedFS via LAN (10.15.10.3:8333)
#   trainer-gpu       — build-only (profile [build]), produz hephaestus/trainer-yolo:gpu
#
# O container do orquestrador vê as 2 GPUs (gpus: all — D8 ADR-0010) para
# telemetria nvidia-smi; a seleção do trainer é feita pelo executor com
# --gpus device=… (ORCH_GPU_DEVICES).

name: gpu

services:
  orchestrator-gpu:
    build:
      context: ..
      dockerfile: services/orchestrator/Dockerfile
    ports:
      - '8082:8082'
    environment:
      MANAGER_URL: "${MANAGER_URL:?Defina MANAGER_URL no env.gpu (ex: http://10.15.10.3:8081)}"
      MANAGER_TOKEN: "${MANAGER_TOKEN:?Defina MANAGER_TOKEN no env.gpu}"
      S3_ORCH_ENDPOINT_URL: "${S3_ORCH_ENDPOINT_URL:?Defina S3_ORCH_ENDPOINT_URL no env.gpu (ex: http://10.15.10.3:8333)}"
      S3_ORCH_BUCKET: "${S3_ORCH_BUCKET:-heph-data}"
      S3_ORCH_ACCESS_KEY: "${S3_ORCH_ACCESS_KEY:?Defina S3_ORCH_ACCESS_KEY no env.gpu}"
      S3_ORCH_SECRET_KEY: "${S3_ORCH_SECRET_KEY:?Defina S3_ORCH_SECRET_KEY no env.gpu}"
      ORCH_GPU_DEVICES: ${ORCH_GPU_DEVICES:-0}
      ORCH_ADVERTISE_URL: "${ORCH_ADVERTISE_URL:?Defina ORCH_ADVERTISE_URL no env.gpu (ex: http://10.15.1.2:8082)}"
      ORCH_PAIRING_CODE: "${ORCH_PAIRING_CODE:?Defina ORCH_PAIRING_CODE no env.gpu}"
      ORCH_VOL_DATASETS: gpu_gpu_datasets
      ORCH_VOL_OUTPUTS: gpu_gpu_outputs
      ORCH_GPU_ALLOW_MOCK: ${ORCH_GPU_ALLOW_MOCK:-}
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
      FLUX_MODEL_ID: ${FLUX_MODEL_ID:-}
      DIFFUSION_DAEMON_ENABLED: ${DIFFUSION_DAEMON_ENABLED:-0}
      DIFFUSION_DAEMON_PORT: ${DIFFUSION_DAEMON_PORT:-8766}
      DIFFUSION_DAEMON_IDLE_TTL_S: ${DIFFUSION_DAEMON_IDLE_TTL_S:-600}
      DIFFUSION_DAEMON_URL: ${DIFFUSION_DAEMON_URL:-}
      DIFFUSION_DAEMON_NETWORK: ${DIFFUSION_DAEMON_NETWORK:-${COMPOSE_PROJECT_NAME:-gpu}_default}
      ENGINE_NETWORK: ${ENGINE_NETWORK:-${COMPOSE_PROJECT_NAME:-gpu}_default}
      EXEC_MODE: docker
      PORT: '8082'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - gpu_datasets:/data/datasets
      - gpu_outputs:/data/outputs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8082 && echo -e \"GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q 200 <&3'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # Build-only: imagem hephaestus/trainer-yolo:gpu (ADR-0010 D5).
  # Não inicia com `docker compose up` — só com `--profile build`.
  # Build: docker compose -p gpu --profile build build trainer-gpu
  trainer-gpu:
    profiles:
      - build
    image: hephaestus/trainer-yolo:gpu
    build:
      context: ..
      dockerfile: engines/trainer-yolo/Dockerfile.gpu

  # Build-only: imagem hephaestus/trainer-difusao:gpu.
  # Build: docker compose -p gpu --profile build build trainer-difusao-gpu
  trainer-difusao-gpu:
    profiles:
      - build
    image: hephaestus/trainer-difusao:gpu
    build:
      context: ..
      dockerfile: engines/trainer-difusao/Dockerfile.gpu

volumes:
  gpu_datasets:
  gpu_outputs:
