defaults:
  headroom_gb: 2
  measure_margin: 1.25
  default_train_gb: 16
entries:
  # ── Difusão train (ADR-0018) ──
  - { engine: diffusion, model: flux-2-klein-4b, mode: train, vram_min_gb: 8 }
  - { engine: diffusion, model: flux2-klein-4b, mode: train, vram_min_gb: 8 }
  - { engine: diffusion, model: flux, mode: train, vram_min_gb: 8 }
  - { engine: diffusion, model: sdxl, mode: train, vram_min_gb: 8 }
  - { engine: diffusion, model: sd15, mode: train, vram_min_gb: 5 }
  - { engine: diffusion, model: flux2-klein-9b-8bit, mode: infer, vram_min_gb: 16 }
  - { engine: diffusion, model: flux2-klein-9b, mode: train, vram_min_gb: 28 }
  - { engine: diffusion, model: sdxl-1.0, mode: train, vram_min_gb: 20 }
  # ── Difusão generate (ADR-0023 D8) — valores espelhados do handler ──
  - { engine: diffusion, model: flux-2-klein-4b, mode: generate, vram_min_gb: 8 }
  - { engine: diffusion, model: flux2-klein-4b, mode: generate, vram_min_gb: 8 }
  - { engine: diffusion, model: sdxl, mode: generate, vram_min_gb: 8 }
  - { engine: diffusion, model: sd15, mode: generate, vram_min_gb: 6 }
  # ── YOLO train & predict ──
  - { engine: yolo, model: yolo11n, mode: train, vram_min_gb: 6 }
  - { engine: yolo, model: yolo11m, mode: train, vram_min_gb: 10 }
  - { engine: yolo, model: predict, mode: predict, vram_min_gb: 4 }
  # ── Modos auxiliares ──
  - { engine: autotracker, model: mock, mode: autotrack, vram_min_gb: 4 }
  - { engine: autolabel, model: mock, mode: autolabel, vram_min_gb: 4 }
  - { engine: autolabel, model: florence-2-base, mode: autolabel, vram_min_gb: 6 }
  # ── CLIP ──
  - { engine: clip, model: ViT-B-32, mode: train, vram_min_gb: 10 }

# ── Feature flags de performance (adr-difusao-vram) ──
features:
  - { engine: diffusion, feature: text_encoder_unload, default: false }
