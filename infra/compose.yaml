x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: pgvector/pgvector:pg16-trixie@sha256:c8483555ce48101872f888c1df8a895ff689d6c7c7a5f7ac266475f9dfe89e0b
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studio}
      POSTGRES_DB: studio
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '${DB_PUBLISH:-127.0.0.1}:5432:5432'
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      # Cold boot com volume novo (pgdata vazio) demora: initdb antes de
      # aceitar conexões/DNS registrar; sem isso o principal dá crash-loop.
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 5s
      timeout: 3s
      retries: 10

  principal:
    build:
      context: ..
      dockerfile: services/api-principal/Dockerfile
    ports:
      - '8080:8080'
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATABASE_URL: postgres://studio:${POSTGRES_PASSWORD:-studio}@db/studio
      STUDIO_PASSWORD: ${STUDIO_PASSWORD:-changeme}
      STUDIO_MASTER_KEY: ${STUDIO_MASTER_KEY:-changeme}
      MANAGER_URL: http://manager:8081
      MANAGER_TOKEN: ${MANAGER_TOKEN:-changeme}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://seaweedfs:8333}
      S3_BUCKET: ${S3_BUCKET:-heph-data}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-heph}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-heph-local-dev}
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:8333}
      S3_URL_TTL_SECS: ${S3_URL_TTL_SECS:-3600}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-mock}
      EMBEDDER_URL: ${EMBEDDER_URL:-http://embedder:8090}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-ViT-B-32}
      MODEL_DOWNLOAD_ALLOWED_HOSTS: ${MODEL_DOWNLOAD_ALLOWED_HOSTS:-}
    depends_on:
      db:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully

  # SeaweedFS S3 (ADR-0003 D0, 3b.4): identidade em infra/seaweedfs-s3.json
  # (credenciais LOCAL-DEV — rotacione antes de qualquer exposição além do
  # loopback; R1). JSON puro sem comentários: o weed faz parse estrito.
  # Bind loopback local-first: browser dev alcança localhost:8333, LAN nunca toca o bucket.
  seaweedfs:
    image: chrislusf/seaweedfs:4.45_full@sha256:04851d83f42aad1ae898d1b190e2140fd1cef1015bc1a1b783282fefcf65e03b
    command: "server -s3 -ip.bind=0.0.0.0 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -dir=/data -master.volumeSizeLimitMB=1024 -master.garbageThreshold=0.3"
    ports:
      # R1 (ADR-0003): default loopback — a LAN nunca toca o bucket. Para
      # acessar o studio de OUTRO dispositivo da rede (página via IP), o
      # operador publica a porta com SEAWEED_PUBLISH=0.0.0.0 no `.env` e
      # aponta S3_PUBLIC_ENDPOINT_URL para http://<ip-da-máquina>:8333
      # (presigned é assinado nesse host — gotcha SigV4 D3; receita no
      # .env.example). Credenciais são LOCAL-DEV: rotacione se sair da LAN.
      - '${SEAWEED_PUBLISH:-127.0.0.1}:8333:8333'
      - '127.0.0.1:9333:9333'
    restart: unless-stopped
    volumes:
      - seaweed_data:/data
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      # S3 responde 403 AccessDenied em `/` anônimo (identidade exige SigV4) —
      # qualquer RESPOSTA HTTP = API no ar. Portável GNU/BusyBox wget (a tag
      # 4.45_full é mutável: pull de 2026-09-05 trocou o wget por BusyBox, que
      # sai 1 em 403 — GNU sai 8; o probe antigo travava unhealthy). `wget -S`
      # imprime a linha HTTP/1.1 de qualquer código; falha de rede (recusada/
      # timeout) não gera resposta HTTP = fora.
      test: ["CMD-SHELL", "wget -q -S -O /dev/null http://localhost:8333/ 2>&1 | grep -q HTTP/1.1"]
      interval: 5s
      timeout: 5s
      retries: 12

  # s3-init (run-once): garante o bucket S3 após `down -v` (seaweed_data some
  # e o bucket vai junto; a identidade volta via seaweedfs-s3.json mas o
  # bucket NÃO é auto-criado p/ identidade escopada do orquestrador — sem ele
  # os uploads falham silenciosamente, jobs "done" com zero artefatos).
  # Script POSIX (sh do busybox, sem bash): só apk de curl+openssl; o retry
  # cobre a janela entre healthy e S3 100% pronto. Sem ports: isolamento de
  # engines/serviços intacto. Credenciais = mesmas LOCAL-DEV do compose.
  s3-init:
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    volumes:
      - ./scripts/ensure-bucket.sh:/ensure-bucket.sh:ro
    environment:
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_BUCKET: ${S3_BUCKET:-heph-data}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-heph}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-heph-local-dev}
    command: ["sh", "-c", "apk add --no-cache curl openssl 2>&1 | tail -1; n=0; while ! sh /ensure-bucket.sh; do n=$$(($$n+1)); [ $$n -ge 30 ] && exit 1; sleep 2; done"]
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: "no"

  # Embedder CLIP (ADR-0004 D1, 3f.3): inferência de embeddings para busca
  # semântica. INFRA local (como o SeaweedFS) — não job do orquestrador
  # (unificação runner na fatia 4). Mock hash por default (ENGINE_MOCK=1):
  # determinístico e sem torch; modo real CLIP é @gpu manual fora do compose
  # (peso ~600 MB, cache em volume models). Sem auth: rede interna docker,
  # bind só no loopback do host (R3).
  embedder:
    build:
      context: ../engines/trainer-clip
      dockerfile: Dockerfile
    environment:
      ENGINE_MOCK: "1"
      MODEL: ${EMBEDDING_MODEL:-ViT-B-32}
      PORT: "8090"
    ports:
      - '127.0.0.1:8090:8090'
    restart: unless-stopped
    volumes:
      - models:/data/models
    healthcheck:
      # stdlib pura (imagem python:3.12-slim não tem wget/curl): /health responde 200 {"status":"ok"}.
      test: ["CMD-SHELL", "python -c 'import urllib.request as u; u.urlopen(\"http://localhost:8090/health\", timeout=3)'"]
      interval: 10s
      timeout: 5s
      retries: 6

  manager:
    build:
      context: ..
      dockerfile: services/manager/Dockerfile
    ports:
      - '${MANAGER_PUBLISH:-127.0.0.1}:8081:8081'
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://studio:${POSTGRES_PASSWORD:-studio}@db/studio
      MANAGER_TOKEN: ${MANAGER_TOKEN:-changeme}
      TRAINER_IMAGE: ${TRAINER_IMAGE:-hephaestus/trainer-yolo:local}
      DIFFUSION_TRAINER_IMAGE: ${DIFFUSION_TRAINER_IMAGE:-hephaestus/trainer-difusao:local}
      AUTO_ADOPT_LOCAL: ${AUTO_ADOPT_LOCAL:-1}
    depends_on:
      db:
        condition: service_healthy
      principal:
        condition: service_started
      s3-init:
        condition: service_completed_successfully

  orchestrator-local:
    build:
      context: ..
      dockerfile: services/orchestrator/Dockerfile
    ports:
      - '${ORCHESTRATOR_PUBLISH:-127.0.0.1}:8082:8082'
    restart: unless-stopped
    environment:
      MANAGER_URL: ${MANAGER_URL:-http://manager:8081}
      MANAGER_TOKEN: ${MANAGER_TOKEN:-changeme}
      S3_ORCH_ENDPOINT_URL: ${S3_ORCH_ENDPOINT_URL:-http://seaweedfs:8333}
      S3_ORCH_BUCKET: ${S3_ORCH_BUCKET:-heph-data}
      S3_ORCH_ACCESS_KEY: ${S3_ORCH_ACCESS_KEY:-heph-orch}
      S3_ORCH_SECRET_KEY: ${S3_ORCH_SECRET_KEY:-heph-orch-local-dev}
      ORCH_WORKDIR: ${ORCH_WORKDIR:-/data}
      EXEC_MODE: ${EXEC_MODE:-docker}
      ORCH_VOL_DATASETS: ${COMPOSE_PROJECT_NAME:-infra}_datasets
      ORCH_VOL_OUTPUTS: ${COMPOSE_PROJECT_NAME:-infra}_outputs
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
      FLUX_MODEL_ID: ${FLUX_MODEL_ID:-}
      DIFFUSION_DAEMON_ENABLED: ${DIFFUSION_DAEMON_ENABLED:-1}
      DIFFUSION_DAEMON_PORT: ${DIFFUSION_DAEMON_PORT:-8766}
      DIFFUSION_DAEMON_IDLE_TTL_S: ${DIFFUSION_DAEMON_IDLE_TTL_S:-600}
      DIFFUSION_DAEMON_URL: ${DIFFUSION_DAEMON_URL:-}
      DIFFUSION_DAEMON_NETWORK: ${DIFFUSION_DAEMON_NETWORK:-${COMPOSE_PROJECT_NAME:-infra}_default}
      ENGINE_NETWORK: ${ENGINE_NETWORK:-${COMPOSE_PROJECT_NAME:-infra}_default}
      PORT: "8082"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - datasets:/data/datasets
      - models:/data/models
      - outputs:/data/outputs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      manager:
        condition: service_started
      s3-init:
        condition: service_completed_successfully

  # Build-only: imagem hephaestus/trainer-yolo:local (ADR-0007 D5).
  # Não inicia com `docker compose up` — só com `--profile build`.
  # Build: docker compose --profile build build trainer-yolo
  trainer-yolo:
    profiles:
      - build
    image: hephaestus/trainer-yolo:local
    build:
      context: ../engines/trainer-yolo
      dockerfile: Dockerfile

  # Build-only: imagem hephaestus/trainer-difusao:local (ADR-0018 D3).
  # Build: docker compose --profile build build trainer-difusao
  trainer-difusao:
    profiles:
      - build
    image: hephaestus/trainer-difusao:local
    build:
      context: ../engines/trainer-difusao
      dockerfile: Dockerfile

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    ports:
      - '3000:3000'
    environment:
      # resíduo 1.5 — runtime usa proxy /api (ADR-0001 T5); consumida só no ARG do build
      NEXT_PUBLIC_API_URL: http://localhost:8080
      API_INTERNAL_URL: http://principal:8080
    depends_on:
      - principal
    restart: unless-stopped
    logging: *default-logging

volumes:
  pgdata:
  seaweed_data:
  datasets:
  models:
  outputs:
