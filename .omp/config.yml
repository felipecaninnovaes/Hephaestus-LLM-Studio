# Config omp nativo do projeto — migrado de opencode.json
# Agentes vivem em .omp/agents/*.md; este arquivo resolve modelos e guard-rails.

modelRoles:
  #  max: "anthropic/claude-opus-5:medium" # MUITO CARO
  #  default:  "anthropic/claude-opus-5-5:medium" # MODELO CARO
  #  coder:  "anthropic/claude-sonnet-5:low" # MODELO CARO
  #  plan: "anthropic/haiku-4-5:high" # MODELO INTERMEDIARIO
  #  worker: "anthropic/haiku-4-5:medium" # MODELO BARATO
  #  explorer: "anthropic/haiku-4-5:low" # MODELO MUITO BARATO

  max: "anthropic/claude-opus-5-5:medium" # MUITO CARO
  default: "anthropic/claude-opus-5-5:medium" # MODELO CARO
  coder: "google-antigravity/gemini-3.8-flash:low" # MODELO CARO
  plan: "google-antigravity/gemini-3.8-flash:medium" # MODELO INTERMEDIARIO
  worker: "google-antigravity/gemini-3.8-flash:medium" # MODELO BARATO
  explorer: "google-antigravity/gemini-3.8-flash:low" # MODELO MUITO BARATO

bash:
  patterns:
    # Equivalente dos permission.bash do opencode, porém global (vale para
    # coordenador e subagentes). Em subagentes headless, `prompt` rejeita a
    # chamada; na sessão principal vira confirmação interativa.
    - match: "git push*"
      approval: prompt
    - match: "git merge*"
      approval: prompt
    - match: "git commit*"
      approval: prompt
