[package]
name = "search-spike"
version = "0.0.0"
edition = "2021"
publish = false

# isolado do workspace do monorepo (harness descartável do spike 3f.0)
[workspace]

[dependencies]
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }
pgvector = { version = "=0.4.1", features = ["sqlx"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
sha2 = "0.11"
