openapi: 3.1.0
info:
  title: Hephaestus Studio API
  version: 0.7.0
  summary: Contrato público do backend principal (api-principal :8080)
  description: |
    Fatia 2 (auth single-user) + Fatia 3a (datasets núcleo) + `/health`.
    Fonte funcional: `docs/backend.md` §2 (comportamento) e §9 (paths exatos).
    Decisões (hash, segredo JWT, TTL, bootstrap, erros, rate-limit): `docs/adr/0001-auth-single-user.md`.
    Demais grupos do §9 (settings, jobs, ...) entram NESTE mesmo arquivo nas
    fatias respectivas — o contrato não faz fork.
    Convenção global: todo endpoint pode responder `500` (`code: internal`), `405`
    (método não declarado na path) e `413` (`code: invalid_request`, corpo acima
    do limite — sempre no envelope) mesmo onde não listado.
    Convenção global de casing (ADR-0002 D1): TODAS as chaves de body/query/response
    em `/api/*` são camelCase (os nomes de coluna SQL que aparecem no backend.md §10
    chegam ao wire camelCase: `imagesCount`, `sizeBytes`, `lastModified`). Valores de
    enum, `Error.code` e nomes de coluna SQL permanecem snake_case. Artefatos de
    transporte (manifest.json, config.yaml, SQLite do orquestrador) são snake_case —
    a fronteira HTTP não contamina o transporte.
    A OpenAPI declara paths com `{param}`; o axum 0.7 usa `:param` e o teste de
    contrato normaliza um lado (outros estilos de path na spec = vermelho).
  license: { name: Proprietary }

servers:
  - url: http://localhost:8080
    description: >
      compose local (infra/compose.yaml porta 8080). Dev não tem TLS: o cookie de
      sessão é emitido SEM `Secure`; sob TLS (deploy remoto) `SECURE_COOKIE=true`
      adiciona `Secure` ao Set-Cookie.

tags:
  - name: auth
    description: Autenticação single-user (exatamente 1 linha na tabela `users`; sem RBAC).
  - name: health
    description: Liveness do serviço — pública por decisão do §2 (isenta do middleware de auth).
  - name: datasets
    description: Metadados de dataset no Postgres; blobs em disco e imagens a partir da Fatia 3b.
  - name: jobs
    description: Jobs de treinamento e telemetria (BFF do manager, ADR-0007).

# Proteção padrão: rotas exigem o cookie de sessão.
# Endpoints públicos declaram `security: []` explicitamente (inclusive /api/auth/me,
# que valida o cookie internamente — ver a descrição do operationId getMe).
security:
  - sessionCookie: []

paths:
  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Liveness do api-principal
      description: |
        Sempre 200 enquanto o processo vive — inclusive em "modo setup" (tabela `users`
        vazia e `STUDIO_PASSWORD` ausente), sinalizado por `auth: "setup_required"`.
        O gate de auth é fail-closed nesse estado: toda rota protegida responde 401 e
        `POST /api/auth/login` responde 503. Nunca exige credencial (uso: healthcheck do compose).
      security: []
      responses:
        "200":
          description: Serviço vivo (não requer autenticação).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }

  /api/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Autentica a instância single-user e emite o cookie de sessão
      description: |
        Compara `password` em texto puro (só loopback local) contra o hash Argon2id
        único em `users.password_hash`. Sucesso emite a sessão como cookie e repete
        o corpo de `MeResponse` (o front não precisa chamar `/me` logo após o login).
        401 é genérico por design: não distingue "usuário inexistente" de "senha errada".
        Rate-limit: NENHUM na v1 (ADR-0001 D7 — risco aceito, loopback); o 429 abaixo
        está reservado (`x-reserved: true`, ignorado pelo teste de contrato) para uma
        futura versão exposta em LAN, sem quebra de contrato.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Credencial válida — sessão iniciada (TTL 7 dias, sem refresh na v1).
          headers:
            Set-Cookie:
              required: true
              description: >
                heph_session=<jwt>; HttpOnly; SameSite=Lax; Path=/; Max-Age=604800
                (`; Secure` adicionado apenas sob TLS via SECURE_COOKIE=true).
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        "400":
          description: "Body ausente/malformado ou sem `password` (`code: invalid_request`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: "Credencial inválida (`code: invalid_credentials`). Genérico por design: não distingue usuário inexistente de senha errada."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: "Reservado — NÃO implementado na v1 (sem rate-limit em loopback; ADR-0001 D7)."
          x-reserved: true
        "503":
          description: "Modo setup — `users` vazio e `STUDIO_PASSWORD` ausente (`code: setup_required`). Indisponibilidade, não erro de credencial."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Identidade da sessão corrente
      description: |
        Nota de implementação (§2): o middleware global isenta TODO `/api/auth/*`,
        então este endpoint valida o cookie internamente — sem cookie válido/expirado
        responde 401 (`code: unauthorized`). Não é uma exceção de segurança: a
        auto-validação é o gate desta rota.
        `loggedAt` = claim `iat` do JWT (momento do login), não `users.created_at`.
      security: []
      responses:
        "200":
          description: Sessão válida.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        "401":
          description: "Cookie ausente, expirado ou inválido (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Encerra a sessão (limpeza do cookie)
      description: |
        Idempotente e insensível a credencial: sempre 204, havendo sessão válida ou não,
        emitindo o cookie expirado (Max-Age=0). O JWT stateless permanece assinado e
        válido até `exp` — sem blacklist na v1 (risco aceito, ADR-0001 D5; sessão local).
      security: []
      responses:
        "204":
          description: Sessão encerrada; cookie ordenado a limpar.
          headers:
            Set-Cookie:
              description: "heph_session=; HttpOnly; SameSite=Lax; Path=/; Max-Age=0"
              schema: { type: string }

  /api/datasets:
    get:
      operationId: listDatasets
      tags: [datasets]
      summary: Lista todos os datasets (metadados)
      description: |
        Sem paginação na Fatia 3a: devolve a coleção inteira ordenada por
        `updated_at` DESC (mais recente primeiro), porque a UI filtra/busca e
        calcula os contadores das pills no cliente (frontend.md §5.1).
        `limit`/`offset` entram como query params aditivos quando houver
        paginação real — sem quebra de contrato.
        `imagesCount`/`labeledCount`/`sizeBytes` são mantidos por trigger a
        partir de images/boxes/captions (backend.md §10) só a partir da 3b; na 3a
        não existe caminho de escrita, logo 0 para qualquer dataset — invariante
        observável (ADR-0002 T2), não estimativa.
      responses:
        "200":
          description: Lista de datasets (array cru, sem envelope).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Dataset" }
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      operationId: createDataset
      tags: [datasets]
      summary: Cria dataset vazio (metadados + classes)
      description: |
        Cria o registro com `status: "needs_labeling"` (frontend.md §4.3) e
        contadores zerados. O servidor é dono de `slug` (normalizado de
        `title`), `category`, `task`, `format`, `status` e da ordem/cor das
        classes — nenhum desses campos é aceito no body (input-trust; chaves
        desconhecidas = 400).
        A dropzone do modal NÃO pertence a esta rota: enviar imagens é
        `POST /api/datasets/:id/upload` (Fatia 3b).
        Idempotência: não há — dois POSTs iguais criam dois datasets, exceto
        quando o `slug` resultante colide (409).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDatasetRequest" }
      responses:
        "201":
          description: Dataset criado (corpo = `Dataset` completo, já derivado).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dataset" }
        "400":
          description: >
            Body ausente/malformado, campo desconhecido, `title` vazio ou que não
            produz slug, `type` fora do enum, classe fora do charset ou > 200
            classes (`code: invalid_request`). `message` é estático por code: a UI
            valida os campos no cliente e não depende de detalhe do servidor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >
            Slug já existe (`code: slug_conflict`) — `INSERT ... ON CONFLICT (slug)
            DO NOTHING` não retornou linha. Não há auto-sufixo: o nome é exibido na
            UI e será nome de diretório em disco (3b), então colisão é mostrada ao
            usuário em vez de disfarçada (ADR-0002 D5).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/datasets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: >
          PK do dataset. Valor que não parseia como UUID responde 404 `not_found`
          (não 400): a distinção não vaza informação útil e mantém o inventário de
          status fechado (ADR-0002 D8).
    get:
      operationId: getDataset
      tags: [datasets]
      summary: Detalhe de um dataset (metadados)
      description: |
        Mesmo shape de item da lista — a galeria (frontend.md §5.2) precisa de
        `type · N imagens · size · source`, e nenhuma imagem chega aqui
        (imagens são `GET /api/datasets/:id/images`, Fatia 3b).
      responses:
        "200":
          description: Dataset encontrado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dataset" }
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "Dataset inexistente ou id não-UUID (`code: not_found`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: deleteDataset
      tags: [datasets]
      summary: Remove dataset e filhos
      description: |
        `DELETE FROM datasets WHERE id=$1 RETURNING id`; a linha some e as FKs
        `ON DELETE CASCADE` (backend.md §10) removem `classes` (3a) e, a partir da
        3b, images/boxes/captions/videos. Na 3a ainda não existe artefato em disco
        para o dataset (nenhum upload), portanto o handler não toca o filesystem —
        o cleanup de disco é obrigação da 3b (ADR-0002 T3). Sem confirmação no
        contrato: o modal de exclusão é UI.
      responses:
        "204":
          description: Removido (sem corpo).
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "Dataset inexistente ou id não-UUID (`code: not_found`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/datasets/{id}/upload:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: >
          PK do dataset. Valor que não parseia como UUID responde 404 `not_found`
          (não 400): a distinção não vaza informação útil e mantém o inventário de
          status fechado (ADR-0002 D8).
    post:
      operationId: uploadImages
      tags: [datasets]
      summary: Envia lote de imagens (multipart, spool+sniff+hash)
      description: |
        Lote `multipart/form-data` com fields `files` (Fatia 3b.3, ADR-0003 D2/D7).
        Cada arquivo faz spool em tempfile (disco só efêmero, D1), sniff do
        `media_type` pelo conteúdo (nunca pelo nome, D2/D5), hash md5+sha256 em
        streaming e PUT objeto→linha→compensação (D7). Resposta 200 por item:
        `stored` | `duplicate` | `rejected` | `failed`. Lote sem nenhum arquivo
        ou com todos os itens `rejected/unsupported_media` responde 400; backend
        de objetos fora responde 503 (`code: storage_unavailable`, D10).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items: { type: string, format: binary }
      responses:
        "200":
          description: Lote processado (status por item em `UploadResult`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadResult" }
        "400":
          description: "Lote sem nenhum arquivo ou lote inteiro indecodável (`code: invalid_request`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "Dataset inexistente ou id não-UUID (`code: not_found`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "Backend de objetos indisponível (`code: storage_unavailable`, ADR-0003 D10)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/datasets/{id}/export:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: >
          PK do dataset. Valor que não parseia como UUID responde 404 `not_found`
          (não 400, padrão D8 replicado).
    post:
      operationId: exportDataset
      tags: [datasets]
      summary: Exporta o dataset como backup estruturado (.zip em stream)
      description: |
        Backup estruturado do dataset (Fatia 3e.1, ADR-0006 D1/D2): o zip nasce
        do banco em tempdir (`manifest.json` fonte da verdade + `dataset.yaml` /
        `labels/*.txt` / `captions.jsonl` derivados + `images/*`) e é
        respondido em stream — o zip nunca toca o bucket. Só imagens ativas
        (`deleted_at IS NULL`); imagem com linha mas sem objeto é pulada
        (os `counts` do manifest refletem o exportado); dataset vazio ⇒ 200
        com zip só-manifest (`counts.images=0`). O `manifest.json` é artefato
        de transporte snake_case (fora de `/api/*`, a fronteira HTTP não
        contamina o transporte).
      responses:
        "200":
          description: Zip do backup (`{slug}.zip`).
          headers:
            Content-Disposition:
              required: true
              description: 'attachment; filename="{slug}.zip" (slug é kebab-case ASCII, seguro no header).'
              schema: { type: string }
            Content-Length:
              required: true
              description: Tamanho do arquivo spoolado.
              schema: { type: integer }
          content:
            application/zip:
              schema: { type: string, format: binary }
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "Dataset inexistente ou id não-UUID (`code: not_found`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "Backend de objetos indisponível (`code: storage_unavailable`, ADR-0003 D10)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/datasets/{id}/package:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: >
          PK do dataset. Valor que não parseia como UUID responde 404 `not_found`
          (não 400, padrão D8 replicado).
    post:
      operationId: packageDataset
      tags: [datasets]
      summary: Congela versão do dataset e gera package para treino
      description: |
        Congela o dataset como `dataset_versions` (snapshot JSONB com classes,
        imagens ativas e boxes), materializa a árvore YOLO (labels/*.txt +
        dataset.yaml) em tempdir, gera zip e faz PUT em
        `packages/<version_id>/dataset.zip` + `manifest.json`.
        Apenas `engine: "yolo"` é suportado na v1; outros valores retornam
        400 `engine_unsupported`. O snapshot congelado é imutável — edição
        posterior do dataset não afeta a versão (trava lógica por versão, ADR-0007).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PackageRequest" }
      responses:
        "200":
          description: Package criado (`PackageResponse` com versão congelada).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackageResponse" }
        "400":
          description: "Body inválido (`code: invalid_request`) ou engine não suportado (`code: engine_unsupported`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "Dataset inexistente ou id não-UUID (`code: not_found`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "Backend de objetos indisponível (`code: storage_unavailable`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/datasets/import:
    post:
      operationId: importDataset
      tags: [datasets]
      summary: Importa um backup estruturado (.zip do export)
      description: |
        Restaura um backup gerado pelo export (Fatia 3e.2, ADR-0006 D3–D7):
        o `manifest.json` é a fonte da verdade do roundtrip (os derivados
        `dataset.yaml` / `labels/*.txt` / `captions.jsonl` são ignorados);
        validação completa do pacote ANTES de qualquer write/teardown;
        `origin` das boxes e do caption preservado literal; classes recriadas
        por `idx` com cores da paleta (nunca do cliente). Substituição
        consentida: slug existente + sem `replace` ⇒ 409 `slug_conflict`
        (protocolo de detecção — o servidor nunca substitui sozinho); a UI
        confirma a irreversibilidade e re-envia com `replace=true` ⇒ teardown
        + ingest com dataset_id novo (201). Corpo total limitado a
        200 MiB + 8 MiB de envelope (413 global).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Pacote `.zip` do export (obrigatório).
                title:
                  type: string
                  description: Override do nome (opcional, ≤96 chars — importar como dataset novo); ausente/vazio usa o `title` do manifest.
                replace:
                  type: string
                  enum: ["true", "false"]
                  description: Consentimento para SUBSTITUIR o dataset de mesmo slug (opcional, default `false`; valor inválido ⇒ 400 `invalid_request`).
      responses:
        "201":
          description: Dataset recriado (`Dataset` existente — nenhum schema novo de resposta).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dataset" }
        "400":
          description: "Form inválido (sem `file`, `title`/`replace` inválidos; `code: invalid_request`) ou pacote inválido (manifest ausente/incompatível/corrompido, zip-slip/bomb, dedupe, sha256/media_type divergentes, domínios inválidos; `code: import_invalid`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "Slug já existe e `replace` não é `true` (`code: slug_conflict` — protocolo de detecção da substituição, ADR-0006 D5)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "Backend de objetos indisponível (`code: storage_unavailable`, ADR-0003 D10)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/datasets/{id}/images/{imageId}/boxes:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: >
          PK do dataset. Valor que não parseia como UUID responde 404 `not_found`
          (não 400, padrão D8 replicado).
      - name: imageId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: >
          PK da imagem. Valor que não parseia como UUID responde 404 `not_found`
          (não 400, padrão D8 replicado). Escopada ao dataset: imagem de outro
          dataset responde 404.
    put:
      operationId: putBoxes
      tags: [datasets]
      summary: Substitui as boxes da imagem (anotação de detecção)
      description: |
        Substituição total das `boxes` da imagem (Fatia 3b.6, ADR-0003 D6):
        apaga todas e insere as enviadas (ids novos). Máx 1000 boxes por request
        (anti-DoS). `origin` ausente vira `manual`. Classes precisam pertencer ao
        dataset (classe de outro dataset ⇒ 400 sem vazar existência). Sem chamada
        de storage (sem 503). Resposta canônica com os mesmos uuids inseridos.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PutBoxesRequest" }
      responses:
        "200":
          description: Boxes substituídas (`PutBoxesResponse`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PutBoxesResponse" }
        "400":
          description: "Body inválido (parse, `deny_unknown_fields`, validação 0..1/`conf`/`origin`, lista > 1000, classe fora do dataset; `code: invalid_request`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "Dataset/imagem inexistente, id/imageId não-UUID ou imagem de outro dataset (`code: not_found`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/datasets/{id}/images/{imageId}/caption:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: >
          PK do dataset. Valor que não parseia como UUID responde 404 `not_found`
          (não 400, padrão D8 replicado).
      - name: imageId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: >
          PK da imagem. Valor que não parseia como UUID responde 404 `not_found`
          (não 400, padrão D8 replicado). Escopada ao dataset: imagem de outro
          dataset responde 404.
    put:
      operationId: putCaption
      tags: [datasets]
      summary: Insere ou atualiza a legenda da imagem (upsert)
      description: |
        Upsert do `caption` da imagem (Fatia 3b.6, ADR-0003 D6, PK = image_id):
        `text` vazio ⇒ 400 (a linha não nasce; imagem segue `unlabeled`).
        `origin` ausente vira `manual`. Sem chamada de storage (sem 503).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PutCaptionRequest" }
      responses:
        "200":
          description: Legenda gravada (`Caption`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Caption" }
        "400":
          description: "Body inválido (parse, `deny_unknown_fields`, `text` fora de 1..8000 chars, `origin` fora do domínio; `code: invalid_request`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "Dataset/imagem inexistente, id/imageId não-UUID ou imagem de outro dataset (`code: not_found`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/datasets/{id}/classes:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: >
          PK do dataset. Valor que não parseia como UUID responde 404 `not_found`
          (não 400, padrão D8 replicado).
    put:
      operationId: putClasses
      tags: [datasets]
      summary: Substitui as classes do dataset (reconciliação por id)
      description: |
        Substituição total das `classes` do dataset (Fatia 3g.1, ADR-0005 D2/D3)
        com reconciliação por id: item com `id` renomeia preservando o id (as
        boxes que apontam para ele não são tocadas); item sem `id` cria nova;
        classe existente ausente do request é removida — mas remoção de classe
        em uso por anotações responde 409 e não escreve nada (a transação
        inteira aborta). A ordem do array vira `idx` 0..n-1 e `color` é
        rederivada da paleta por `idx % 6` (nunca vem do cliente). Máx 200
        classes por request. `id` de classe de outro dataset ⇒ 400 sem vazar
        existência. Sem chamada de storage (sem 503).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PutClassesRequest" }
      responses:
        "200":
          description: Classes substituídas (`PutClassesResponse`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PutClassesResponse" }
        "400":
          description: "Body inválido (parse, `deny_unknown_fields`, lista > 200, nome fora da regex `^[A-Za-z0-9_][A-Za-z0-9_]{0,63}$`, nome/id duplicado, `id` fora do dataset; `code: invalid_request`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "Dataset inexistente ou id não-UUID (`code: not_found`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "Classe que seria removida está em uso por anotações (`code: classes_in_use`); nada foi escrito."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/datasets/{id}/images/{imageId}/restore:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: >
          PK do dataset. Valor que não parseia como UUID responde 404 `not_found`
          (não 400, padrão D8 replicado).
      - name: imageId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: >
          PK da imagem. Valor que não parseia como UUID responde 404 `not_found`
          (não 400, padrão D8 replicado). Escopada ao dataset: imagem de outro
          dataset responde 404.
    post:
      operationId: restoreImage
      tags: [datasets]
      summary: Restaura imagem da lixeira (com rename se houver conflito)
      description: |
        Tira a imagem da lixeira (Fatia 3g.2, ADR-0005 D4): sem conflito de
        filename ativo ⇒ 204; com conflito ⇒ cópia server-side para key nova
        (mesmo imageId, filename `{stem}_restaurado{ext}` com desambiguação
        numérica) ⇒ 200 `{filename}`. Imagem ativa (não-deletada) ⇒ 404.
        Falha da cópia ⇒ 503 sem escrever nada.
      responses:
        "200":
          description: Restaurada com rename (`RestoreImageResponse` com o filename novo).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RestoreImageResponse" }
        "204":
          description: Restaurada sem conflito (sem corpo).
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "Dataset/imagem inexistente, id/imageId não-UUID, imagem ativa (fora da lixeira) ou de outro dataset (`code: not_found`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "Cópia do objeto falhou (`code: storage_unavailable`, ADR-0003 D10); a linha continua na lixeira."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/datasets/{id}/trash:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: >
          PK do dataset. Valor que não parseia como UUID responde 404 `not_found`
          (não 400, padrão D8 replicado).
    delete:
      operationId: deleteTrash
      tags: [datasets]
      summary: Purga permanente da lixeira do dataset
      description: |
        Apaga DEFINITIVAMENTE as imagens soft-deleted do dataset (Fatia 3g.2,
        ADR-0005 D4): DELETE com RETURNING (CASCADE em boxes/captions, trigger
        recalcula contadores) + sweep `delete_prefix` por imagem best-effort
        (falha loga, nunca vira erro). Lixeira vazia ⇒ 204 (idempotente).
      responses:
        "204":
          description: Lixeira purgada (sem corpo; vazia também é 204).
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "Dataset inexistente ou id não-UUID (`code: not_found`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/datasets/{id}/search/index:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: >
          PK do dataset. Valor que não parseia como UUID responde 404 `not_found`
          (não 400, padrão D8 replicado).
    post:
      operationId: indexDataset
      tags: [datasets]
      summary: Rebuild dos embeddings do dataset (fire-and-forget)
      description: |
        Dispara a indexação assíncrona (Fatia 3f.4, ADR-0004 D4/D5): 202 sempre.
        Dataset sem imagens ⇒ `{"status":"not_indexed"}` (não trabalha); senão
        spawna o indexador (advisory lock serializa disparos concorrentes) e
        responde `{"status":"indexing"}` sem esperar. O progresso é derivado em
        `GET …/search/status`; `stale` nunca é emitido na v1 (reservado).
      responses:
        "202":
          description: Rebuild disparado (`indexing`) ou dataset sem imagens (`not_indexed`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchIndexResponse" }
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "Dataset inexistente ou id não-UUID (`code: not_found`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/datasets/{id}/search/status:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: >
          PK do dataset. Valor que não parseia como UUID responde 404 `not_found`
          (não 400, padrão D8 replicado).
    get:
      operationId: getSearchStatus
      tags: [datasets]
      summary: Estado derivado da indexação do dataset
      description: |
        Contadores derivados (Fatia 3f.4, ADR-0004 D4/D5): `imagesCount` conta
        `images` ativas (`deleted_at IS NULL` — lixeira invisível); `indexedCount`
        conta `image_embeddings` do modelo ativo. `status` (D5 literal): 0
        embeddings do modelo ativo ⇒ `not_indexed` (o front oferece "Indexar
        agora", que também é o reparo manual para crash puro); 0 < `indexedCount`
        < `imagesCount` ⇒ `indexing`; iguais ⇒ `ready`. `stale` nunca é emitido
        na v1 (reservado).
      responses:
        "200":
          description: Estado da indexação (`SearchStatus`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchStatus" }
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "Dataset inexistente ou id não-UUID (`code: not_found`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/datasets/{id}/search:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: >
          PK do dataset. Valor que não parseia como UUID responde 404 `not_found`
          (não 400, padrão D8 replicado).
    get:
      operationId: searchDataset
      tags: [datasets]
      summary: Busca semântica por texto no dataset
      description: |
        Busca por similaridade coseno sobre os embeddings do modelo ativo
        (Fatia 3f.5, ADR-0004 D5): o texto `q` é embedado e os top-k candidatos
        vêm do HNSW global (`LIMIT k*4`, cap 400) com pós-filtro em Rust
        (`classId`/`split` — o índice global não filtra). `indexedCount == 0`
        no modelo ativo ⇒ 409 `index_not_ready` (dataset com imagens mas sem
        embeddings — o front oferece "Indexar agora"); embedder inalcançável
        ⇒ 503 `embedding_unavailable`. `score` = cosseno RAW (faixa -1..1;
        CLIP normaliza L2 no embedder), ordenado desc.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 500 }
          description: Texto da consulta (1..500 chars; ausente/vazio ⇒ 400).
        - name: k
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
          description: Tamanho do top-k (default 20; fora de 1..100 ⇒ 400).
        - name: classId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: >
            Filtro opcional por classe (só imagens com ao menos 1 box da classe
            passam). Não-UUID ⇒ 400 `invalid_request` — divergência CONSCIENTE
            do D8 (filtro opcional, não id de recurso; documentada na ADR-0004).
        - name: split
          in: query
          required: false
          schema: { type: string, enum: [train, val] }
          description: Filtra pelo split (mesmo domínio do CHECK da migration 0003; outro valor ⇒ 400).
      responses:
        "200":
          description: Resultados ordenados por score desc (`SearchResponse`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
        "400":
          description: "Consulta inválida (`code: invalid_request`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "Dataset inexistente ou id não-UUID (`code: not_found`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "Dataset sem embeddings do modelo ativo (`code: index_not_ready`, ADR-0004 D5)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "Embedder inalcançável (`code: embedding_unavailable`, ADR-0004 D1)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/datasets/{id}/search/by-image:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: >
          PK do dataset. Valor que não parseia como UUID responde 404 `not_found`
          (não 400, padrão D8 replicado).
    post:
      operationId: searchByImage
      tags: [datasets]
      summary: Busca semântica por imagem do dataset
      description: |
        Similaridade coseno com o vetor de query = o embedding da própria
        imagem no modelo ativo (Fatia 3f.5, ADR-0004 D5): nunca chama o
        embedder (sem 503). `imageId` não-UUID ou imagem fora do dataset ⇒
        404 `not_found` (D8 replicado); imagem sem embedding no modelo ativo
        ⇒ 409 `index_not_ready`. A própria imagem aparece com score ~1.0
        (não excluída — a UI destaca). `score` = cosseno RAW (faixa -1..1;
        CLIP normaliza L2 no embedder), ordenado desc.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ByImageRequest" }
      responses:
        "200":
          description: Resultados ordenados por score desc (`SearchResponse`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
        "400":
          description: "Corpo inválido (`code: invalid_request`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "Dataset inexistente, id não-UUID ou imagem fora do dataset (`code: not_found`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "Imagem sem embedding do modelo ativo (`code: index_not_ready`, ADR-0004 D5)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/datasets/{id}/images:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: >
          PK do dataset. Valor que não parseia como UUID responde 404 `not_found`
          (não 400): a distinção não vaza informação útil e mantém o inventário de
          status fechado (ADR-0002 D8).
    get:
      operationId: listImages
      tags: [datasets]
      summary: Página de imagens do dataset
      description: |
        Página ordenada por `createdAt` DESC com filtros `split`/`labeled`/`deleted`
        (Fatia 3b.3, ADR-0003). `labeled` usa a taxonomia R9 do trigger da
        migration 0003 (`yolo_txt` ⇒ boxes, demais ⇒ captions). `url` por imagem:
        presigned assinado no endpoint público quando `S3_PUBLIC_ENDPOINT_URL`
        configurado, senão fallback `GET …/images/:imageId/data` (D3; a rota
        `/data` chega na 3b.5).
      parameters:
        - name: split
          in: query
          required: false
          schema: { type: string, enum: [train, val] }
          description: Filtra pelo split (`train` default na escrita).
        - name: labeled
          in: query
          required: false
          schema: { type: string, enum: ["true", "false"] }
          description: Filtra por rotulada/não-rotulada (case-insensitivo).
        - name: deleted
          in: query
          required: false
          schema: { type: string, enum: ["true", "false"] }
          description: "Lixeira (3g.2, case-insensitivo, default false). `true` lista só soft-deleted (`total` conta o escopo)."
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
          description: Tamanho da página (default 50, máx 200).
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
          description: Deslocamento da página (default 0).
      responses:
        "200":
          description: Página de imagens (`ImagePage`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImagePage" }
        "400":
          description: "Query inválida (`split`/`labeled`/`deleted`/`limit`/`offset` fora do domínio; `code: invalid_request`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "Dataset inexistente ou id não-UUID (`code: not_found`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/datasets/{id}/images/{imageId}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: >
          PK do dataset. Valor que não parseia como UUID responde 404 `not_found`
          (não 400): a distinção não vaza informação útil e mantém o inventário de
          status fechado (ADR-0002 D8).
      - name: imageId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: >
          PK da imagem. Valor que não parseia como UUID responde 404 `not_found`
          (não 400, padrão D8 replicado). Escopada ao dataset: imagem de outro
          dataset responde 404.
    get:
      operationId: getImage
      tags: [datasets]
      summary: Detalhe de uma imagem (Image + boxes + caption)
      description: |
        Image completa com `boxes` (ordem determinística por id) e `caption`
        (nullable, no máximo uma por imagem). `url` segue a regra híbrida D3
        (presigned com endpoint público, senão fallback `/data`). Floats de
        boxes ecoam o banco (Fatia 3b.5, ADR-0003).
      responses:
        "200":
          description: Imagem encontrada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageDetail" }
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "Dataset/imagem inexistente, id/imageId não-UUID ou imagem de outro dataset (`code: not_found`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: deleteImage
      tags: [datasets]
      summary: Move a imagem para a lixeira (soft delete)
      description: |
        Soft delete da imagem (Fatia 3g.2, ADR-0005 D4): marca `deleted_at`
        (sai da listagem default, some dos contadores) sem tocar o objeto no
        bucket — restaurável via `POST …/restore`. Inexistente, já na lixeira
        ou de outro dataset ⇒ 404.
      responses:
        "204":
          description: Imagem na lixeira (sem corpo).
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "Dataset/imagem inexistente, id/imageId não-UUID, imagem já na lixeira ou de outro dataset (`code: not_found`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/datasets/{id}/images/{imageId}/data:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: >
          PK do dataset. Valor que não parseia como UUID responde 404 `not_found`
          (não 400, padrão D8 replicado).
      - name: imageId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: >
          PK da imagem. Valor que não parseia como UUID responde 404 `not_found`
          (não 400, padrão D8 replicado).
    get:
      operationId: getImageData
      tags: [datasets]
      summary: Bytes do objeto (proxy, fallback incondicional da D3)
      description: |
        Proxy do objeto no storage (Fatia 3b.5, ADR-0003 D3): funciona SEM flag
        pública. `content-type` vem do `media_type` da linha; `cache-control:
        private, max-age=31536000, immutable` (chave imutável por image_id, D5).
        Linha sem objeto = 404 honesto; backend fora = 503.
      responses:
        "200":
          description: Bytes da imagem.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "Dataset/imagem inexistente, id/imageId não-UUID ou objeto ausente no storage (`code: not_found`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "Backend de objetos indisponível (`code: storage_unavailable`, ADR-0003 D10)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: Lista todos os jobs (BFF do manager)
      description: |
        Lista jobs via manager (ADR-0007 D3). Filtros opcionais `status` e `engine`.
        Manager indisponível ⇒ 503 `queue_unavailable`.
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string }
          description: Filtro por status do job.
        - name: engine
          in: query
          required: false
          schema: { type: string }
          description: Filtro por engine.
      responses:
        "200":
          description: Lista de jobs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobList" }
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "Manager indisponível (`code: queue_unavailable`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/jobs/queue:
    get:
      operationId: listJobQueue
      tags: [jobs]
      summary: Fila ordenada de jobs
      description: |
        Fila de jobs ordenada por posição (ADR-0007 D7). Manager indisponível ⇒ 503 `queue_unavailable`.
      responses:
        "200":
          description: Fila de jobs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobQueue" }
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "Manager indisponível (`code: queue_unavailable`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/jobs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: >
          PK do job. Valor que não parseia como UUID responde 404 `not_found`
          (não 400, padrão D8).
    get:
      operationId: getJob
      tags: [jobs]
      summary: Detalhe de um job
      description: |
        Detalhe do job via manager (ADR-0007 D3). Manager indisponível ⇒ 503 `queue_unavailable`.
      responses:
        "200":
          description: Job encontrado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "Job inexistente ou id não-UUID (`code: not_found`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "Manager indisponível (`code: queue_unavailable`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/jobs/{id}/metrics:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: "PK do job. UUID inválido ⇒ 404 `not_found` (D8)."
    get:
      operationId: getJobMetrics
      tags: [jobs]
      summary: Métricas de treinamento por epoch
      description: |
        Séries por epoch com re-mapeamento camelCase (ADR-0007 D7): `mAP50-95` → `map5095`.
        Job existe mas sem métricas ⇒ 200 com `items: []`.
      responses:
        "200":
          description: Métricas do job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobMetrics" }
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "Job inexistente ou id não-UUID (`code: not_found`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "Manager indisponível (`code: queue_unavailable`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/jobs/{id}/artifacts:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: "PK do job. UUID inválido ⇒ 404 `not_found` (D8)."
    get:
      operationId: listJobArtifacts
      tags: [jobs]
      summary: Artefatos de um job
      description: |
        Lista artefatos do job via manager (ADR-0007 D8). Manager indisponível ⇒ 503 `queue_unavailable`.
      responses:
        "200":
          description: Lista de artefatos.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactList" }
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "Job inexistente ou id não-UUID (`code: not_found`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "Manager indisponível (`code: queue_unavailable`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/jobs/{id}/artifacts/{artifactId}/data:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: "PK do job. UUID inválido ⇒ 404 `not_found` (D8)."
      - name: artifactId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: "PK do artefato. UUID inválido ⇒ 404 `not_found` (D8)."
    get:
      operationId: getJobArtifactData
      tags: [jobs]
      summary: Bytes do artefato (proxy)
      description: |
        Proxy do objeto do artefato (ADR-0007 D8): metadata via manager +
        objeto via StoragePort (admin), key = `artifacts/<job_id>/<path>`.
        Confere `md5` se barato. Manager indisponível ⇒ 503; storage fora ⇒ 503.
      responses:
        "200":
          description: Bytes do artefato.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "Job/artefato inexistente ou id não-UUID (`code: not_found`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "Manager ou storage indisponível (`code: queue_unavailable` ou `storage_unavailable`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/telemetry:
    get:
      operationId: getTelemetry
      tags: [jobs]
      summary: Telemetria do sistema (CPU/RAM/VRAM)
      description: |
        Proxy puro do cache de telemetria do manager (ADR-0007 D9).
        Sem GPU (mock) ⇒ `measured: false`, `vramUsed/vramTotal: null`.
        Manager indisponível ⇒ 503 `queue_unavailable` (delta consciente da D7
        original :355 — o docs-sync cobre depois).
      responses:
        "200":
          description: Telemetria do sistema.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Telemetry" }
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "Manager indisponível (`code: queue_unavailable`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: heph_session
      description: >
        JWT HS256 (jsonwebtoken 9; claims iss/sub/iat/exp/jti, TTL 7d, ADR-0001 D2).
        Somente o api-principal emite e valida; front nunca lê o valor (HttpOnly).
        Todas as rotas fora do domínio auth exigem este cookie via middleware de auth
        (backend.md §2), com `/health` e `/api/auth/*` isentos do gate.

  schemas:
    LoginRequest:
      type: object
      required: [password]
      additionalProperties: false
      properties:
        password:
          type: string
          format: password
          description: Senha em texto puro transportada apenas em loopback local; nunca logada pelo servidor.

    MeResponse:
      type: object
      required: [userId, loggedAt]
      properties:
        userId:
          type: string
          format: uuid
          description: PK da linha única de `users` (ADR-0001 D2; gen_random_uuid(), nativo PG13+).
        loggedAt:
          type: string
          format: date-time
          description: Momento de emissão da sessão (claim `iat` do JWT), RFC 3339.

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [invalid_request, invalid_credentials, unauthorized, setup_required, not_found, slug_conflict, storage_unavailable, classes_in_use, index_not_ready, embedding_unavailable, import_invalid, engine_unsupported, queue_unavailable, internal]
          description: "Código estável para máquina — a UI decide a mensagem por `code`, nunca por `message`; o cliente DEVE ter ramo default: o enum cresce por fatia (aditivo na 0.2.0: `not_found`, `slug_conflict`; na 0.3.0: `storage_unavailable`, ADR-0003 D10; na 0.3.0, fatia 3g.1: `classes_in_use`; na 0.5.0, fatia 3f.5: `index_not_ready`, `embedding_unavailable`, ADR-0004 D5; na 0.6.0, fatia 3e: `import_invalid`; na 0.7.0, fatia 4: `engine_unsupported`, `queue_unavailable`)."
        message:
          type: string
          description: Humano-curto, ESTÁTICO por code; nunca contém hash, token, segredo ou existência de usuário.

    HealthResponse:
      type: object
      required: [status, service, auth]
      properties:
        status:
          type: string
          enum: [ok]
          description: Liveness do processo.
        service:
          type: string
          description: 'Nome do serviço (ex.: api-principal).'
        auth:
          type: string
          enum: [ready, setup_required]
          description: "Estado do bootstrap single-user (ADR-0001 D3): ready = usuário existe; setup_required = aguardando STUDIO_PASSWORD no primeiro boot."

    CreateDatasetRequest:
      type: object
      required: [title, type]
      additionalProperties: false
      description: >
        Espelha o modal `create-dataset-modal` (frontend.md §4.3): nome, tipo de
        modelo/tarefa e classes CSV. O front faz o split do CSV; o wire é array de
        nomes. A dropzone do modal NÃO pertence a esta rota (upload é a 3b).
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 96
          description: >
            Nome humano. O servidor deriva `slug` (minúsculas, sem acentos via
            mapa Latin-1 explícito, runs de não-`[a-z0-9]` viram `-`, sem `-` nas
            pontas, 96 máx); resultado vazio ⇒ 400.
        type:
          type: string
          enum: [yolo_bbox, yolo_seg, difusao_lora, clip_image_text]
          description: >
            As 4 options do modal (frontend.md §4.3). Código de máquina estável;
            o rótulo pt-BR é exclusividade da UI. `category`, `task` e `format`
            são derivados daqui pelo servidor — nunca enviados pelo cliente.
        classes:
          type: array
          maxItems: 200
          default: []
          items: { type: string, pattern: '^[A-Za-z0-9_][A-Za-z0-9_]{0,63}$' }
          description: >
            Nomes de classe na ordem escolhida → `classes.idx` 0-based (convenção
            YOLO). O servidor faz trim e deduplica preservando a primeira
            ocorrência; `color` vem da paleta do design system por `idx % 6`.
            Restrição idêntica ao CHECK do banco: os nomes precisam sobreviver a
            `data.yaml` e a `labels/*.txt`.

    Dataset:
      type: object
      required:
        - id
        - slug
        - title
        - category
        - type
        - task
        - format
        - status
        - sizeBytes
        - imagesCount
        - labeledCount
        - trashCount
        - classes
        - autoTracked
        - createdAt
        - lastModified
      properties:
        id: { type: string, format: uuid }
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          maxLength: 96
          description: Identificador kebab-case gerado pelo servidor; UNIQUE no banco.
        title:
          type: string
          description: Nome humano como enviado no create (frontend.md §8 usa `title`; o card exibe `slug`).
        category:
          type: string
          enum: [difusao, openclip, yolo]
          description: Derivada de `type` (backend.md §10).
        type:
          type: string
          enum: [yolo_bbox, yolo_seg, difusao_lora, clip_image_text]
        task:
          type: string
          enum: [detect_track, segment, caption, embedding]
          description: Derivada de `type` (tabela server-side em `datasets::models::derive`).
        format:
          type: string
          enum: [yolo_txt, captions, pairs]
          description: Formato canônico em disco por engine (backend.md §3); derivado de `category`.
        status:
          type: string
          enum: [ready, in_progress, needs_labeling]
          description: "`needs_labeling` no create (frontend.md §4.3); transições por trigger de contadores nas fatias 3b/3c."
        source:
          type: [string, "null"]
          description: >
            Valor derivado `s3://<bucket>/datasets/<id>/` quando há imagens,
            `null` em dataset vazio (referência ADR-0003 D5).
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
          description: Bytes agregados de `images`; 0 na 3a. A UI formata ("1.4 GB") em `lib/format.ts`.
        imagesCount: { type: integer, minimum: 0 }
        labeledCount: { type: integer, minimum: 0 }
        trashCount:
          type: integer
          minimum: 0
          description: "Imagens na lixeira do dataset (derivado 3g.3, ADR-0005 D11; aditivo na 0.4.0)."
        classes:
          type: array
          items: { $ref: "#/components/schemas/Class" }
          description: "nomes no create request; objeto completo na resposta (3b.7 — classId exposto p/ PUT boxes)."
        autoTracked:
          type: boolean
          default: false
          description: >
            Derivado do banco desde a 3d (dívida T7 do ADR-0002 quitada):
            `EXISTS` sobre `boxes.origin = 'autotracker'` das imagens do
            dataset; era constante `false` na 3a/3b.
        createdAt: { type: string, format: date-time }
        lastModified:
          type: string
          format: date-time
          description: "`datasets.updated_at` (RFC 3339), não string relativa; a UI formata 'há 12 minutos'."

    Class:
      type: object
      required: [id, name, idx, color]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        idx: { type: integer, minimum: 0 }
        color:
          type: string
          pattern: '^#[0-9a-f]{6}$'
          description: Cor da paleta do design system por `idx % 6`.

    UploadItem:
      type: object
      required: [filename, status]
      description: "Status por arquivo do lote (ADR-0003 D2)."
      properties:
        imageId:
          type: [string, "null"]
          format: uuid
          description: PK da linha em `images`; null em `rejected`.
        filename:
          type: string
          description: Nome canônico (stem sanitizado + extensão do sniff).
        status:
          type: string
          enum: [stored, duplicate, rejected, failed]
          description: Resultado por item (200 mesmo com `rejected`/`failed` individuais).
        reason:
          type: [string, "null"]
          enum: [duplicate_filename, unsupported_media, too_large, storage_error, null]
          description: Motivo do não-`stored` (null quando `stored`).
        bytes:
          type: [integer, "null"]
          description: Tamanho real do spool (só em `stored`).
        width:
          type: [integer, "null"]
          description: Largura decodificada (só em `stored`).
        height:
          type: [integer, "null"]
          description: Altura decodificada (só em `stored`).

    UploadResult:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/UploadItem" }

    Image:
      type: object
      required: [id, filename, objectKey, bytes, width, height, mediaType, split, url, createdAt]
      description: "Imagem indexada (ADR-0003 D2/D5; md5/sha256 ficam no banco, fora do wire)."
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        objectKey:
          type: string
          description: Chave legível `datasets/{dataset_id}/images/{image_id}/{nome}` (D5).
        bytes: { type: integer, format: int64, minimum: 0 }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        mediaType:
          type: string
          enum: [jpeg, png, webp]
          description: Canônico do conteúdo via sniff, não do form (D2/D5).
        split:
          type: string
          enum: [train, val]
        url:
          type: string
          description: Presigned no endpoint público (D3) ou fallback `/data` da 3b.5.
        createdAt: { type: string, format: date-time }

    ImagePage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Image" }
        total:
          type: integer
          minimum: 0
          description: Total com os filtros, sem o LIMIT.
        limit: { type: integer }
        offset: { type: integer }

    Box:
      type: object
      required: [id, classId, x, y, w, h, origin]
      description: "Anotação de detecção (ADR-0003 D6; x/y/w/h centro+dimensões normalizados 0..1)."
      properties:
        id: { type: string, format: uuid }
        classId: { type: string, format: uuid }
        x: { type: number, minimum: 0, maximum: 1 }
        y: { type: number, minimum: 0, maximum: 1 }
        w: { type: number, minimum: 0, maximum: 1 }
        h: { type: number, minimum: 0, maximum: 1 }
        conf:
          type: [number, "null"]
          description: Confiança (null em anotação manual/importada).
        origin:
          type: string
          enum: [manual, autotracker, import]
        trackId:
          type: [integer, "null"]
          description: Id de track (convenção — preenchido só em origem autotracker com tracking; API não impõe).

    Caption:
      type: object
      required: [text, origin, updatedAt]
      description: "Legenda da imagem (no máximo uma por imagem, PK = image_id)."
      properties:
        text: { type: string, minLength: 1, maxLength: 8000 }
        origin:
          type: string
          enum: [manual, autotracker, import]
        model:
          type: [string, "null"]
          description: Modelo gerador (convenção — preenchido em origem autotracker; teto de 255 chars ⇒ 400).
        updatedAt: { type: string, format: date-time }

    PutBoxesRequest:
      type: object
      required: [boxes]
      additionalProperties: false
      description: "Substituição total das boxes (máx 1000, anti-DoS)."
      properties:
        boxes:
          type: array
          maxItems: 1000
          items:
            type: object
            required: [classId, x, y, w, h]
            additionalProperties: false
            properties:
              classId:
                type: string
                format: uuid
                description: PK em `classes` (precisa pertencer ao dataset).
              x: { type: number, minimum: 0, maximum: 1 }
              y: { type: number, minimum: 0, maximum: 1 }
              w: { type: number, minimum: 0, maximum: 1 }
              h: { type: number, minimum: 0, maximum: 1 }
              conf:
                type: [number, "null"]
                minimum: 0
                maximum: 1
                description: Confiança (null em anotação manual/importada).
              origin:
                type: string
                enum: [manual, autotracker, import]
                default: manual
                description: Origem da anotação (ausente vira `manual`).
              trackId:
                type: [integer, "null"]
                description: Id de track (convenção — preenchido só em origem autotracker com tracking; API não impõe).

    PutBoxesResponse:
      type: object
      required: [boxes]
      description: "Boxes após a substituição (ids novos, eco do banco)."
      properties:
        boxes:
          type: array
          items: { $ref: "#/components/schemas/Box" }

    PutCaptionRequest:
      type: object
      required: [text]
      additionalProperties: false
      description: "Upsert da legenda (PK = image_id)."
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 8000
          description: Texto da legenda (vazio ⇒ 400, a linha não nasce).
        origin:
          type: string
          enum: [manual, autotracker, import]
          default: manual
          description: Origem da legenda (ausente vira `manual`).
        model:
          type: [string, "null"]
          description: Modelo gerador (convenção — preenchido em origem autotracker; teto de 255 chars ⇒ 400).

    PutClassesItem:
      type: object
      required: [name]
      additionalProperties: false
      description: "Item da substituição total: com `id` renomeia preservando o id; sem `id` cria nova."
      properties:
        id:
          type: string
          format: uuid
          description: PK em `classes` (precisa pertencer ao dataset; ausente ⇒ criar).
        name:
          type: string
          pattern: '^[A-Za-z0-9_][A-Za-z0-9_]{0,63}$'
          description: Nome da classe (trim server-side; mesma regra do create).

    PutClassesRequest:
      type: object
      required: [classes]
      additionalProperties: false
      description: "Substituição total das classes (máx 200; nomes e ids únicos, sem dedupe silencioso)."
      properties:
        classes:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/PutClassesItem" }

    PutClassesResponse:
      type: object
      required: [classes]
      description: "Classes após a substituição (ordem do request, `idx` 0..n-1, cores rederivadas)."
      properties:
        classes:
          type: array
          items: { $ref: "#/components/schemas/Class" }

    RestoreImageResponse:
      type: object
      required: [filename]
      additionalProperties: false
      description: "Restore com rename: o filename novo (único entre as ativas)."
      properties:
        filename:
          type: string
          description: Filename novo da linha restaurada (`{stem}_restaurado{ext}`).

    ImageDetail:
      type: object
      required: [id, filename, objectKey, bytes, width, height, mediaType, split, url, createdAt, boxes, caption]
      description: "Image + boxes + caption (ADR-0003 delta; flat, sem aninhamento)."
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        objectKey:
          type: string
          description: Chave legível `datasets/{dataset_id}/images/{image_id}/{nome}` (D5).
        bytes: { type: integer, format: int64, minimum: 0 }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        mediaType:
          type: string
          enum: [jpeg, png, webp]
          description: Canônico do conteúdo via sniff, não do form (D2/D5).
        split:
          type: string
          enum: [train, val]
        url:
          type: string
          description: Presigned no endpoint público (D3) ou fallback `/data` da 3b.5.
        createdAt: { type: string, format: date-time }
        boxes:
          type: array
          items: { $ref: "#/components/schemas/Box" }
          description: Anotações da imagem (ordem determinística por id).
        caption:
          description: Legenda da imagem (null quando ausente).
          anyOf:
            - $ref: "#/components/schemas/Caption"
            - type: "null"

    SearchIndexResponse:
      type: object
      required: [status]
      additionalProperties: false
      description: "Resposta 202 do rebuild (Fatia 3f.4, ADR-0004 D5; aditivo na 0.5.0)."
      properties:
        status:
          type: string
          enum: [indexing, not_indexed]
          description: "`indexing` = rebuild disparado (fire-and-forget); `not_indexed` = dataset sem imagens (não trabalha)."

    SearchStatus:
      type: object
      required: [status, imagesCount, indexedCount, model, dim]
      additionalProperties: false
      description: "Estado derivado da indexação (Fatia 3f.4, ADR-0004 D5; aditivo na 0.5.0)."
      properties:
        status:
          type: string
          enum: [not_indexed, indexing, ready, stale]
          description: "        `not_indexed` = dataset sem imagens (nada a indexar); `indexing` =
        imagens ainda sem embedding completo; `ready` = toda imagem ativa tem
        embedding do modelo ativo. `stale` reservado, nunca emitido na v1."
        imagesCount:
          type: integer
          minimum: 0
          description: Imagens ativas do dataset (`deleted_at IS NULL` — lixeira invisível).
        indexedCount:
          type: integer
          minimum: 0
          description: Embeddings do modelo ativo (`image_embeddings` por dataset + model).
        model:
          type: string
          description: "Modelo de embedding ativo (ex.: `ViT-B-32`)."
        dim:
          type: integer
          description: Dimensão fixa dos vetores (512, ViT-B-32).

    SearchResponse:
      type: object
      required: [items]
      additionalProperties: false
      description: "Resultados da busca semântica (Fatia 3f.5, ADR-0004 D5; aditivo na 0.5.0)."
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SearchItem" }
          description: Ordenados por score desc (a ordem do HNSW é por distância asc).

    SearchItem:
      type: object
      required: [image, score]
      additionalProperties: false
      description: "Imagem (mesmo wire `Image` do list) + similaridade (Fatia 3f.5; aditivo na 0.5.0)."
      properties:
        image: { $ref: "#/components/schemas/Image" }
        score:
          type: number
          description: "Similaridade coseno RAW (faixa -1..1; CLIP normaliza L2 no embedder)."

    ByImageRequest:
      type: object
      required: [imageId]
      additionalProperties: false
      description: "Busca por imagem (Fatia 3f.5, ADR-0004 D5; aditivo na 0.5.0)."
      properties:
        imageId:
          type: string
          format: uuid
          description: "Imagem do dataset (não-UUID ou fora do dataset ⇒ 404 `not_found`, D8 replicado)."
        k:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
          description: Tamanho do top-k (default 20; fora de 1..100 ⇒ 400).
        threshold:
          type: number
          minimum: -1
          maximum: 1
          description: "Pós-filtro opcional (`score >= threshold`; fora de -1..1 ⇒ 400)."

    PackageRequest:
      type: object
      required: [engine]
      additionalProperties: false
      description: "Request do package (Fatia 4, ADR-0007 D7)."
      properties:
        engine:
          type: string
          enum: [yolo]
          description: "Engine alvo. Na v1 somente `yolo` é suportado; outro valor ⇒ 400 `engine_unsupported`."

    PackageResponse:
      type: object
      required: [versionId, key, bytes, md5Zip, files]
      additionalProperties: false
      description: "Package criado — versão congelada do dataset (Fatia 4, ADR-0007 D7)."
      properties:
        versionId:
          type: string
          format: uuid
          description: "PK da row em `dataset_versions` (snapshot congelado)."
        key:
          type: string
          description: "Key do zip no storage: `packages/<versionId>/dataset.zip`."
        bytes:
          type: integer
          format: int64
          minimum: 0
          description: "Tamanho do zip em bytes."
        md5Zip:
          type: string
          pattern: '^[0-9a-f]{32}$'
          description: "MD5 do zip (hex)."
        files:
          type: array
          items: { $ref: "#/components/schemas/TransportFile" }
          description: "Entradas do zip."

    TransportFile:
      type: object
      required: [filename, md5, bytes]
      additionalProperties: false
      description: "Entrada de arquivo no manifest de transporte."
      properties:
        filename:
          type: string
          description: "Nome do arquivo no zip."
        md5:
          type: string
          pattern: '^[0-9a-f]{32}$'
          description: "MD5 do conteúdo (hex)."
        bytes:
          type: integer
          format: int64
          minimum: 0
          description: "Tamanho em bytes."

    Job:
      type: object
      required: [id, kind, engine, model, mode, status, createdAt]
      additionalProperties: false
      description: "Job de treinamento (ADR-0007 D7)."
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          description: "Tipo do job (ex.: yolo_train)."
        engine:
          type: string
          description: "Engine alvo (ex.: yolo)."
        model:
          type: string
          description: "Modelo (ex.: yolo11m)."
        mode:
          type: string
          description: "Modo de execução."
        datasetId:
          type: [string, "null"]
          format: uuid
          description: "Dataset associado (null quando dataset foi deletado)."
        status:
          type: string
          enum: [queued, dispatched, preparing, running, cancelling, done, failed, cancelled]
          description: "Status do ciclo do job."
        queueReason:
          type: [string, "null"]
          description: "Motivo da espera na fila."
        queuePosition:
          type: [integer, "null"]
          description: "Posição na fila (null quando não está queued)."
        progress:
          type: [number, "null"]
          minimum: 0
          maximum: 1
          description: "Progresso 0..1 (null quando não disponível)."
        epoch:
          type: [integer, "null"]
          minimum: 0
          description: "Epoch corrente do treino."
        step:
          type: [integer, "null"]
          minimum: 0
          description: "Step corrente do treino."
        metrics:
          description: "Métricas re-mapeadas camelCase (null quando não disponível)."
          anyOf:
            - type: array
              items: { $ref: "#/components/schemas/MetricsItem" }
            - type: "null"
        vramMinGb:
          type: [integer, "null"]
          minimum: 0
          description: "VRAM mínima exigida em GB."
        orchestratorId:
          type: [string, "null"]
          format: uuid
          description: "Orquestrador que executa o job."
        createdAt: { type: string, format: date-time }
        finishedAt:
          type: [string, "null"]
          format: date-time
          description: "Momento da finalização (null enquanto ativo)."

    JobList:
      type: object
      required: [items, total]
      additionalProperties: false
      description: "Lista de jobs (ADR-0007 D7)."
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Job" }
        total:
          type: integer
          minimum: 0
          description: "Total de jobs (com filtros aplicados)."

    MetricsItem:
      type: object
      required: [epoch, boxLoss, clsLoss, dflLoss, map50, map5095]
      additionalProperties: false
      description: "Métricas de treinamento por epoch (camelCase wire; mAP50-95 → map5095)."
      properties:
        epoch:
          type: integer
          minimum: 0
        boxLoss:
          type: number
          description: "Box loss (mean average precision component)."
        clsLoss:
          type: number
          description: "Classification loss."
        dflLoss:
          type: number
          description: "DFL (distribution focal) loss."
        map50:
          type: number
          description: "mAP at IoU=0.50."
        map5095:
          type: number
          description: "mAP at IoU=0.50:0.95 (chave `mAP50-95` no JSONB snake_case do manager)."

    JobMetrics:
      type: object
      required: [items]
      additionalProperties: false
      description: "Métricas de treinamento por epoch (ADR-0007 D7)."
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MetricsItem" }
          description: "Série temporal por epoch (vazio se job existe mas sem métricas)."

    QueueItem:
      type: object
      required: [jobId, position]
      additionalProperties: false
      description: "Item da fila de jobs (ADR-0007 D7)."
      properties:
        jobId:
          type: string
          format: uuid
          description: "PK do job na fila."
        position:
          type: integer
          minimum: 1
          description: "Posição na fila (1-based)."
        queueReason:
          type: [string, "null"]
          description: "Motivo da espera na fila."

    JobQueue:
      type: object
      required: [items]
      additionalProperties: false
      description: "Fila ordenada de jobs (ADR-0007 D7)."
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/QueueItem" }

    JobArtifact:
      type: object
      required: [id, kind, path, md5, bytes]
      additionalProperties: false
      description: "Artefato de um job (ADR-0007 D8)."
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          description: "Tipo do artefato (ex.: model, metrics)."
        path:
          type: string
          description: "Caminho relativo ao prefixo `artifacts/<job_id>/`."
        md5:
          type: string
          pattern: '^[0-9a-f]{32}$'
          description: "MD5 do conteúdo (hex, calculado pelo orquestrador)."
        bytes:
          type: integer
          format: int64
          minimum: 0
          description: "Tamanho em bytes."

    ArtifactList:
      type: object
      required: [items]
      additionalProperties: false
      description: "Lista de artefatos de um job (ADR-0007 D8)."
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/JobArtifact" }

    Telemetry:
      type: object
      required: [measured, gpus, jobsActive]
      additionalProperties: false
      description: "Telemetria do sistema (ADR-0007 D9)."
      properties:
        measured:
          type: boolean
          description: "true se VRAM é medível (false no mock sem GPU)."
        vramUsed:
          type: [integer, "null"]
          description: "VRAM usada em MB (null quando não medível)."
        vramTotal:
          type: [integer, "null"]
          description: "VRAM total em MB (null quando não medível)."
        cpu:
          type: [number, "null"]
          description: "Uso de CPU (0..1 ou percentual, dependendo do orquestrador)."
        ram:
          type: [integer, "null"]
          description: "RAM usada em MB."
        gpus:
          type: array
          items: { type: string }
          description: "Lista de GPUs detectadas (vazia no mock)."
        jobsActive:
          type: integer
          minimum: 0
          description: "Número de jobs ativos (preparing/running)."
