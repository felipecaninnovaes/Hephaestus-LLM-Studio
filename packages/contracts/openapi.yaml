openapi: 3.1.0
info:
  title: Hephaestus Studio API
  version: 0.3.0
  summary: Contrato público do backend principal (api-principal :8080)
  description: |
    Fatia 2 (auth single-user) + Fatia 3a (datasets núcleo) + `/health`.
    Fonte funcional: `docs/backend.md` §2 (comportamento) e §9 (paths exatos).
    Decisões (hash, segredo JWT, TTL, bootstrap, erros, rate-limit): `docs/adr/0001-auth-single-user.md`.
    Demais grupos do §9 (settings, jobs, ...) entram NESTE mesmo arquivo nas
    fatias respectivas — o contrato não faz fork.
    Convenção global: todo endpoint pode responder `500` (`code: internal`), `405`
    (método não declarado na path) e `413` (`code: invalid_request`, corpo acima
    do limite — sempre no envelope) mesmo onde não listado.
    Convenção global de casing (ADR-0002 D1): TODAS as chaves de body/query/response
    em `/api/*` são camelCase (os nomes de coluna SQL que aparecem no backend.md §10
    chegam ao wire camelCase: `imagesCount`, `sizeBytes`, `lastModified`). Valores de
    enum, `Error.code` e nomes de coluna SQL permanecem snake_case. Artefatos de
    transporte (manifest.json, config.yaml, SQLite do orquestrador) são snake_case —
    a fronteira HTTP não contamina o transporte.
    A OpenAPI declara paths com `{param}`; o axum 0.7 usa `:param` e o teste de
    contrato normaliza um lado (outros estilos de path na spec = vermelho).
  license: { name: Proprietary }

servers:
  - url: http://localhost:8080
    description: >
      compose local (infra/compose.yaml porta 8080). Dev não tem TLS: o cookie de
      sessão é emitido SEM `Secure`; sob TLS (deploy remoto) `SECURE_COOKIE=true`
      adiciona `Secure` ao Set-Cookie.

tags:
  - name: auth
    description: Autenticação single-user (exatamente 1 linha na tabela `users`; sem RBAC).
  - name: health
    description: Liveness do serviço — pública por decisão do §2 (isenta do middleware de auth).
  - name: datasets
    description: Metadados de dataset no Postgres; blobs em disco e imagens a partir da Fatia 3b.

# Proteção padrão: rotas exigem o cookie de sessão.
# Endpoints públicos declaram `security: []` explicitamente (inclusive /api/auth/me,
# que valida o cookie internamente — ver a descrição do operationId getMe).
security:
  - sessionCookie: []

paths:
  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Liveness do api-principal
      description: |
        Sempre 200 enquanto o processo vive — inclusive em "modo setup" (tabela `users`
        vazia e `STUDIO_PASSWORD` ausente), sinalizado por `auth: "setup_required"`.
        O gate de auth é fail-closed nesse estado: toda rota protegida responde 401 e
        `POST /api/auth/login` responde 503. Nunca exige credencial (uso: healthcheck do compose).
      security: []
      responses:
        "200":
          description: Serviço vivo (não requer autenticação).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }

  /api/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Autentica a instância single-user e emite o cookie de sessão
      description: |
        Compara `password` em texto puro (só loopback local) contra o hash Argon2id
        único em `users.password_hash`. Sucesso emite a sessão como cookie e repete
        o corpo de `MeResponse` (o front não precisa chamar `/me` logo após o login).
        401 é genérico por design: não distingue "usuário inexistente" de "senha errada".
        Rate-limit: NENHUM na v1 (ADR-0001 D7 — risco aceito, loopback); o 429 abaixo
        está reservado (`x-reserved: true`, ignorado pelo teste de contrato) para uma
        futura versão exposta em LAN, sem quebra de contrato.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Credencial válida — sessão iniciada (TTL 7 dias, sem refresh na v1).
          headers:
            Set-Cookie:
              required: true
              description: >
                heph_session=<jwt>; HttpOnly; SameSite=Lax; Path=/; Max-Age=604800
                (`; Secure` adicionado apenas sob TLS via SECURE_COOKIE=true).
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        "400":
          description: "Body ausente/malformado ou sem `password` (`code: invalid_request`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: "Credencial inválida (`code: invalid_credentials`). Genérico por design: não distingue usuário inexistente de senha errada."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: "Reservado — NÃO implementado na v1 (sem rate-limit em loopback; ADR-0001 D7)."
          x-reserved: true
        "503":
          description: "Modo setup — `users` vazio e `STUDIO_PASSWORD` ausente (`code: setup_required`). Indisponibilidade, não erro de credencial."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Identidade da sessão corrente
      description: |
        Nota de implementação (§2): o middleware global isenta TODO `/api/auth/*`,
        então este endpoint valida o cookie internamente — sem cookie válido/expirado
        responde 401 (`code: unauthorized`). Não é uma exceção de segurança: a
        auto-validação é o gate desta rota.
        `loggedAt` = claim `iat` do JWT (momento do login), não `users.created_at`.
      security: []
      responses:
        "200":
          description: Sessão válida.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        "401":
          description: "Cookie ausente, expirado ou inválido (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Encerra a sessão (limpeza do cookie)
      description: |
        Idempotente e insensível a credencial: sempre 204, havendo sessão válida ou não,
        emitindo o cookie expirado (Max-Age=0). O JWT stateless permanece assinado e
        válido até `exp` — sem blacklist na v1 (risco aceito, ADR-0001 D5; sessão local).
      security: []
      responses:
        "204":
          description: Sessão encerrada; cookie ordenado a limpar.
          headers:
            Set-Cookie:
              description: "heph_session=; HttpOnly; SameSite=Lax; Path=/; Max-Age=0"
              schema: { type: string }

  /api/datasets:
    get:
      operationId: listDatasets
      tags: [datasets]
      summary: Lista todos os datasets (metadados)
      description: |
        Sem paginação na Fatia 3a: devolve a coleção inteira ordenada por
        `updated_at` DESC (mais recente primeiro), porque a UI filtra/busca e
        calcula os contadores das pills no cliente (frontend.md §5.1).
        `limit`/`offset` entram como query params aditivos quando houver
        paginação real — sem quebra de contrato.
        `imagesCount`/`labeledCount`/`sizeBytes` são mantidos por trigger a
        partir de images/boxes/captions (backend.md §10) só a partir da 3b; na 3a
        não existe caminho de escrita, logo 0 para qualquer dataset — invariante
        observável (ADR-0002 T2), não estimativa.
      responses:
        "200":
          description: Lista de datasets (array cru, sem envelope).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Dataset" }
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      operationId: createDataset
      tags: [datasets]
      summary: Cria dataset vazio (metadados + classes)
      description: |
        Cria o registro com `status: "needs_labeling"` (frontend.md §4.3) e
        contadores zerados. O servidor é dono de `slug` (normalizado de
        `title`), `category`, `task`, `format`, `status` e da ordem/cor das
        classes — nenhum desses campos é aceito no body (input-trust; chaves
        desconhecidas = 400).
        A dropzone do modal NÃO pertence a esta rota: enviar imagens é
        `POST /api/datasets/:id/upload` (Fatia 3b).
        Idempotência: não há — dois POSTs iguais criam dois datasets, exceto
        quando o `slug` resultante colide (409).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDatasetRequest" }
      responses:
        "201":
          description: Dataset criado (corpo = `Dataset` completo, já derivado).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dataset" }
        "400":
          description: >
            Body ausente/malformado, campo desconhecido, `title` vazio ou que não
            produz slug, `type` fora do enum, classe fora do charset ou > 200
            classes (`code: invalid_request`). `message` é estático por code: a UI
            valida os campos no cliente e não depende de detalhe do servidor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >
            Slug já existe (`code: slug_conflict`) — `INSERT ... ON CONFLICT (slug)
            DO NOTHING` não retornou linha. Não há auto-sufixo: o nome é exibido na
            UI e será nome de diretório em disco (3b), então colisão é mostrada ao
            usuário em vez de disfarçada (ADR-0002 D5).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/datasets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: >
          PK do dataset. Valor que não parseia como UUID responde 404 `not_found`
          (não 400): a distinção não vaza informação útil e mantém o inventário de
          status fechado (ADR-0002 D8).
    get:
      operationId: getDataset
      tags: [datasets]
      summary: Detalhe de um dataset (metadados)
      description: |
        Mesmo shape de item da lista — a galeria (frontend.md §5.2) precisa de
        `type · N imagens · size · source`, e nenhuma imagem chega aqui
        (imagens são `GET /api/datasets/:id/images`, Fatia 3b).
      responses:
        "200":
          description: Dataset encontrado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dataset" }
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "Dataset inexistente ou id não-UUID (`code: not_found`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: deleteDataset
      tags: [datasets]
      summary: Remove dataset e filhos
      description: |
        `DELETE FROM datasets WHERE id=$1 RETURNING id`; a linha some e as FKs
        `ON DELETE CASCADE` (backend.md §10) removem `classes` (3a) e, a partir da
        3b, images/boxes/captions/videos. Na 3a ainda não existe artefato em disco
        para o dataset (nenhum upload), portanto o handler não toca o filesystem —
        o cleanup de disco é obrigação da 3b (ADR-0002 T3). Sem confirmação no
        contrato: o modal de exclusão é UI.
      responses:
        "204":
          description: Removido (sem corpo).
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "Dataset inexistente ou id não-UUID (`code: not_found`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/datasets/{id}/upload:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: >
          PK do dataset. Valor que não parseia como UUID responde 404 `not_found`
          (não 400): a distinção não vaza informação útil e mantém o inventário de
          status fechado (ADR-0002 D8).
    post:
      operationId: uploadImages
      tags: [datasets]
      summary: Envia lote de imagens (multipart, spool+sniff+hash)
      description: |
        Lote `multipart/form-data` com fields `files` (Fatia 3b.3, ADR-0003 D2/D7).
        Cada arquivo faz spool em tempfile (disco só efêmero, D1), sniff do
        `media_type` pelo conteúdo (nunca pelo nome, D2/D5), hash md5+sha256 em
        streaming e PUT objeto→linha→compensação (D7). Resposta 200 por item:
        `stored` | `duplicate` | `rejected` | `failed`. Lote sem nenhum arquivo
        ou com todos os itens `rejected/unsupported_media` responde 400; backend
        de objetos fora responde 503 (`code: storage_unavailable`, D10).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items: { type: string, format: binary }
      responses:
        "200":
          description: Lote processado (status por item em `UploadResult`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadResult" }
        "400":
          description: "Lote sem nenhum arquivo ou lote inteiro indecodável (`code: invalid_request`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "Dataset inexistente ou id não-UUID (`code: not_found`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "Backend de objetos indisponível (`code: storage_unavailable`, ADR-0003 D10)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/datasets/{id}/images/{imageId}/boxes:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: >
          PK do dataset. Valor que não parseia como UUID responde 404 `not_found`
          (não 400, padrão D8 replicado).
      - name: imageId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: >
          PK da imagem. Valor que não parseia como UUID responde 404 `not_found`
          (não 400, padrão D8 replicado). Escopada ao dataset: imagem de outro
          dataset responde 404.
    put:
      operationId: putBoxes
      tags: [datasets]
      summary: Substitui as boxes da imagem (anotação de detecção)
      description: |
        Substituição total das `boxes` da imagem (Fatia 3b.6, ADR-0003 D6):
        apaga todas e insere as enviadas (ids novos). Máx 1000 boxes por request
        (anti-DoS). `origin` ausente vira `manual`. Classes precisam pertencer ao
        dataset (classe de outro dataset ⇒ 400 sem vazar existência). Sem chamada
        de storage (sem 503). Resposta canônica com os mesmos uuids inseridos.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PutBoxesRequest" }
      responses:
        "200":
          description: Boxes substituídas (`PutBoxesResponse`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PutBoxesResponse" }
        "400":
          description: "Body inválido (parse, `deny_unknown_fields`, validação 0..1/`conf`/`origin`, lista > 1000, classe fora do dataset; `code: invalid_request`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "Dataset/imagem inexistente, id/imageId não-UUID ou imagem de outro dataset (`code: not_found`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/datasets/{id}/images/{imageId}/caption:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: >
          PK do dataset. Valor que não parseia como UUID responde 404 `not_found`
          (não 400, padrão D8 replicado).
      - name: imageId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: >
          PK da imagem. Valor que não parseia como UUID responde 404 `not_found`
          (não 400, padrão D8 replicado). Escopada ao dataset: imagem de outro
          dataset responde 404.
    put:
      operationId: putCaption
      tags: [datasets]
      summary: Insere ou atualiza a legenda da imagem (upsert)
      description: |
        Upsert do `caption` da imagem (Fatia 3b.6, ADR-0003 D6, PK = image_id):
        `text` vazio ⇒ 400 (a linha não nasce; imagem segue `unlabeled`).
        `origin` ausente vira `manual`. Sem chamada de storage (sem 503).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PutCaptionRequest" }
      responses:
        "200":
          description: Legenda gravada (`Caption`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Caption" }
        "400":
          description: "Body inválido (parse, `deny_unknown_fields`, `text` fora de 1..8000 chars, `origin` fora do domínio; `code: invalid_request`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "Dataset/imagem inexistente, id/imageId não-UUID ou imagem de outro dataset (`code: not_found`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/datasets/{id}/images:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: >
          PK do dataset. Valor que não parseia como UUID responde 404 `not_found`
          (não 400): a distinção não vaza informação útil e mantém o inventário de
          status fechado (ADR-0002 D8).
    get:
      operationId: listImages
      tags: [datasets]
      summary: Página de imagens do dataset
      description: |
        Página ordenada por `createdAt` DESC com filtros `split`/`labeled`
        (Fatia 3b.3, ADR-0003). `labeled` usa a taxonomia R9 do trigger da
        migration 0003 (`yolo_txt` ⇒ boxes, demais ⇒ captions). `url` por imagem:
        presigned assinado no endpoint público quando `S3_PUBLIC_ENDPOINT_URL`
        configurado, senão fallback `GET …/images/:imageId/data` (D3; a rota
        `/data` chega na 3b.5).
      parameters:
        - name: split
          in: query
          required: false
          schema: { type: string, enum: [train, val] }
          description: Filtra pelo split (`train` default na escrita).
        - name: labeled
          in: query
          required: false
          schema: { type: string, enum: ["true", "false"] }
          description: Filtra por rotulada/não-rotulada (case-insensitivo).
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
          description: Tamanho da página (default 50, máx 200).
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
          description: Deslocamento da página (default 0).
      responses:
        "200":
          description: Página de imagens (`ImagePage`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImagePage" }
        "400":
          description: "Query inválida (`split`/`labeled`/`limit`/`offset` fora do domínio; `code: invalid_request`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "Dataset inexistente ou id não-UUID (`code: not_found`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/datasets/{id}/images/{imageId}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: >
          PK do dataset. Valor que não parseia como UUID responde 404 `not_found`
          (não 400): a distinção não vaza informação útil e mantém o inventário de
          status fechado (ADR-0002 D8).
      - name: imageId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: >
          PK da imagem. Valor que não parseia como UUID responde 404 `not_found`
          (não 400, padrão D8 replicado). Escopada ao dataset: imagem de outro
          dataset responde 404.
    get:
      operationId: getImage
      tags: [datasets]
      summary: Detalhe de uma imagem (Image + boxes + caption)
      description: |
        Image completa com `boxes` (ordem determinística por id) e `caption`
        (nullable, no máximo uma por imagem). `url` segue a regra híbrida D3
        (presigned com endpoint público, senão fallback `/data`). Floats de
        boxes ecoam o banco (Fatia 3b.5, ADR-0003).
      responses:
        "200":
          description: Imagem encontrada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageDetail" }
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "Dataset/imagem inexistente, id/imageId não-UUID ou imagem de outro dataset (`code: not_found`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/datasets/{id}/images/{imageId}/data:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: >
          PK do dataset. Valor que não parseia como UUID responde 404 `not_found`
          (não 400, padrão D8 replicado).
      - name: imageId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: >
          PK da imagem. Valor que não parseia como UUID responde 404 `not_found`
          (não 400, padrão D8 replicado).
    get:
      operationId: getImageData
      tags: [datasets]
      summary: Bytes do objeto (proxy, fallback incondicional da D3)
      description: |
        Proxy do objeto no storage (Fatia 3b.5, ADR-0003 D3): funciona SEM flag
        pública. `content-type` vem do `media_type` da linha; `cache-control:
        private, max-age=31536000, immutable` (chave imutável por image_id, D5).
        Linha sem objeto = 404 honesto; backend fora = 503.
      responses:
        "200":
          description: Bytes da imagem.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "Dataset/imagem inexistente, id/imageId não-UUID ou objeto ausente no storage (`code: not_found`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "Backend de objetos indisponível (`code: storage_unavailable`, ADR-0003 D10)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: heph_session
      description: >
        JWT HS256 (jsonwebtoken 9; claims iss/sub/iat/exp/jti, TTL 7d, ADR-0001 D2).
        Somente o api-principal emite e valida; front nunca lê o valor (HttpOnly).
        Todas as rotas fora do domínio auth exigem este cookie via middleware de auth
        (backend.md §2), com `/health` e `/api/auth/*` isentos do gate.

  schemas:
    LoginRequest:
      type: object
      required: [password]
      additionalProperties: false
      properties:
        password:
          type: string
          format: password
          description: Senha em texto puro transportada apenas em loopback local; nunca logada pelo servidor.

    MeResponse:
      type: object
      required: [userId, loggedAt]
      properties:
        userId:
          type: string
          format: uuid
          description: PK da linha única de `users` (ADR-0001 D2; gen_random_uuid(), nativo PG13+).
        loggedAt:
          type: string
          format: date-time
          description: Momento de emissão da sessão (claim `iat` do JWT), RFC 3339.

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [invalid_request, invalid_credentials, unauthorized, setup_required, not_found, slug_conflict, storage_unavailable, internal]
          description: "Código estável para máquina — a UI decide a mensagem por `code`, nunca por `message`; o cliente DEVE ter ramo default: o enum cresce por fatia (aditivo na 0.2.0: `not_found`, `slug_conflict`; na 0.3.0: `storage_unavailable`, ADR-0003 D10)."
        message:
          type: string
          description: Humano-curto, ESTÁTICO por code; nunca contém hash, token, segredo ou existência de usuário.

    HealthResponse:
      type: object
      required: [status, service, auth]
      properties:
        status:
          type: string
          enum: [ok]
          description: Liveness do processo.
        service:
          type: string
          description: 'Nome do serviço (ex.: api-principal).'
        auth:
          type: string
          enum: [ready, setup_required]
          description: "Estado do bootstrap single-user (ADR-0001 D3): ready = usuário existe; setup_required = aguardando STUDIO_PASSWORD no primeiro boot."

    CreateDatasetRequest:
      type: object
      required: [title, type]
      additionalProperties: false
      description: >
        Espelha o modal `create-dataset-modal` (frontend.md §4.3): nome, tipo de
        modelo/tarefa e classes CSV. O front faz o split do CSV; o wire é array de
        nomes. A dropzone do modal NÃO pertence a esta rota (upload é a 3b).
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 96
          description: >
            Nome humano. O servidor deriva `slug` (minúsculas, sem acentos via
            mapa Latin-1 explícito, runs de não-`[a-z0-9]` viram `-`, sem `-` nas
            pontas, 96 máx); resultado vazio ⇒ 400.
        type:
          type: string
          enum: [yolo_bbox, yolo_seg, difusao_lora, clip_image_text]
          description: >
            As 4 options do modal (frontend.md §4.3). Código de máquina estável;
            o rótulo pt-BR é exclusividade da UI. `category`, `task` e `format`
            são derivados daqui pelo servidor — nunca enviados pelo cliente.
        classes:
          type: array
          maxItems: 200
          default: []
          items: { type: string, pattern: '^[A-Za-z0-9_][A-Za-z0-9_]{0,63}$' }
          description: >
            Nomes de classe na ordem escolhida → `classes.idx` 0-based (convenção
            YOLO). O servidor faz trim e deduplica preservando a primeira
            ocorrência; `color` vem da paleta do design system por `idx % 6`.
            Restrição idêntica ao CHECK do banco: os nomes precisam sobreviver a
            `data.yaml` e a `labels/*.txt`.

    Dataset:
      type: object
      required:
        - id
        - slug
        - title
        - category
        - type
        - task
        - format
        - status
        - sizeBytes
        - imagesCount
        - labeledCount
        - classes
        - autoTracked
        - createdAt
        - lastModified
      properties:
        id: { type: string, format: uuid }
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          maxLength: 96
          description: Identificador kebab-case gerado pelo servidor; UNIQUE no banco.
        title:
          type: string
          description: Nome humano como enviado no create (frontend.md §8 usa `title`; o card exibe `slug`).
        category:
          type: string
          enum: [difusao, openclip, yolo]
          description: Derivada de `type` (backend.md §10).
        type:
          type: string
          enum: [yolo_bbox, yolo_seg, difusao_lora, clip_image_text]
        task:
          type: string
          enum: [detect_track, segment, caption, embedding]
          description: Derivada de `type` (tabela server-side em `datasets::models::derive`).
        format:
          type: string
          enum: [yolo_txt, captions, pairs]
          description: Formato canônico em disco por engine (backend.md §3); derivado de `category`.
        status:
          type: string
          enum: [ready, in_progress, needs_labeling]
          description: "`needs_labeling` no create (frontend.md §4.3); transições por trigger de contadores nas fatias 3b/3c."
        source:
          type: [string, "null"]
          description: >
            Caminho canônico em disco sob `DATASETS_DIR`, atribuído pelo servidor
            no primeiro upload (3b). Sempre `null` na 3a; a UI mostra "—". Nunca é
            input do cliente (path-traversal).
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
          description: Bytes agregados de `images`; 0 na 3a. A UI formata ("1.4 GB") em `lib/format.ts`.
        imagesCount: { type: integer, minimum: 0 }
        labeledCount: { type: integer, minimum: 0 }
        classes:
          type: array
          items: { type: string }
          description: Nomes ordenados por `classes.idx` (os chips do card, §5.1).
        autoTracked:
          type: boolean
          default: false
          description: >
            Constante `false` na 3a. Fonte real (3d): existe `boxes.origin =
            'autotracker'` no dataset. Mantida no shape de frontend.md §8 para a
            UI não quebrar quando passar a ser derivada (ADR-0002 T7).
        createdAt: { type: string, format: date-time }
        lastModified:
          type: string
          format: date-time
          description: "`datasets.updated_at` (RFC 3339), não string relativa; a UI formata 'há 12 minutos'."

    UploadItem:
      type: object
      required: [filename, status]
      description: "Status por arquivo do lote (ADR-0003 D2)."
      properties:
        imageId:
          type: [string, "null"]
          format: uuid
          description: PK da linha em `images`; null em `rejected`.
        filename:
          type: string
          description: Nome canônico (stem sanitizado + extensão do sniff).
        status:
          type: string
          enum: [stored, duplicate, rejected, failed]
          description: Resultado por item (200 mesmo com `rejected`/`failed` individuais).
        reason:
          type: [string, "null"]
          enum: [duplicate_filename, unsupported_media, too_large, storage_error, null]
          description: Motivo do não-`stored` (null quando `stored`).
        bytes:
          type: [integer, "null"]
          description: Tamanho real do spool (só em `stored`).
        width:
          type: [integer, "null"]
          description: Largura decodificada (só em `stored`).
        height:
          type: [integer, "null"]
          description: Altura decodificada (só em `stored`).

    UploadResult:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/UploadItem" }

    Image:
      type: object
      required: [id, filename, objectKey, bytes, width, height, mediaType, split, url, createdAt]
      description: "Imagem indexada (ADR-0003 D2/D5; md5/sha256 ficam no banco, fora do wire)."
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        objectKey:
          type: string
          description: Chave legível `datasets/{dataset_id}/images/{image_id}/{nome}` (D5).
        bytes: { type: integer, format: int64, minimum: 0 }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        mediaType:
          type: string
          enum: [jpeg, png, webp]
          description: Canônico do conteúdo via sniff, não do form (D2/D5).
        split:
          type: string
          enum: [train, val]
        url:
          type: string
          description: Presigned no endpoint público (D3) ou fallback `/data` da 3b.5.
        createdAt: { type: string, format: date-time }

    ImagePage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Image" }
        total:
          type: integer
          minimum: 0
          description: Total com os filtros, sem o LIMIT.
        limit: { type: integer }
        offset: { type: integer }

    Box:
      type: object
      required: [id, classId, x, y, w, h, origin]
      description: "Anotação de detecção (ADR-0003 D6; x/y/w/h centro+dimensões normalizados 0..1)."
      properties:
        id: { type: string, format: uuid }
        classId: { type: string, format: uuid }
        x: { type: number, minimum: 0, maximum: 1 }
        y: { type: number, minimum: 0, maximum: 1 }
        w: { type: number, minimum: 0, maximum: 1 }
        h: { type: number, minimum: 0, maximum: 1 }
        conf:
          type: [number, "null"]
          description: Confiança (null em anotação manual/importada).
        origin:
          type: string
          enum: [manual, autotracker, import]
        trackId:
          type: [integer, "null"]
          description: Id de track (só em origem autotracker com tracking).

    Caption:
      type: object
      required: [text, origin, updatedAt]
      description: "Legenda da imagem (no máximo uma por imagem, PK = image_id)."
      properties:
        text: { type: string, minLength: 1, maxLength: 8000 }
        origin:
          type: string
          enum: [manual, autotracker, import]
        model:
          type: [string, "null"]
          description: Modelo gerador (só em origem autotracker).
        updatedAt: { type: string, format: date-time }

    PutBoxesRequest:
      type: object
      required: [boxes]
      additionalProperties: false
      description: "Substituição total das boxes (máx 1000, anti-DoS)."
      properties:
        boxes:
          type: array
          maxItems: 1000
          items:
            type: object
            required: [classId, x, y, w, h]
            additionalProperties: false
            properties:
              classId:
                type: string
                format: uuid
                description: PK em `classes` (precisa pertencer ao dataset).
              x: { type: number, minimum: 0, maximum: 1 }
              y: { type: number, minimum: 0, maximum: 1 }
              w: { type: number, minimum: 0, maximum: 1 }
              h: { type: number, minimum: 0, maximum: 1 }
              conf:
                type: [number, "null"]
                minimum: 0
                maximum: 1
                description: Confiança (null em anotação manual/importada).
              origin:
                type: string
                enum: [manual, autotracker, import]
                default: manual
                description: Origem da anotação (ausente vira `manual`).
              trackId:
                type: [integer, "null"]
                description: Id de track (só em origem autotracker com tracking).

    PutBoxesResponse:
      type: object
      required: [boxes]
      description: "Boxes após a substituição (ids novos, eco do banco)."
      properties:
        boxes:
          type: array
          items: { $ref: "#/components/schemas/Box" }

    PutCaptionRequest:
      type: object
      required: [text]
      additionalProperties: false
      description: "Upsert da legenda (PK = image_id)."
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 8000
          description: Texto da legenda (vazio ⇒ 400, a linha não nasce).
        origin:
          type: string
          enum: [manual, autotracker, import]
          default: manual
          description: Origem da legenda (ausente vira `manual`).
        model:
          type: [string, "null"]
          description: Modelo gerador (só em origem autotracker).

    ImageDetail:
      type: object
      required: [id, filename, objectKey, bytes, width, height, mediaType, split, url, createdAt, boxes, caption]
      description: "Image + boxes + caption (ADR-0003 delta; flat, sem aninhamento)."
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        objectKey:
          type: string
          description: Chave legível `datasets/{dataset_id}/images/{image_id}/{nome}` (D5).
        bytes: { type: integer, format: int64, minimum: 0 }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        mediaType:
          type: string
          enum: [jpeg, png, webp]
          description: Canônico do conteúdo via sniff, não do form (D2/D5).
        split:
          type: string
          enum: [train, val]
        url:
          type: string
          description: Presigned no endpoint público (D3) ou fallback `/data` da 3b.5.
        createdAt: { type: string, format: date-time }
        boxes:
          type: array
          items: { $ref: "#/components/schemas/Box" }
          description: Anotações da imagem (ordem determinística por id).
        caption:
          description: Legenda da imagem (null quando ausente).
          anyOf:
            - $ref: "#/components/schemas/Caption"
            - type: "null"
