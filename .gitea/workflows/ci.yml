# CI — Gitea Actions (act_runner v3.3.2, label ubuntu-latest)
#
# Desenho v1 (registro histórico em docs/archive/coordenacao-historico-2026-09.md, sessão 4):
# - ZERO ações externas — o actions/checkout@v4 saiu porque act_runner v3.3.2
#   NÃO injeta node no container (prova: primeiro run, exit 127
#   "node: executable file not found" em rust:slim e docker:29-cli, 2026-09-06).
#   Checkout = git clone manual com o token automático do Gitea
#   (basic x-access-token — o mesmo esquema que o actions/checkout usa).
# - Imagens pinadas por digest, mesmas do compose/Dockerfiles.
# - UMA job Rust com `services:` postgres: fmt + check + testes sem banco +
#   testes de banco --ignored, tudo na mesma compilação.
# - Sem cache de cargo/npm no v1 (adicionaria action externa); custo aceito.
# - Testes de storage (storage_s3, --ignored) ficam LOCAIS via
#   scripts/test-storage.sh — exigem SeaweedFS, não cobertos aqui.
#
# Conquistas do run 2 (2026-09-06): checkout manual + token auth ✓ (job
# compose PASSOU — clone, checkout do SHA e config dos dois composes);
# digest pin puxa ✓; healthcheck do service postgres ✓.
# Round 2, dois gaps de ferramental (prova nos logs via API):
#   - rust: 'cargo-fmt is not installed' → rust:slim não inclui rustfmt
#     (fix: rustup component add rustfmt);
#   - web: 'git: command not found' → node:20-slim é debian-slim puro, SEM
#     scm (fix: apt-get install git igual ao job rust).
# Se um dia trocar o clone por actions/checkout de novo, precisará de um
# container com node+git ou de runner com injeção de node.
name: CI

on:
  push:

jobs:
  rust:
    runs-on: ubuntu-latest
    container:
      image: rust:1.97.1-slim@sha256:8e8cf8f7fd54a2d23d5a743b3a03f56e26b6c774276c33fa0595111704ebb15c
    services:
      postgres:
        # Mesma imagem do compose (ADR-0004, spike 3f.0): pgvector pg16-trixie —
        # a migration 0004 faz CREATE EXTENSION vector, que a postgres:16
        # oficial NÃO tem (run 22: 48/48 testes de banco falharam no setup).
        # Regra: migration que muda a imagem de banco atualiza este service
        # no MESMO commit.
        image: pgvector/pgvector:pg16-trixie@sha256:c8483555ce48101872f888c1df8a895ff689d6c7c7a5f7ac266475f9dfe89e0b
        env:
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: test
          POSTGRES_DB: studio
        options: >-
          --health-cmd "pg_isready -U studio -d studio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      HEPH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: git (rust:slim não tem git nem ca-certificates)
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates
      - name: rustfmt (componente não vem no rust:slim — perfil mínimo do rustup)
        run: rustup component add rustfmt
      - name: checkout manual (clone completo — repo pequeno)
        run: |
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$HEPH_TOKEN" | base64 -w0)" clone "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" .
          git checkout "$GITHUB_SHA"
      - name: fmt (padrão rustfmt, workspace inteiro)
        run: cargo fmt --all --check
      - name: check (workspace, sem banco — regra ADR-0002 D10)
        run: cargo check --workspace
      - name: test — units + contract (sem banco)
        run: cargo test -p api-principal
      - name: test — integração de banco (--ignored, migrações no setup do teste)
        env:
          DATABASE_URL: postgres://studio:test@postgres:5432/studio
        run: cargo test -p api-principal --test datasets_db -- --ignored

  web:
    runs-on: ubuntu-latest
    container:
      image: node:20-slim@sha256:2cf067cfed83d5ea958367df9f966191a942351a2df77d6f0193e162b5febfc0
    env:
      HEPH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # ERRATA (run 2, 2026-09-06): node:20-slim NÃO tem git (base debian-slim
      # puro, não scm-slim — quem tem git é o node:20 completo).
      - name: git
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates
      - name: checkout manual
        run: |
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$HEPH_TOKEN" | base64 -w0)" clone "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" .
          git checkout "$GITHUB_SHA"
      - name: install (lockfile da raiz, workspaces)
        run: npm ci
      - name: build
        run: npm run build --workspace=web

  compose:
    runs-on: ubuntu-latest
    container:
      image: docker:29-cli@sha256:eccaacfeed644c7de222ff047483568cb988dde95476fbaaf10ea2d04921bb66
    env:
      HEPH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # docker:29-cli é alpine: git via apk; busybox base64 não quebra linha.
      - name: git
        run: apk add --no-cache git ca-certificates
      - name: checkout manual
        run: |
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$HEPH_TOKEN" | base64)" clone "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" .
          git checkout "$GITHUB_SHA"
      - name: valida compose (parse puro, sem daemon)
        run: docker compose -f infra/compose.yaml -f infra/compose.integ.yaml config -q
      - name: valida compose do spike
        run: docker compose -f infra/compose.spike.yaml config -q
