engines:
  - { engine: yolo, image: 'hephaestus/trainer-yolo:local' }
  - { engine: diffusion, image: 'hephaestus/trainer-difusao:local' }
  - { engine: difusao, image: 'hephaestus/trainer-difusao:local' }
  - { engine: clip, image: 'hephaestus/trainer-clip:local' }
