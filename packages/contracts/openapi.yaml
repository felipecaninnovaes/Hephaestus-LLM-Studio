              schema: { $ref: "#/components/schemas/AutotrackerPreviewResponse" }
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "Job inexistente, não-UUID, não-autotracker ou artefato ausente (`code: not_found`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "Job não está `done` (`code: job_not_done`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "Manager indisponível (`code: queue_unavailable`) ou storage indisponível (`code: storage_unavailable`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/jobs/{id}/autotracker/apply:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: "PK do job. UUID inválido ⇒ 404 `not_found` (D8)."
    post:
      operationId: applyAutotrackerBoxes
      tags: [jobs]
      summary: Aplica boxes do autotracker ao dataset
      description: |
        Ingest do artefato `boxes.json` de um job autotracker `done` no dataset
        associado (ADR-0008 D1/D1a). Merge dirigido por origem: `overwrite=false`
        (default) preserva manuais e substitui boxes `autotracker`; `overwrite=true`
        substituição total. Cap 1000/imagem; classes e imagens inexistentes são
        skippadas (contagem honesta).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutotrackerApplyRequest" }
      responses:
        "200":
          description: Boxes aplicadas.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutotrackerApplyResponse" }
        "400":
          description: "Body malformado, `imageId` não-UUID ou `boxes.json` inválido (`code: invalid_request`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "Job inexistente, não-UUID, não-autotracker, artefato `boxes.json` ausente ou `imageId` não é imagem ativa do dataset (`code: not_found`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "Job não está `done` (`code: job_not_done`) ou dataset_id null/deletado (`code: dataset_not_ready`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "Manager indisponível (`code: queue_unavailable`) ou storage indisponível (`code: storage_unavailable`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

