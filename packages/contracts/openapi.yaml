          description: Job de geração criado e enfileirado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmitJobResponse" }
        "400":
          description: "Body malformado, parâmetros inválidos ou engine do modelo incompatível (`code: invalid_request`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "Modelo de pesos LoRA inexistente (`code: not_found`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "Manager indisponível (`code: queue_unavailable`)."
