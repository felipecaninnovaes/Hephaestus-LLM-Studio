              schema: { $ref: "#/components/schemas/Error" }

  /api/jobs/predict:
    post:
      operationId: submitPredictJob
      tags: [jobs]
      summary: Submete job de inferência YOLO
      description: |
        Cria job de predict YOLO (ADR-0013 D0/D1/D8). Valida modelId (UUID),
        conf (0..1), verifica readiness do dataset (category=yolo, ≥1 imagem —
        classes NÃO obrigatórias), materializa package, e envia ao manager com
        kind='yolo_predict', engine='yolo', mode='predict'.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PredictJobRequest" }
      responses:
        "202":
          description: Job criado e enfileirado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmitJobResponse" }
        "400":
          description: "Body malformado, campos desconhecidos, modelId não-UUID, conf fora de 0..1 ou engine do modelo ≠ yolo (validado no manager) (`code: invalid_request`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "Dataset ou modelId inexistente, ou datasetId não-UUID (`code: not_found`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "Dataset não pronto para predict — category≠yolo ou 0 imagens ativas (`code: dataset_not_ready`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "Manager indisponível (`code: queue_unavailable`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/jobs/autotracker:
    post:
      operationId: submitAutotrackerJob
      tags: [jobs]
      summary: Submete job de autotrack
      description: |
        Cria job de autotrack (ADR-0008 D0/D3, ADR-0014 D2/D6). Valida modelo (mock apenas),
        conf (0..1), modelId opcional (UUID → job real com pesos world), verifica readiness do
        dataset (category=yolo, ≥1 classe, ≥1 imagem), materializa package, e envia ao manager.
        Erros mapeados: NotFound→404 (modelId inexistente), InvalidRequest→400 (engine≠world),
        Unavailable→503; compensação do package em todos os braços de erro.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutotrackerJobRequest" }
      responses:
        "202":
          description: Job criado e enfileirado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmitJobResponse" }
        "400":
          description: "Body malformado, campos desconhecidos, parâmetros inválidos ou modelId não-UUID (`code: invalid_request`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: "Sem sessão válida (`code: unauthorized`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "Dataset inexistente, datasetId não-UUID ou modelId inexistente na tabela `models` (`code: not_found`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "Dataset não pronto para autotrack — category≠yolo, 0 classes ou 0 imagens (`code: dataset_not_ready`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "Manager indisponível (`code: queue_unavailable`) ou storage indisponível (`code: storage_unavailable`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/jobs/{id}/autotracker/preview:
    parameters:
