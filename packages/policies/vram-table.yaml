defaults:
  headroom_gb: 2
  measure_margin: 1.25
  default_train_gb: 16
entries:
  - { engine: difusao, model: flux2-klein-9b-8bit, mode: infer, vram_min_gb: 16 }
  - { engine: difusao, model: flux2-klein-9b, mode: train, vram_min_gb: 28 }
  - { engine: difusao, model: sdxl-1.0, mode: train, vram_min_gb: 20 }
  - { engine: yolo, model: yolo11n, mode: train, vram_min_gb: 6 }
  # Emenda G.7 (ADR-0010 D9): yolo11n=6 com headroom=2 fecha em 8GB — cabe na
  # RTX 3060 (12GB) mas NÃO cabe na GTX 1660 Super (6GB físicos). Na 1660S,
  # yolo11n com batch=8/imgsz=640 ≈ 4-5GB (provado por falha honesta: yolo11x
  # batch=32 imgsz=640 OOM na 3060; a 1660S só roda yolo11n batch reduzido).
  # Revisão de entradas/headroom na fatia de policy VRAM aplicada.
  - { engine: yolo, model: yolo11m, mode: train, vram_min_gb: 10 }
  # yolo11m=10 + headroom=2 = 12GB → exato na RTX 3060 (no limite, validar no smoke).
  - { engine: clip, model: ViT-B-32, mode: train, vram_min_gb: 10 }
